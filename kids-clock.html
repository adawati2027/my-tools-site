<title>Learn to Tell the Time — Kids Clock Game | Adawati</title>
<meta name="description" content="Interactive clock game for kids ages 5-9: read the clock face and choose the right time. O'clock and half-hour practice. Free, no signup.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://adawati.space/kids-clock.html">
<link rel="stylesheet" href="style.css">
<style>
.clock-wrap{display:flex;justify-content:center;margin:12px 0;}
.clock-svg{filter:drop-shadow(0 4px 16px rgba(0,0,0,.12));}
.clock-levels{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.clock-lvl{padding:8px 18px;border-radius:99px;border:2px solid transparent;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;background:var(--surface-2);color:var(--text);}
.clock-lvl.active{background:var(--primary);color:#fff;}
.clock-choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:12px 0;}
.clock-choice{padding:12px 18px;border-radius:14px;border:3px solid var(--border);background:var(--surface-2);font-size:22px;font-weight:900;cursor:pointer;font-family:inherit;transition:all .15s;}
.clock-choice:hover{transform:scale(1.07);border-color:var(--primary);}
.clock-choice.correct{background:#dcfce7;border-color:#22c55e;color:#15803d;}
.clock-choice.wrong{background:#fee2e2;border-color:#ef4444;color:#b91c1c;}
.clock-score{font-size:14px;font-weight:700;color:var(--text-muted);text-align:center;margin-bottom:6px;}
.clock-done{text-align:center;padding:24px;background:linear-gradient(135deg,#f0fdf4,#dcfce7);border-radius:16px;border:2px solid #22c55e;}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-container">
  <a href="index.html" class="nav-brand">Adawati</a>
  <div class="nav-links"><a href="kids-learn.html" id="navKids">🧒 Kids</a><a href="index.html" id="navHome">Home</a></div>
</div></nav>

<main><div class="tool-page">
  <div class="page-header"><a href="kids-learn.html" id="backToKids">← Back to Kids</a></div>
  <div class="card">
    <div class="card-icon" style="background:#f0fdf4;">🕐</div>
    <h1 class="card-title">Tell the Time!</h1>
    <div class="card-subtitle" id="clockSubtitle">Clock Reading Game — Ages 5–9</div>
    <div class="divider"></div>

    <div class="clock-levels">
      <button class="clock-lvl active" onclick="setLevel('oclock')" id="lvlO">🕐 O'Clock</button>
      <button class="clock-lvl" onclick="setLevel('half')" id="lvlH">🕧 Half Hours</button>
      <button class="clock-lvl" onclick="setLevel('quarter')" id="lvlQ">🕑 Quarters</button>
    </div>

    <div id="gameArea">
      <div class="clock-score" id="cScore">Score: 0 / 10</div>
      <div class="clock-wrap">
        <svg id="clockSvg" class="clock-svg" width="200" height="200" viewBox="0 0 200 200">
          <circle cx="100" cy="100" r="95" fill="white" stroke="#e2e8f0" stroke-width="6"/>
          <!-- Hour marks -->
          <g id="marks"></g>
          <!-- Hour numbers -->
          <text x="100" y="22" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">12</text>
          <text x="178" y="105" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">3</text>
          <text x="100" y="188" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">6</text>
          <text x="22" y="105" text-anchor="middle" font-size="13" font-weight="800" fill="#334155">9</text>
          <!-- Hands -->
          <line id="hourHand" x1="100" y1="100" x2="100" y2="50" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>
          <line id="minHand" x1="100" y1="100" x2="100" y2="35" stroke="#6366f1" stroke-width="4" stroke-linecap="round"/>
          <circle cx="100" cy="100" r="6" fill="#1e293b"/>
        </svg>
      </div>
      <div style="text-align:center;font-size:17px;font-weight:700;color:var(--text-muted);margin-bottom:8px;" id="clockQuestion">What time does the clock show?</div>
      <div class="clock-choices" id="cChoices"></div>
      <div style="font-size:20px;font-weight:800;text-align:center;min-height:28px;" id="cFeedback"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;padding:16px;">
    <div style="font-size:14px;font-weight:700;margin-bottom:10px;" id="tipsTitle">📚 Time Tips</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:13px;">
      <div style="background:var(--surface-2);padding:10px;border-radius:8px;" id="tip1"><strong>Short hand</strong> = Hour (where it points)</div>
      <div style="background:var(--surface-2);padding:10px;border-radius:8px;" id="tip2"><strong>Long hand</strong> = Minutes (blue)</div>
      <div style="background:var(--surface-2);padding:10px;border-radius:8px;" id="tip3">Long hand at <strong>12</strong> = O'clock</div>
      <div style="background:var(--surface-2);padding:10px;border-radius:8px;" id="tip4">Long hand at <strong>6</strong> = Half past</div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <a href="kids-math.html" class="btn" style="background:var(--surface-2);color:var(--text);text-decoration:none;" id="linkMath">➕ Math Game</a>
      <a href="kids-learn.html" class="btn" style="background:var(--surface-2);color:var(--text);text-decoration:none;" id="linkAllKids">🧒 All Kids Tools</a>
    </div>
  </div>
</div></main>

<script>
let level='oclock', score=0, qIdx=0, answered=false, currentTime={h:0,m:0};
const TOTAL=10;

const CT = {
  en:{subtitle:'Clock Reading Game — Ages 5–9',lvlO:"🕐 O'Clock",lvlH:'🕧 Half Hours',lvlQ:'🕑 Quarters',
      question:'What time does the clock show?',score:'Score',q:'Q',of:'of',playAgain:'Play Again',
      master:'⏰ Clock Master!',nice:'👍 Nice work!',keep:'💪 Keep practicing!',
      tipsTitle:'📚 Time Tips',tip1:'<strong>Short hand</strong> = Hour (where it points)',tip2:'<strong>Long hand</strong> = Minutes (blue)',
      tip3:'Long hand at <strong>12</strong> = O\'clock',tip4:'Long hand at <strong>6</strong> = Half past',
      mathGame:'➕ Math Game',allKidsTools:'🧒 All Kids Tools',backToKids:'← Back to Kids',kids:'🧒 Kids',home:'Home',
      correctText:v=>`It is ${v}`,
      readable:(h,m)=>m===0?`${h} o'clock`:m===30?`half past ${h}`:m===15?`quarter past ${h}`:m===45?`quarter to ${h===12?1:h+1}`:`${h}:${m}`},
  ar:{subtitle:'لعبة قراءة الساعة — للأطفال من 5 إلى 9 سنوات',lvlO:'🕐 بالضبط',lvlH:'🕧 نصف الساعة',lvlQ:'🕑 الأرباع',
      question:'كم الساعة الآن؟',score:'النتيجة',q:'سؤال',of:'من',playAgain:'العب مجدداً',
      master:'⏰ سيد الساعة!',nice:'👍 عمل جيد!',keep:'💪 استمر في التمرين!',
      tipsTitle:'📚 نصائح عن الساعة',tip1:'<strong>العقرب القصير</strong> = الساعة (إلى أين يشير)',tip2:'<strong>العقرب الطويل</strong> = الدقائق (أزرق)',
      tip3:'العقرب الطويل على <strong>12</strong> = بالضبط',tip4:'العقرب الطويل على <strong>6</strong> = والنصف',
      mathGame:'➕ لعبة الرياضيات',allKidsTools:'🧒 كل أدوات الأطفال',backToKids:'← رجوع للأطفال',kids:'🧒 الأطفال',home:'الرئيسية',
      correctText:v=>`الساعة ${v}`,
      readable:(h,m)=>m===0?`${h} تماماً`:m===30?`${h} والنصف`:m===15?`${h} وربع`:m===45?`${h===12?1:h+1} إلا ربع`:`${h}:${m}`},
  fr:{subtitle:'Jeu de lecture de l\'heure — 5 à 9 ans',lvlO:'🕐 Heures pile',lvlH:'🕧 Demi-heures',lvlQ:'🕑 Quarts',
      question:'Quelle heure indique l\'horloge ?',score:'Score',q:'Q',of:'sur',playAgain:'Rejouer',
      master:'⏰ Maître de l\'horloge !',nice:'👍 Bon travail !',keep:'💪 Continue à t\'entraîner !',
      tipsTitle:'📚 Astuces horaires',tip1:'<strong>Petite aiguille</strong> = Heure (où elle pointe)',tip2:'<strong>Grande aiguille</strong> = Minutes (bleue)',
      tip3:'Grande aiguille sur <strong>12</strong> = Heure pile',tip4:'Grande aiguille sur <strong>6</strong> = Et demie',
      mathGame:'➕ Jeu de calcul',allKidsTools:'🧒 Tous les jeux enfants',backToKids:'← Retour aux jeux enfants',kids:'🧒 Enfants',home:'Accueil',
      correctText:v=>`Il est ${v}`,
      readable:(h,m)=>m===0?`${h} heures`:m===30?`${h} heures et demie`:m===15?`${h} heures et quart`:m===45?`${h===12?1:h+1} heures moins le quart`:`${h}:${m}`},
  es:{subtitle:'Juego de lectura del reloj — 5 a 9 años',lvlO:'🕐 En punto',lvlH:'🕧 Medias horas',lvlQ:'🕑 Cuartos',
      question:'¿Qué hora muestra el reloj?',score:'Puntaje',q:'P',of:'de',playAgain:'Jugar de nuevo',
      master:'⏰ ¡Maestro del reloj!',nice:'👍 ¡Buen trabajo!',keep:'💪 ¡Sigue practicando!',
      tipsTitle:'📚 Consejos de tiempo',tip1:'<strong>Manecilla corta</strong> = Hora (hacia dónde apunta)',tip2:'<strong>Manecilla larga</strong> = Minutos (azul)',
      tip3:'Manecilla larga en <strong>12</strong> = En punto',tip4:'Manecilla larga en <strong>6</strong> = Y media',
      mathGame:'➕ Juego de matemáticas',allKidsTools:'🧒 Todos los juegos infantiles',backToKids:'← Volver a juegos infantiles',kids:'🧒 Niños',home:'Inicio',
      correctText:v=>`Son las ${v}`,
      readable:(h,m)=>m===0?`${h} en punto`:m===30?`${h} y media`:m===15?`${h} y cuarto`:m===45?`${h===12?1:h+1} menos cuarto`:`${h}:${m}`},
  de:{subtitle:'Uhrzeit-Lesespiel — 5 bis 9 Jahre',lvlO:'🕐 Volle Stunde',lvlH:'🕧 Halbe Stunden',lvlQ:'🕑 Viertelstunden',
      question:'Wie viel Uhr zeigt die Uhr?',score:'Punkte',q:'F',of:'von',playAgain:'Nochmal spielen',
      master:'⏰ Uhrzeit-Meister!',nice:'👍 Gut gemacht!',keep:'💪 Übe weiter!',
      tipsTitle:'📚 Zeit-Tipps',tip1:'<strong>Kurzer Zeiger</strong> = Stunde (wohin er zeigt)',tip2:'<strong>Langer Zeiger</strong> = Minuten (blau)',
      tip3:'Langer Zeiger auf <strong>12</strong> = Volle Stunde',tip4:'Langer Zeiger auf <strong>6</strong> = Halb',
      mathGame:'➕ Rechenspiel',allKidsTools:'🧒 Alle Kinderspiele',backToKids:'← Zurück zu Kinderspielen',kids:'🧒 Kinder',home:'Startseite',
      correctText:v=>`Es ist ${v}`,
      readable:(h,m)=>{
        const NUM=['zwölf','eins','zwei','drei','vier','fünf','sechs','sieben','acht','neun','zehn','elf','zwölf'];
        const next=h===12?1:h+1;
        if(m===0) return `${NUM[h]} Uhr`;
        if(m===30) return `halb ${NUM[next]}`;
        if(m===15) return `Viertel nach ${NUM[h]}`;
        if(m===45) return `Viertel vor ${NUM[next]}`;
        return `${h}:${m}`;
      }},
  ru:{subtitle:'Игра на чтение часов — от 5 до 9 лет',lvlO:'🕐 Ровно',lvlH:'🕧 Полчаса',lvlQ:'🕑 Четверти',
      question:'Сколько времени показывают часы?',score:'Счёт',q:'Вопрос',of:'из',playAgain:'Играть снова',
      master:'⏰ Мастер часов!',nice:'👍 Отличная работа!',keep:'💪 Продолжай тренироваться!',
      tipsTitle:'📚 Советы о времени',tip1:'<strong>Короткая стрелка</strong> = Час (куда указывает)',tip2:'<strong>Длинная стрелка</strong> = Минуты (синяя)',
      tip3:'Длинная стрелка на <strong>12</strong> = Ровно',tip4:'Длинная стрелка на <strong>6</strong> = Половина',
      mathGame:'➕ Игра с числами',allKidsTools:'🧒 Все детские игры',backToKids:'← Назад к детским играм',kids:'🧒 Детям',home:'Главная',
      correctText:v=>`Сейчас ${v}`,
      readable:(h,m)=>{
        const ORD=['двенадцатого','первого','второго','третьего','четвёртого','пятого','шестого','седьмого','восьмого','девятого','десятого','одиннадцатого','двенадцатого'];
        const next=h===12?1:h+1;
        if(m===0) return `${h}:00`;
        if(m===30) return `половина ${ORD[next]}`;
        if(m===15) return `четверть ${ORD[next]}`;
        if(m===45) return `без четверти ${ORD[next]}`;
        return `${h}:${m}`;
      }},
};
const _PAGE_LANG = (document.documentElement.lang && CT[document.documentElement.lang]) ? document.documentElement.lang : 'en';
let currentLang=_PAGE_LANG;
function ct(k){return (CT[currentLang]||CT.en)[k];}

function setLevel(l){
  level=l;
  ['oclock','half','quarter'].forEach(x=>{
    const id=x==='oclock'?'lvlO':x==='half'?'lvlH':'lvlQ';
    document.getElementById(id).classList.toggle('active',x===l);
  });
  startGame();
}

function randTime(){
  const h=Math.floor(Math.random()*12)||12;
  let m=0;
  if(level==='half') m=Math.random()>0.5?30:0;
  if(level==='quarter'){const opts=[0,15,30,45];m=opts[Math.floor(Math.random()*4)];}
  return {h,m};
}

function fmt(h,m){
  return m===0?`${h}:00`:m<10?`${h}:0${m}`:`${h}:${m}`;
}

function readableTime(h,m){
  return ct('readable')(h,m);
}

function drawClock(h,m){
  const hDeg=(h%12)*30 + m*0.5;
  const mDeg=m*6;
  const hRad=(hDeg-90)*Math.PI/180;
  const mRad=(mDeg-90)*Math.PI/180;
  const hLen=45, mLen=60;
  const hx=100+hLen*Math.cos(hRad);
  const hy=100+hLen*Math.sin(hRad);
  const mx=100+mLen*Math.cos(mRad);
  const my=100+mLen*Math.sin(mRad);
  document.getElementById('hourHand').setAttribute('x2',hx);
  document.getElementById('hourHand').setAttribute('y2',hy);
  document.getElementById('minHand').setAttribute('x2',mx);
  document.getElementById('minHand').setAttribute('y2',my);
}

function wrongTimes(correct,n){
  const s=new Set([fmt(correct.h,correct.m)]);
  const opts=[0,15,30,45];
  let itr=0;
  while(s.size<n+1&&itr<100){
    itr++;
    const h=Math.floor(Math.random()*12)||12;
    let m=0;
    if(level==='half') m=Math.random()>0.5?30:0;
    else if(level==='quarter') m=opts[Math.floor(Math.random()*4)];
    const f=fmt(h,m);
    if(f!==fmt(correct.h,correct.m)) s.add(f);
  }
  return [...s].sort(()=>Math.random()-.5);
}

function startGame(){
  score=0; qIdx=0; answered=false;
  renderQ();
}

function renderQ(){
  if(qIdx>=TOTAL){
    const pct=Math.round(score/TOTAL*100);
    document.getElementById('gameArea').innerHTML=`
      <div class="clock-done">
        <div style="font-size:60px;">🏆</div>
        <div style="font-size:22px;font-weight:900;color:#15803d;margin:10px 0;">${pct>=80?ct('master'):pct>=50?ct('nice'):ct('keep')}</div>
        <div style="font-size:15px;color:var(--text-muted);">${ct('score')}: ${score} / ${TOTAL} (${pct}%)</div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="startGame()">${ct('playAgain')}</button>
      </div>`;
    return;
  }
  currentTime=randTime();
  const choices=wrongTimes(currentTime,3);
  drawClock(currentTime.h,currentTime.m);
  document.getElementById('cScore').textContent=`${ct('score')}: ${score} / ${TOTAL} | ${ct('q')} ${qIdx+1} ${ct('of')} ${TOTAL}`;
  document.getElementById('cChoices').innerHTML=choices.map(c=>
    `<button class="clock-choice" onclick="answerQ(this,'${c}','${fmt(currentTime.h,currentTime.m)}')">${c}</button>`
  ).join('');
  document.getElementById('cFeedback').textContent='';
  answered=false;
}

const SPEECH_LANG_CODES = {ar:'ar-SA',en:'en-US',fr:'fr-FR',es:'es-ES',de:'de-DE',ru:'ru-RU'};
function answerQ(btn,chosen,correct){
  if(answered) return;
  answered=true;
  const rt=readableTime(currentTime.h,currentTime.m);
  if(chosen===correct){
    btn.classList.add('correct');
    score++;
    document.getElementById('cFeedback').textContent=`✅ ${rt}`;
    if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(ct('correctText')(rt));u.lang=SPEECH_LANG_CODES[currentLang]||'en-US';speechSynthesis.speak(u);}
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.clock-choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct');});
    document.getElementById('cFeedback').textContent=`❌ ${rt}`;
  }
  setTimeout(()=>{qIdx++;renderQ();},1100);
}

function updateStaticText(){
  document.documentElement.dir=currentLang==='ar'?'rtl':'ltr';
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
  const setHtml=(id,val)=>{const el=document.getElementById(id);if(el)el.innerHTML=val;};
  set('clockSubtitle',ct('subtitle'));
  set('lvlO',ct('lvlO'));
  set('lvlH',ct('lvlH'));
  set('lvlQ',ct('lvlQ'));
  set('clockQuestion',ct('question'));
  set('tipsTitle',ct('tipsTitle'));
  setHtml('tip1',ct('tip1'));
  setHtml('tip2',ct('tip2'));
  setHtml('tip3',ct('tip3'));
  setHtml('tip4',ct('tip4'));
  set('linkMath',ct('mathGame'));
  set('linkAllKids',ct('allKidsTools'));
  set('backToKids',ct('backToKids'));
  set('navKids',ct('kids'));
  set('navHome',ct('home'));
}

document.addEventListener('DOMContentLoaded',()=>{
  const origSet=window.setLang;
  window.setLang=function(lang){
    origSet&&origSet(lang);
    currentLang=lang;
    updateStaticText();
    renderQ();
  };
  window.onLangChange=function(lang){currentLang=lang;updateStaticText();renderQ();};
  updateStaticText();
  startGame();
});
</script>
<script src="i18n.js?v=39" defer></script>
</body></html>
