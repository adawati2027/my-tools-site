<title>Kids Math Game — Addition & Subtraction | Adawati</title>
<meta name="description" content="Free math game for kids ages 6-9: addition and subtraction with emoji visuals and instant feedback. No signup, no ads in game.">

<link rel="stylesheet" href="style.css">
<style>
.km-level{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
.km-btn{padding:10px 22px;border-radius:99px;border:2px solid transparent;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;background:var(--surface-2);color:var(--text);}
.km-btn.active{background:var(--primary);color:#fff;}
.km-visual{font-size:36px;min-height:56px;text-align:center;line-height:1.4;margin:12px 0;word-break:break-all;}
.km-question{font-size:32px;font-weight:900;text-align:center;color:var(--primary);margin:12px 0;}
.km-choices{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:16px 0;}
.km-choice{min-width:72px;padding:16px;border-radius:14px;border:3px solid var(--border);background:var(--surface-2);font-size:26px;font-weight:900;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;}
.km-choice:hover{transform:scale(1.08);border-color:var(--primary);}
.km-choice.correct{background:#dcfce7;border-color:#22c55e;color:#15803d;}
.km-choice.wrong{background:#fee2e2;border-color:#ef4444;color:#b91c1c;}
.km-feedback{font-size:22px;font-weight:800;text-align:center;min-height:32px;}
.km-score{font-size:14px;font-weight:700;color:var(--text-muted);text-align:center;margin-bottom:8px;}
.km-done{text-align:center;padding:24px;background:linear-gradient(135deg,#fdf4ff,#ede9fe);border-radius:16px;border:2px solid var(--primary);}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-container">
  <a href="index.html" class="nav-brand">Adawati</a>
  <div class="nav-links"><a href="kids-learn.html" id="navKids">🧒 Kids</a><a href="index.html" id="navHome">Home</a></div>
</div></nav>

<main><div class="tool-page">
  <div class="page-header"><a href="kids-learn.html" id="backToKids">← Back to Kids</a></div>
  <div class="card">
    <div class="card-icon" style="background:#fef9c3;">➕</div>
    <h1 class="card-title">Kids Math Game</h1>
    <div class="card-subtitle" id="kmSubtitle">Addition & Subtraction — Ages 6–9</div>
    <div class="divider"></div>

    <div class="km-level">
      <button class="km-btn active" onclick="setLevel('easy')" id="lvlEasy">⭐ Easy (1–10)</button>
      <button class="km-btn" onclick="setLevel('medium')" id="lvlMed">⭐⭐ Medium (1–20)</button>
      <button class="km-btn" onclick="setLevel('hard')" id="lvlHard">⭐⭐⭐ Hard (1–50)</button>
    </div>

    <div id="gameArea">
      <div class="km-score" id="kmScore">Score: 0 / 10</div>
      <div class="km-visual" id="kmVisual"></div>
      <div class="km-question" id="kmQuestion">Loading...</div>
      <div class="km-choices" id="kmChoices"></div>
      <div class="km-feedback" id="kmFeedback"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <a href="kids-times-tables.html" class="btn" style="background:var(--surface-2);color:var(--text);text-decoration:none;" id="linkTimesTables">✖️ Times Tables</a>
      <a href="kids-learn.html" class="btn" style="background:var(--surface-2);color:var(--text);text-decoration:none;" id="linkAllKids">🧒 All Kids Tools</a>
      <a href="kids-spelling.html" class="btn" style="background:var(--surface-2);color:var(--text);text-decoration:none;" id="linkSpelling">🔤 Spelling Bee</a>
    </div>
  </div>
</div></main>

<script>
const EMOJIS = ['🍎','🌸','🚗','🎈','🌟','🍕','🐝','🦋','🌳','🐟'];
let level='easy', score=0, total=10, qIdx=0, answered=false, questions=[];

const KM_T = {
  en:{subtitle:'Addition & Subtraction — Ages 6–9',lvlEasy:'⭐ Easy (1–10)',lvlMed:'⭐⭐ Medium (1–20)',lvlHard:'⭐⭐⭐ Hard (1–50)',
      loading:'Loading...',score:'Score',question:'Question',of:'of',correct:'✅ Correct!',wrong:v=>`❌ The answer is ${v}`,correctSpoken:'Correct!',playAgain:'Play Again',
      amazing:'🎉 Amazing! You\'re a Math Star!',great:'👍 Great job! Keep going!',keep:'💪 Keep practicing!',
      timesTables:'✖️ Times Tables',allKidsTools:'🧒 All Kids Tools',spellingBee:'🔤 Spelling Bee',backToKids:'← Back to Kids',kids:'🧒 Kids',home:'Home'},
  ar:{subtitle:'الجمع والطرح — للأطفال من 6 إلى 9 سنوات',lvlEasy:'⭐ سهل (1–10)',lvlMed:'⭐⭐ متوسط (1–20)',lvlHard:'⭐⭐⭐ صعب (1–50)',
      loading:'جارٍ التحميل...',score:'النتيجة',question:'سؤال',of:'من',correct:'✅ إجابة صحيحة!',wrong:v=>`❌ الإجابة هي ${v}`,correctSpoken:'إجابة صحيحة!',playAgain:'العب مجدداً',
      amazing:'🎉 رائع! أنت نجم الرياضيات!',great:'👍 عمل رائع! استمر!',keep:'💪 استمر في التمرين!',
      timesTables:'✖️ جدول الضرب',allKidsTools:'🧒 كل أدوات الأطفال',spellingBee:'🔤 مسابقة التهجئة',backToKids:'← رجوع للأطفال',kids:'🧒 الأطفال',home:'الرئيسية'},
  fr:{subtitle:'Addition et soustraction — 6 à 9 ans',lvlEasy:'⭐ Facile (1–10)',lvlMed:'⭐⭐ Moyen (1–20)',lvlHard:'⭐⭐⭐ Difficile (1–50)',
      loading:'Chargement...',score:'Score',question:'Question',of:'sur',correct:'✅ Correct !',wrong:v=>`❌ La réponse est ${v}`,correctSpoken:'Correct !',playAgain:'Rejouer',
      amazing:'🎉 Incroyable ! Tu es une star des maths !',great:'👍 Bon travail ! Continue !',keep:'💪 Continue à t\'entraîner !',
      timesTables:'✖️ Tables de multiplication',allKidsTools:'🧒 Tous les jeux enfants',spellingBee:'🔤 Concours d\'orthographe',backToKids:'← Retour aux jeux enfants',kids:'🧒 Enfants',home:'Accueil'},
  es:{subtitle:'Suma y resta — 6 a 9 años',lvlEasy:'⭐ Fácil (1–10)',lvlMed:'⭐⭐ Medio (1–20)',lvlHard:'⭐⭐⭐ Difícil (1–50)',
      loading:'Cargando...',score:'Puntaje',question:'Pregunta',of:'de',correct:'✅ ¡Correcto!',wrong:v=>`❌ La respuesta es ${v}`,correctSpoken:'¡Correcto!',playAgain:'Jugar de nuevo',
      amazing:'🎉 ¡Increíble! ¡Eres una estrella de las matemáticas!',great:'👍 ¡Buen trabajo! ¡Sigue así!',keep:'💪 ¡Sigue practicando!',
      timesTables:'✖️ Tablas de multiplicar',allKidsTools:'🧒 Todos los juegos infantiles',spellingBee:'🔤 Concurso de ortografía',backToKids:'← Volver a juegos infantiles',kids:'🧒 Niños',home:'Inicio'},
  de:{subtitle:'Addition und Subtraktion — 6 bis 9 Jahre',lvlEasy:'⭐ Leicht (1–10)',lvlMed:'⭐⭐ Mittel (1–20)',lvlHard:'⭐⭐⭐ Schwer (1–50)',
      loading:'Wird geladen...',score:'Punkte',question:'Frage',of:'von',correct:'✅ Richtig!',wrong:v=>`❌ Die Antwort ist ${v}`,correctSpoken:'Richtig!',playAgain:'Nochmal spielen',
      amazing:'🎉 Fantastisch! Du bist ein Mathe-Star!',great:'👍 Gut gemacht! Weiter so!',keep:'💪 Übe weiter!',
      timesTables:'✖️ Einmaleins',allKidsTools:'🧒 Alle Kinderspiele',spellingBee:'🔤 Buchstabierwettbewerb',backToKids:'← Zurück zu Kinderspielen',kids:'🧒 Kinder',home:'Startseite'},
  ru:{subtitle:'Сложение и вычитание — от 6 до 9 лет',lvlEasy:'⭐ Легко (1–10)',lvlMed:'⭐⭐ Средне (1–20)',lvlHard:'⭐⭐⭐ Сложно (1–50)',
      loading:'Загрузка...',score:'Счёт',question:'Вопрос',of:'из',correct:'✅ Правильно!',wrong:v=>`❌ Правильный ответ: ${v}`,correctSpoken:'Правильно!',playAgain:'Играть снова',
      amazing:'🎉 Потрясающе! Ты звезда математики!',great:'👍 Отличная работа! Продолжай!',keep:'💪 Продолжай тренироваться!',
      timesTables:'✖️ Таблица умножения',allKidsTools:'🧒 Все детские игры',spellingBee:'🔤 Конкурс правописания',backToKids:'← Назад к детским играм',kids:'🧒 Детям',home:'Главная'},
};
const _PAGE_LANG = (document.documentElement.lang && KM_T[document.documentElement.lang]) ? document.documentElement.lang : 'en';
let currentLang=_PAGE_LANG;
function kmt(k){return (KM_T[currentLang]||KM_T.en)[k];}

const SPEECH_LANG_CODES = {ar:'ar-SA',en:'en-US',fr:'fr-FR',es:'es-ES',de:'de-DE',ru:'ru-RU'};

function setLevel(l){
  level=l;
  ['easy','medium','hard'].forEach(x=>{
    document.getElementById('lvl'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===l);
  });
  startGame();
}

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

function makeQ(){
  let max = level==='easy'?10:level==='medium'?20:50;
  const op = Math.random()>0.5 ? '+' : '-';
  let a,b;
  if(op==='+'){
    a=randInt(1,max-1); b=randInt(1,max-a);
  } else {
    a=randInt(2,max); b=randInt(1,a);
  }
  const ans = op==='+' ? a+b : a-b;
  return {a,b,op,ans};
}

function makeChoices(ans, max){
  const s=new Set([ans]);
  while(s.size<4){
    let v=ans+randInt(-5,5);
    if(v>=0&&v!==ans) s.add(v);
  }
  return [...s].sort(()=>Math.random()-.5);
}

function startGame(){
  score=0; qIdx=0; answered=false;
  questions=Array.from({length:total},makeQ);
  renderQ();
}

function renderQ(){
  if(qIdx>=total){
    const pct=Math.round(score/total*100);
    const msg=pct>=80?kmt('amazing'):pct>=50?kmt('great'):kmt('keep');
    document.getElementById('gameArea').innerHTML=`
      <div class="km-done">
        <div style="font-size:60px;">🏆</div>
        <div style="font-size:22px;font-weight:900;color:var(--primary);margin:10px 0;">${msg}</div>
        <div style="font-size:16px;color:var(--text-muted);">${kmt('score')}: ${score} / ${total} (${pct}%)</div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="startGame()">${kmt('playAgain')}</button>
      </div>`;
    return;
  }
  const q=questions[qIdx];
  const emoji=EMOJIS[qIdx%EMOJIS.length];
  let visual='';
  if(q.op==='+'&&q.a+q.b<=20){
    visual=`<div>${emoji.repeat(q.a)}</div><div style="font-size:24px;">+</div><div>${emoji.repeat(q.b)}</div>`;
  } else if(q.op==='-'&&q.a<=20){
    visual=`<div>${emoji.repeat(q.a)}</div><div style="font-size:24px;">−</div><div style="text-decoration:line-through;opacity:.4;">${emoji.repeat(q.b)}</div>`;
  }
  const choices=makeChoices(q.ans, level==='easy'?10:level==='medium'?20:50);
  document.getElementById('kmScore').textContent=`${kmt('score')}: ${score} / ${total} | ${kmt('question')} ${qIdx+1} ${kmt('of')} ${total}`;
  document.getElementById('kmVisual').innerHTML=visual;
  document.getElementById('kmQuestion').textContent=`${q.a} ${q.op==='+'?'+':'−'} ${q.b} = ?`;
  document.getElementById('kmChoices').innerHTML=choices.map(c=>
    `<button class="km-choice" onclick="answerQ(this,${c},${q.ans})">${c}</button>`
  ).join('');
  document.getElementById('kmFeedback').textContent='';
  answered=false;
}

function answerQ(btn,chosen,correct){
  if(answered) return;
  answered=true;
  if(chosen===correct){
    btn.classList.add('correct');
    score++;
    document.getElementById('kmFeedback').textContent=kmt('correct');
    if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(kmt('correctSpoken'));u.lang=SPEECH_LANG_CODES[currentLang]||'en-US';speechSynthesis.speak(u);}
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.km-choice').forEach(b=>{if(parseInt(b.textContent)===correct) b.classList.add('correct');});
    document.getElementById('kmFeedback').textContent=kmt('wrong')(correct);
  }
  setTimeout(()=>{qIdx++;renderQ();},1000);
}

function updateStaticText(){
  document.documentElement.dir=currentLang==='ar'?'rtl':'ltr';
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
  set('kmSubtitle',kmt('subtitle'));
  set('lvlEasy',kmt('lvlEasy'));
  set('lvlMed',kmt('lvlMed'));
  set('lvlHard',kmt('lvlHard'));
  set('linkTimesTables',kmt('timesTables'));
  set('linkAllKids',kmt('allKidsTools'));
  set('linkSpelling',kmt('spellingBee'));
  set('backToKids',kmt('backToKids'));
  set('navKids',kmt('kids'));
  set('navHome',kmt('home'));
}

document.addEventListener('DOMContentLoaded',()=>{
  const origSet=window.setLang;
  window.setLang=function(lang){
    origSet&&origSet(lang);
    currentLang=lang;
    updateStaticText();
    renderQ();
  };
  window.onLangChange=function(lang){currentLang=lang;updateStaticText();renderQ();};
  updateStaticText();
  startGame();
});
</script>
<script src="i18n.js?v=39" defer></script>
</body></html>
