const _PAGE_LANG = (document.documentElement.lang && SCI_UI[document.documentElement.lang]) ? document.documentElement.lang : 'en';
let currentLang=_PAGE_LANG;
function sui(k){return (SCI_UI[currentLang]||SCI_UI.en)[k];}
function itemT(item){return item[currentLang]||item.en;}

const SPEECH_LANG_CODES = {ar:'ar-SA',en:'en-US',fr:'fr-FR',es:'es-ES',de:'de-DE',ru:'ru-RU'};
let section='planets', idx=0, quizQ=[], qIdx=0, qScore=0, qAnswered=false;

function setSection(s){
  section=s;
  idx=0;
  ['planets','body','nature','quiz'].forEach(x=>{
    document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===s);
  });
  if(s==='quiz'){
    document.getElementById('learnArea').style.display='none';
    document.getElementById('quizArea').style.display='';
    startQuiz();
  } else {
    document.getElementById('learnArea').style.display='';
    document.getElementById('quizArea').style.display='none';
    renderCard();
  }
}

function renderCard(){
  const d=DATA[section];
  const item=d[idx];
  const t=itemT(item);
  document.getElementById('sciCard').style.background=
    section==='planets'?'linear-gradient(135deg,#0f172a,#1e3a5f)':
    section==='body'?'linear-gradient(135deg,#fff1f2,#fecdd3)':
    'linear-gradient(135deg,#f0fdf4,#bbf7d0)';
  document.getElementById('sciIcon').textContent=item.icon;
  document.getElementById('sciName').style.color=section==='planets'?'#93c5fd':'var(--primary)';
  document.getElementById('sciName').textContent=t.name;
  document.getElementById('sciFact').style.color=section==='planets'?'#cbd5e1':'var(--text-muted)';
  document.getElementById('sciFact').textContent=t.fact;
  document.getElementById('sciProg').textContent=`${idx+1} / ${d.length}`;
}

function speakCard(){
  const item=DATA[section][idx];
  const t=itemT(item);
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(`${t.name}. ${t.fact}`);
  u.lang=SPEECH_LANG_CODES[currentLang]||'en-US'; u.rate=0.85;
  speechSynthesis.speak(u);
}

function prev(){const d=DATA[section];idx=(idx-1+d.length)%d.length;renderCard();}
function next(){const d=DATA[section];idx=(idx+1)%d.length;renderCard();}

function startQuiz(){
  const all=[...DATA.planets,...DATA.body,...DATA.nature];
  quizQ=[...all].sort(()=>Math.random()-.5).slice(0,15);
  qIdx=0; qScore=0; qAnswered=false;
  renderQuiz();
}

function renderQuiz(){
  if(qIdx>=quizQ.length){
    const pct=Math.round(qScore/quizQ.length*100);
    document.getElementById('quizArea').innerHTML=`
      <div style="text-align:center;padding:24px;background:linear-gradient(135deg,#eff6ff,#dbeafe);border-radius:16px;">
        <div style="font-size:60px;">🔭</div>
        <div style="font-size:22px;font-weight:900;color:var(--primary);margin:10px 0;">${pct>=80?sui('genius'):pct>=50?sui('good'):sui('keep')}</div>
        <div style="font-size:15px;color:var(--text-muted);">${sui('score')}: ${qScore} / ${quizQ.length} (${pct}%)</div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="startQuiz()">${sui('playAgain')}</button>
      </div>`;
    return;
  }
  const q=quizQ[qIdx];
  const t=itemT(q);
  document.getElementById('qScore').textContent=`${sui('score')}: ${qScore} / ${quizQ.length} | ${sui('q')} ${qIdx+1} ${sui('of')} ${quizQ.length}`;
  document.getElementById('qIcon').textContent=q.icon;
  document.getElementById('qText').textContent=t.q;
  document.getElementById('qChoices').innerHTML=t.choices.map((c,i)=>
    `<button class="sci-choice" onclick="answerQuiz(this,${i})">${c}</button>`
  ).join('');
  document.getElementById('qFeedback').textContent='';
  qAnswered=false;
}

function answerQuiz(btn,chosenIdx){
  if(qAnswered) return;
  qAnswered=true;
  const q=quizQ[qIdx];
  const t=itemT(q);
  const correctText=t.choices[q.ansIdx];
  if(chosenIdx===q.ansIdx){btn.classList.add('correct');qScore++;document.getElementById('qFeedback').textContent=sui('correct');}
  else{btn.classList.add('wrong');document.querySelectorAll('.sci-choice').forEach(b=>{if(b.textContent===correctText)b.classList.add('correct');});document.getElementById('qFeedback').textContent=`❌ ${correctText}`;}
  setTimeout(()=>{qIdx++;renderQuiz();},1100);
}

function updateStaticText(){
  document.documentElement.dir=currentLang==='ar'?'rtl':'ltr';
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
  set('sciSubtitle',sui('subtitle'));
  set('tabPlanets',sui('tabPlanets'));
  set('tabBody',sui('tabBody'));
  set('tabNature',sui('tabNature'));
  set('tabQuiz',sui('tabQuiz'));
  set('tapToHear',sui('tapToHear'));
  set('linkFlags',sui('flagsQuiz'));
  set('linkAllKids',sui('allKidsTools'));
  set('backToKids',sui('backToKids'));
  set('navKids',sui('kids'));
  set('navHome',sui('home'));
}

document.addEventListener('DOMContentLoaded',()=>{
  const origSet=window.setLang;
  window.setLang=function(lang){
    origSet&&origSet(lang);
    currentLang=lang;
    updateStaticText();
    if(section==='quiz') renderQuiz(); else renderCard();
  };
  window.onLangChange=function(lang){currentLang=lang;updateStaticText();if(section==='quiz')renderQuiz();else renderCard();};
  updateStaticText();
  renderCard();
});
</script>
<script src="i18n.js?v=42" defer></script>
</body></html>
