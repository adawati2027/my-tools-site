<main><div class="tool-page">
  <div class="page-header"><a href="us/" id="backLink">→</a></div>

  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;">
      <div class="card-icon" style="background:#fdf4ff;">💍</div>
      <button id="langToggleBtn" onclick="toggleLang()" style="font-size:12px;padding:6px 12px;border:1px solid var(--border);border-radius:99px;background:var(--surface-2);color:var(--text);cursor:pointer;">English</button>
    </div>
    <h1 class="card-title" data-t="page_title">Wedding Cost Calculator — USA</h1>
    <div class="card-subtitle" data-t="page_sub">Add up every wedding expense in one place</div>
    <div class="divider"></div>

    <div class="row">
      <div><label data-t="lbl_venue">القاعة والضيافة (Venue & Catering)</label><input type="number" id="venue" placeholder="0" min="0" step="any" oninput="calc()"></div>
      <div><label data-t="lbl_photography">التصوير والفيديو</label><input type="number" id="photography" placeholder="0" min="0" step="any" oninput="calc()"></div>
    </div>

    <div class="row">
      <div><label data-t="lbl_attire">فستان العروس وبدلة العريس</label><input type="number" id="attire" placeholder="0" min="0" step="any" oninput="calc()"></div>
      <div><label data-t="lbl_rings">الخواتم (Rings)</label><input type="number" id="rings" placeholder="0" min="0" step="any" oninput="calc()"></div>
    </div>

    <div class="row">
      <div><label data-t="lbl_flowers">الزهور والديكور</label><input type="number" id="flowers" placeholder="0" min="0" step="any" oninput="calc()"></div>
      <div><label data-t="lbl_entertainment">الموسيقى والترفيه</label><input type="number" id="entertainment" placeholder="0" min="0" step="any" oninput="calc()"></div>
    </div>

    <div class="row">
      <div><label data-t="lbl_honeymoon">شهر العسل</label><input type="number" id="honeymoon" placeholder="0" min="0" step="any" oninput="calc()"></div>
      <div><label data-t="lbl_other">بنود أخرى</label><input type="number" id="other" placeholder="0" min="0" step="any" oninput="calc()"></div>
    </div>

    <div class="divider"></div>
    <label data-t="months_lbl">How many months until you need the full amount? (optional)</label>
    <input type="number" id="months" placeholder="12" min="1" step="1" oninput="calc()">

    <div id="weddingResult" style="display:none;margin-top:20px;">
      <div class="result-box show success" style="margin-top:0;">
        <div class="result-value" id="totalCost"></div>
        <div class="result-label" data-t="total_lbl">Total estimated cost</div>
      </div>
      <div id="monthlyBox" style="display:none;margin-top:12px;">
        <div class="stat-grid">
          <div class="stat-box" style="background:#eff6ff;"><div class="stat-val" id="monthlySaving" style="color:#2563eb;"></div><div class="stat-lbl" data-t="monthly_lbl">Needed savings per month</div></div>
        </div>
      </div>
      <div style="margin-top:12px;padding:14px;background:var(--surface-2);border-radius:var(--radius-sm);font-size:14px;line-height:2;" id="breakdown"></div>

<script>

const WT = {
  ar: {
    page_title: "حاسبة تكلفة الزواج — أمريكا 🇺🇸",
    page_sub: 'اجمع كل بنود العرس بمكان واحد',
    months_lbl: 'خلال كم شهر بدك تجمع المبلغ؟ (اختياري)',
    total_lbl: 'التكلفة الكاملة المتوقعة',
    monthly_lbl: 'لازم توفر بالشهر',
    faq_title: '❓ أسئلة شائعة',
    faq_q1: "شو متوسط تكلفة الزواج بأمريكا؟",
    faq_a1: "حسب دراسة The Knot لعام 2026 (أكثر من 10,000 زوجين تزوجوا 2025)، متوسط تكلفة الزواج بأمريكا 34,200 دولار، بمعدل 292 دولار للضيف الواحد. بس الرقم الوسيط (نص الأزواج فوقه ونص تحته) أقرب لـ20,000-25,000 دولار، وهو الأقرب لواقع معظم الأزواج بالمدن المتوسطة والضواحي.",
    faq_q2: 'كيف بحسب كم لازم أوفر بالشهر؟',
    faq_a2: 'أدخل التكلفة الكلية المتوقعة وعدد الأشهر المتاحة لك قبل موعد الزواج، وبتطلعلك الحاسبة المبلغ المطلوب توفيره شهرياً للوصول للمبلغ الكامل بالموعد المحدد.',
    disclaimer: 'ℹ️ هاي أرقام تقريبية بناءً على متوسطات السوق ونقاشات محلية، وبتختلف كثير حسب اختياراتك ومنطقتك — مش رقم رسمي أو ثابت.',
    related_title: "Other USA Tools:",
    lbl_venue: "القاعة والضيافة (Venue & Catering)",
    lbl_photography: "التصوير والفيديو",
    lbl_attire: "فستان العروس وبدلة العريس",
    lbl_rings: "الخواتم (Rings)",
    lbl_flowers: "الزهور والديكور",
    lbl_entertainment: "الموسيقى والترفيه",
    lbl_honeymoon: "شهر العسل",
    lbl_other: "بنود أخرى"
  },
  en: {
    page_title: "Wedding Cost Calculator — USA 🇺🇸",
    page_sub: 'Add up every wedding expense in one place',
    months_lbl: 'How many months until you need the full amount? (optional)',
    total_lbl: 'Total estimated cost',
    monthly_lbl: 'Needed savings per month',
    faq_title: '❓ FAQ',
    faq_q1: "What's the average wedding cost in the USA?",
    faq_a1: "According to The Knot's 2026 Real Weddings Study (surveying over 10,000 couples married in 2025), the average US wedding cost is $34,200, at about $292 per guest. The median (the point where half spend more and half spend less) is closer to $20,000-25,000, which is more representative of most couples in mid-size cities and suburbs.",
    faq_q2: 'How is the monthly savings amount calculated?',
    faq_a2: 'Enter your total expected cost and the number of months until your wedding date, and the calculator shows the monthly savings needed to reach that amount in time.',
    disclaimer: 'ℹ️ These are rough estimates based on market averages and local discussion, and vary a lot based on your choices and region — not an official or fixed figure.',
    related_title: "Other USA Tools:",
    lbl_venue: "Venue & Catering",
    lbl_photography: "Photography & Videography",
    lbl_attire: "Attire (Dress & Suit)",
    lbl_rings: "Rings",
    lbl_flowers: "Flowers & Decor",
    lbl_entertainment: "Music & Entertainment",
    lbl_honeymoon: "Honeymoon",
    lbl_other: "Other"
  }
};
let pageLang = (function(){ try { return localStorage.getItem('lang') === 'en' ? 'en' : 'en'; } catch(e) { return 'en'; } })();
function t(key) { return WT[pageLang][key] || WT.ar[key] || key; }
function applyLang() {
  document.documentElement.lang = pageLang;
  document.documentElement.dir = pageLang === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(function(el){ el.textContent = t(el.getAttribute('data-t')); });
  document.getElementById('langToggleBtn').textContent = pageLang === 'ar' ? 'English' : 'عربي';
  document.getElementById('backLink').textContent = pageLang === 'ar' ? '→ العودة لأدوات USA' : '← Back to USA Tools';
  document.getElementById('backLink').setAttribute('href', 'us/');
  calc();
}
function toggleLang() {
  pageLang = pageLang === 'ar' ? 'en' : 'ar';
  try { localStorage.setItem('lang', pageLang); } catch(e) {}
  applyLang();
}


function calc() {
  const venue = parseFloat(document.getElementById('venue').value) || 0;
  const photography = parseFloat(document.getElementById('photography').value) || 0;
  const attire = parseFloat(document.getElementById('attire').value) || 0;
  const rings = parseFloat(document.getElementById('rings').value) || 0;
  const flowers = parseFloat(document.getElementById('flowers').value) || 0;
  const entertainment = parseFloat(document.getElementById('entertainment').value) || 0;
  const honeymoon = parseFloat(document.getElementById('honeymoon').value) || 0;
  const other = parseFloat(document.getElementById('other').value) || 0;
  const months = parseFloat(document.getElementById('months').value) || 0;

  const total = venue + photography + attire + rings + flowers + entertainment + honeymoon + other;
  if (!total) { document.getElementById('weddingResult').style.display = 'none'; return; }

  document.getElementById('totalCost').textContent = total.toFixed(2) + ' USD';
  document.getElementById('breakdown').innerHTML =
    (venue ? t('lbl_venue') + ': <strong>' + venue.toFixed(2) + ' USD</strong><br>' : '') +
    (photography ? t('lbl_photography') + ': <strong>' + photography.toFixed(2) + ' USD</strong><br>' : '') +
    (attire ? t('lbl_attire') + ': <strong>' + attire.toFixed(2) + ' USD</strong><br>' : '') +
    (rings ? t('lbl_rings') + ': <strong>' + rings.toFixed(2) + ' USD</strong><br>' : '') +
    (flowers ? t('lbl_flowers') + ': <strong>' + flowers.toFixed(2) + ' USD</strong><br>' : '') +
    (entertainment ? t('lbl_entertainment') + ': <strong>' + entertainment.toFixed(2) + ' USD</strong><br>' : '') +
    (honeymoon ? t('lbl_honeymoon') + ': <strong>' + honeymoon.toFixed(2) + ' USD</strong><br>' : '') +
    (other ? t('lbl_other') + ': <strong>' + other.toFixed(2) + ' USD</strong><br>' : '') +
    (t('total_lbl') + ': <strong style="color:var(--primary);font-size:16px;">' + total.toFixed(2) + ' USD</strong>');

  const monthlyBox = document.getElementById('monthlyBox');
  if (months > 0) {
    document.getElementById('monthlySaving').textContent = (total / months).toFixed(2) + ' USD';
    monthlyBox.style.display = 'block';
  } else {
    monthlyBox.style.display = 'none';
  }

  document.getElementById('weddingResult').style.display = 'block';
}

applyLang();
</script>
