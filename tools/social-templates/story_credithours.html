<!doctype html><html dir=rtl><head><meta charset=utf-8>
<link rel=stylesheet href='https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap'>
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{
  background:
    radial-gradient(circle at 30% 24%, rgba(96,165,250,.5), rgba(96,165,250,0) 46%),
    radial-gradient(circle at 75% 66%, rgba(168,85,247,.4), rgba(168,85,247,0) 50%),
    linear-gradient(165deg,#111a35,#0a0e1f 75%);
  font-family:Cairo,sans-serif;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;
}
.frame{position:absolute;inset:40px;border:1px solid rgba(255,255,255,.16);border-radius:36px}
.logo{font-size:54px;font-weight:900;letter-spacing:1px;color:#fff;display:flex;align-items:center;gap:12px;margin-bottom:60px}
.logo b{color:#7cb3ff}
.eyebrow{font-size:46px;font-weight:800;letter-spacing:2px;color:#9fc1f8;margin-bottom:30px}
.title{font-size:104px;font-weight:900;line-height:1.35;max-width:900px}
.title .accent{color:#ffc53d;display:block;text-shadow:0 2px 20px rgba(255,197,61,.45)}
.sub{font-size:40px;font-weight:700;color:#e7ecf7;margin-top:50px;max-width:820px;line-height:1.75}
.hint{position:absolute;bottom:170px;font-size:44px;font-weight:900;color:#ffe6a3;display:flex;flex-direction:column;align-items:center;gap:10px}
.foot{position:absolute;bottom:70px;font-size:30px;font-weight:700;color:#93a2c4;letter-spacing:3px}
</style></head><body>
<div class=frame></div>
<div class=logo>⚡ <b>أدواتي</b></div>
<div class=eyebrow>حاسبة الساعات الدراسية</div>
<div class=title>ساعاتك ملخبطة؟<span class=accent>رتبها بضغطة زر</span></div>
<div class=sub>وزّع ساعاتك على الفصول وشوف تأثيرها على معدلك قبل ما تسجل 📚</div>
<div class=hint><span>اضغط هنا Learn more 👇</span></div>
<div class=foot>ADAWATI.SPACE</div>
</body></html>
