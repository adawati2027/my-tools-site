<!doctype html><html dir=rtl><head><meta charset=utf-8>
<link rel=stylesheet href='https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap'>
<style>
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 34%, rgba(37,99,235,.55), rgba(37,99,235,0) 50%),
    linear-gradient(180deg,#0b0e18,#05060a 70%);
  font-family:Cairo,sans-serif;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;
}
.frame{position:absolute;inset:40px;border:1px solid rgba(255,255,255,.14);border-radius:36px}
.logo{font-size:54px;font-weight:900;letter-spacing:1px;color:#fff;display:flex;align-items:center;gap:12px;margin-bottom:60px}
.logo b{color:#5b8dff}
.eyebrow{font-size:30px;font-weight:700;letter-spacing:6px;color:#8fa5d8;text-transform:uppercase;margin-bottom:24px}
.title{font-size:104px;font-weight:900;line-height:1.18;max-width:900px}
.title .accent{color:transparent;-webkit-text-stroke:2px #5b8dff;display:block}
.sub{font-size:40px;font-weight:600;color:#c7ccd6;margin-top:50px;max-width:820px;line-height:1.7}
.hint{position:absolute;bottom:170px;font-size:44px;font-weight:900;color:#c3d1f5;display:flex;flex-direction:column;align-items:center;gap:10px}
.foot{position:absolute;bottom:70px;font-size:30px;font-weight:700;color:#7d87a3;letter-spacing:3px}
</style></head><body>
<div class=frame></div>
<div class=logo>⚡ <b>أدواتي</b></div>
<div class=eyebrow>حاسبة الساعات الدراسية</div>
<div class=title>ساعاتك ملخبطة؟<span class=accent>رتبها بضغطة زر</span></div>
<div class=sub>وزّع ساعاتك على الفصول وشوف تأثيرها على معدلك قبل ما تسجل 📚</div>
<div class=hint><span>🔗 الرابط بالبايو</span></div>
<div class=foot>ADAWATI.SPACE</div>
</body></html>
