<!doctype html><html dir=rtl><head><meta charset=utf-8>
<link rel=stylesheet href='https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap'>
<style>
html,body{margin:0;width:1080px;height:1080px;overflow:hidden}
body{
  background:
    radial-gradient(circle at 50% 38%, rgba(37,99,235,.55), rgba(37,99,235,0) 55%),
    linear-gradient(180deg,#0b0e18,#05060a 70%);
  font-family:Cairo,sans-serif;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;
}
.frame{position:absolute;inset:34px;border:1px solid rgba(255,255,255,.14);border-radius:28px}
.logo{font-size:46px;font-weight:900;letter-spacing:1px;color:#fff;display:flex;align-items:center;gap:10px;margin-bottom:46px}
.logo b{color:#5b8dff}
.eyebrow{font-size:26px;font-weight:700;letter-spacing:6px;color:#8fa5d8;text-transform:uppercase;margin-bottom:18px}
.title{font-size:84px;font-weight:900;line-height:1.18;color:#fff;max-width:880px}
.title .accent{color:transparent;-webkit-text-stroke:2px #5b8dff}
.sub{font-size:34px;font-weight:600;color:#c7ccd6;margin-top:34px;max-width:760px;line-height:1.6}
.cta{margin-top:56px;background:linear-gradient(135deg,#2563eb,#7c3aed);padding:22px 56px;border-radius:999px;font-size:34px;font-weight:800}
.foot{position:absolute;bottom:56px;font-size:26px;font-weight:700;color:#7d87a3;letter-spacing:2px}
</style></head><body>
<div class=frame></div>
<div class=logo>⚡ <b>أدواتي</b></div>
<div class=eyebrow>حاسبة الساعات الدراسية</div>
<div class=title>ساعاتك ملخبطة؟<br><span class=accent>رتبها بضغطة زر</span></div>
<div class=sub>وزّع ساعاتك على الفصول وشوف تأثيرها على معدلك قبل ما تسجل 📚</div>
<div class=cta>جرّب الحاسبة الآن</div>
<div class=foot>ADAWATI.SPACE</div>
</body></html>
