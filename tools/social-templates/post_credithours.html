<!doctype html><html dir=rtl><head><meta charset=utf-8>
<link rel=stylesheet href='https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap'>
<style>
html,body{margin:0;width:1080px;height:1080px;overflow:hidden}
body{
  background:
    radial-gradient(circle at 28% 20%, rgba(96,165,250,.5), rgba(96,165,250,0) 48%),
    radial-gradient(circle at 78% 70%, rgba(168,85,247,.42), rgba(168,85,247,0) 50%),
    linear-gradient(165deg,#111a35,#0a0e1f 75%);
  font-family:Cairo,sans-serif;color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;position:relative;
}
.frame{position:absolute;inset:34px;border:1px solid rgba(255,255,255,.16);border-radius:28px}
.logo{font-size:46px;font-weight:900;letter-spacing:1px;color:#fff;display:flex;align-items:center;gap:10px;margin-bottom:46px}
.logo b{color:#7cb3ff}
.eyebrow{font-size:38px;font-weight:800;letter-spacing:2px;color:#9fc1f8;margin-bottom:22px}
.title{font-size:84px;font-weight:900;line-height:1.3;color:#fff;max-width:880px}
.title .accent{color:#ffc53d;text-shadow:0 2px 18px rgba(255,197,61,.45)}
.sub{font-size:34px;font-weight:700;color:#e7ecf7;margin-top:34px;max-width:760px;line-height:1.65}
.cta{margin-top:56px;background:linear-gradient(135deg,#3b82f6,#a855f7);padding:22px 56px;border-radius:999px;font-size:34px;font-weight:800;box-shadow:0 10px 30px rgba(59,130,246,.4)}
.foot{position:absolute;bottom:56px;font-size:26px;font-weight:700;color:#93a2c4;letter-spacing:2px}
</style></head><body>
<div class=frame></div>
<div class=logo>⚡ <b>أدواتي</b></div>
<div class=eyebrow>حاسبة الساعات الدراسية</div>
<div class=title>مش عارف كم ساعة تسجل؟<br><span class=accent>رتبها بضغطة زر</span></div>
<div class=sub>وزّع ساعاتك على الفصول وشوف تأثيرها على معدلك قبل ما تسجل 📚</div>
<div class=cta>جرّب الحاسبة الآن</div>
<div class=foot>ADAWATI.SPACE</div>
</body></html>
