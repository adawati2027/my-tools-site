<script>
document.addEventListener('DOMContentLoaded', function() {

  var box = document.getElementById('adView');
  var id = new URLSearchParams(location.search).get('id');
  if (!id) { box.innerHTML = 'الإعلان مش موجود. <a href="jo/ads/">ارجع للإعلانات</a>'; return; }
  var fbRef, ad, liked = false, isAdmin = false;
  function likeBtn() {
    return '<button type="button" class="ads-btn secondary ads-like' + (liked ? ' on' : '') + '" id="likeBtn">' + (liked ? '❤️' : '🤍') + ' ' + (ad.likeCount || 0) + '</button>';
  }
  function draw() {
    document.title = ad.title + ' | عنا الإعلانات | Adawati';
    box.innerHTML = '<div class="ads-card-top"><span class="ads-cat">' + adsEsc(ADS_CATS[ad.category] || '') + '</span>' + (ad.city ? '<span class="ads-city">📍 ' + adsEsc(ad.city) + '</span>' : '') + '</div>' +
      '<h1 class="card-title" style="margin-top:10px;">' + adsEsc(ad.title) + '</h1>' +
      '<div class="card-subtitle">' + (ad.ownerName ? 'من: ' + adsEsc(ad.ownerName) : '') + (ad.createdAt ? ' · ' + adsEsc(adsDate(ad.createdAt)) : '') + '</div>' +
      '<div class="divider"></div>' +
      '<p style="font-size:15px;line-height:1.9;white-space:pre-line;">' + adsEsc(ad.description) + '</p>' +
      '<div class="card-title" style="font-size:15px;margin-top:16px;">🔗 صفحات المعلن</div><div class="ads-links">' + adsLinksHtml(ad.links) + '</div>' +
      '<div class="ads-row" style="margin-top:16px;">' + likeBtn() + '<button type="button" class="ads-btn secondary" id="shareBtn">📤 شارك الإعلان</button></div><div id="likeMsg"></div>' +
      (isAdmin ? '<div class="ads-note" style="margin-top:16px;">🛡️ أدمن · ' + adsEsc(adsExpiryText(ad)) + '<div class="ads-row"><button type="button" class="ads-btn danger" id="adminDel">🗑️ احذف الإعلان</button><a class="ads-btn secondary" href="jo/ads/admin/">لوحة الإدارة</a></div></div>' : '');
    if (isAdmin) document.getElementById('adminDel').addEventListener('click', function() {
      var b = this;
      if (b.getAttribute('data-sure') !== '1') { b.setAttribute('data-sure', '1'); b.textContent = '⚠️ متأكد؟ اكبس مرة ثانية'; return; }
      b.disabled = true;
      fbRef.db.collection('ads').doc(id).delete().then(function() { box.innerHTML = '✅ انحذف الإعلان. <a href="jo/ads/">ارجع للإعلانات</a>'; })
        .catch(function() { b.disabled = false; b.textContent = 'ما زبط الحذف'; });
    });
    document.getElementById('likeBtn').addEventListener('click', toggleLike);
    document.getElementById('shareBtn').addEventListener('click', function() {
      if (navigator.share) navigator.share({ title: ad.title, url: location.href }).catch(function(){});
      else if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(function(){ document.getElementById('likeMsg').innerHTML = '<div class="ads-msg ok">✅ انسخ الرابط</div>'; });
    });
  }
  function toggleLike() {
    var user = fbRef.auth.currentUser;
    if (!user) { openAuthModal(); return; }
    var adRef = fbRef.db.collection('ads').doc(id), likeRef = adRef.collection('likes').doc(user.uid);
    var batch = fbRef.db.batch(), inc = liked ? -1 : 1;
    if (liked) batch.delete(likeRef); else batch.set(likeRef, { createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    batch.update(adRef, { likeCount: (ad.likeCount || 0) + inc });
    document.getElementById('likeBtn').disabled = true;
    batch.commit().then(function() { liked = !liked; ad.likeCount = (ad.likeCount || 0) + inc; draw(); })
      .catch(function() { document.getElementById('likeBtn').disabled = false; document.getElementById('likeMsg').innerHTML = '<div class="ads-msg err">ما زبط — حدّث الصفحة وجرّب.</div>'; });
  }
  adsOnUser(function(user, fb) {
    fbRef = fb;
    if (!fb) { box.innerHTML = 'صار خطأ بالتحميل.'; return; }
    fb.db.collection('ads').doc(id).get().then(function(doc) {
      if (!doc.exists) { box.innerHTML = 'الإعلان مش موجود أو لسا قيد المراجعة. <a href="jo/ads/">ارجع للإعلانات</a>'; return null; }
      ad = doc.data();
      return adsIsAdmin(fb, user).then(function(a) {
        isAdmin = a;
        if (adsExpired(ad) && !isAdmin) { box.innerHTML = '⌛ انتهت مدة هالإعلان. <a href="jo/ads/">شوف الإعلانات الحالية</a>'; ad = null; return null; }
        return user ? doc.ref.collection('likes').doc(user.uid).get().then(function(l){ liked = l.exists; }) : null;
      });
    }).then(function() { if (ad) draw(); })
      .catch(function() { box.innerHTML = 'الإعلان مش متاح. <a href="jo/ads/">ارجع للإعلانات</a>'; });
  });
});
</script>
