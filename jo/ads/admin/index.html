<main><div class="tool-page">
  <div class="page-header"><a href="jo/ads/">→ عنا الإعلانات</a></div>

  <div class="card">
    <h1 class="card-title">🛡️ إدارة الإعلانات</h1>
    <div class="ads-row" id="tabs"></div>
  </div>
  <div id="adminList" style="margin-top:16px;"><div class="card">⏳ جاري التحميل...</div></div>
</div></main>

<footer class="footer" style="padding:28px;">
  <div style="max-width:1160px;margin:0 auto;">
    <div class="footer-links"><a href="about.html">من نحن</a><a href="contact.html">تواصل</a><a href="jo/">أدوات الأردن</a></div>

<script src="jo/ads/ads.js?v=5" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function() {

  var list = document.getElementById('adminList'), tab = 'pending', fbRef;
  var tabs = document.getElementById('tabs');
  tabs.innerHTML = Object.keys(ADS_STATUS).map(function(k){ return '<button type="button" class="ads-btn' + (k === tab ? '' : ' secondary') + '" data-t="' + k + '">' + ADS_STATUS[k] + '</button>'; }).join('') + '<button type="button" class="ads-btn secondary" data-t="reports">🚩 البلاغات</button>';
  tabs.addEventListener('click', function(e) {
    var b = e.target.closest('[data-t]'); if (!b) return;
    tab = b.getAttribute('data-t');
    tabs.querySelectorAll('[data-t]').forEach(function(x){ x.className = 'ads-btn' + (x === b ? '' : ' secondary'); });
    load();
  });
  function setStatus(id, status, note, extra) {
    var upd = Object.assign({ status: status, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, extra || {});
    if (note !== undefined) upd.adminNote = note;
    return fbRef.db.collection('ads').doc(id).update(upd);
  }
  function loadReports() {
    fbRef.db.collection('adReports').orderBy('createdAt', 'desc').limit(100).get().then(function(snap) {
      if (snap.empty) { list.innerHTML = '<div class="card">✅ ما في بلاغات.</div>'; return; }
      list.innerHTML = snap.docs.map(function(d) {
        var r = d.data();
        return '<div class="card" style="margin-top:12px;" data-rep="' + d.id + '"><div class="ads-meta">' + adsEsc(adsDate(r.createdAt)) + '</div>' +
          '<div style="font-weight:800;margin:6px 0;">🚩 ' + adsEsc(r.reason) + '</div>' +
          '<div class="ads-meta">' + (r.reviewUid ? '💬 بلاغ على تعليق بالإعلان' : '📣 بلاغ على الإعلان نفسه') + '</div>' +
          '<div class="ads-row"><a class="ads-btn" href="jo/ads/view/?id=' + encodeURIComponent(r.adId) + '" target="_blank" rel="noopener">👁️ افتح الإعلان</a><button type="button" class="ads-btn secondary" data-done="' + d.id + '">✅ تمت المعالجة (احذف البلاغ)</button></div></div>';
      }).join('');
    }).catch(function() { list.innerHTML = '<div class="card">ما زبط تحميل البلاغات.</div>'; });
  }
  list.addEventListener('click', function(e) {
    var b = e.target.closest('[data-done]'); if (!b) return;
    b.disabled = true;
    fbRef.db.collection('adReports').doc(b.getAttribute('data-done')).delete().then(function() { b.closest('[data-rep]').remove(); if (!list.querySelector('[data-rep]')) list.innerHTML = '<div class="card">✅ ما في بلاغات.</div>'; }).catch(function() { b.disabled = false; });
  });
  function load() {
    list.innerHTML = '<div class="card">⏳ جاري التحميل...</div>';
    if (tab === 'reports') return loadReports();
    fbRef.db.collection('ads').where('status', '==', tab).get().then(function(snap) {
      if (snap.empty) { list.innerHTML = '<div class="card">ما في إعلانات هون.</div>'; return; }
      list.innerHTML = snap.docs.map(function(d) {
        var a = d.data(), proof = adsSafeUrl(a.shareProof);
        return '<div class="card" style="margin-top:12px;" data-id="' + d.id + '">' +
          '<div class="ads-card-top"><span class="ads-cat">' + adsEsc(ADS_CATS[a.category] || '') + '</span><span>' + adsEsc(adsDate(a.updatedAt || a.createdAt)) + '</span></div>' +
          '<div class="ads-title" style="margin-top:8px;">' + adsEsc(a.title) + '</div>' +
          '<div class="ads-meta">' + adsEsc(a.ownerName) + (a.phone ? ' · 📞 <span dir="ltr">' + adsEsc(a.phone) + '</span>' : '') + (a.city ? ' · 📍 ' + adsEsc(a.city) : '') + ' · ❤️ ' + (a.likeCount || 0) + '</div>' +
          '<p style="font-size:14px;line-height:1.8;white-space:pre-line;margin-top:8px;">' + adsEsc(a.description) + '</p>' +
          '<div class="ads-links">' + adsLinksHtml(a.links) + '</div>' +
          (a.status === 'approved' ? '<div class="ads-meta" style="margin-top:8px;font-weight:700;">' + adsEsc(adsExpiryText(a)) + '</div>' : '') +
          '<div class="ads-note" style="background:#e0f2fe;color:#075985;">📢 منشور مشاركة أدواتي: ' + (proof ? '<a href="' + adsEsc(proof) + '" target="_blank" rel="nofollow noopener">' + adsEsc(proof) + '</a>' : '—') +
          (a.hasProofImage ? '<div class="ads-row"><button type="button" class="ads-btn secondary" data-img="1">📎 شوف صورة الستوري</button></div><div class="imgbox"></div>' : '') + '</div>' +
          '<div class="ads-note" style="background:#fce7f3;color:#9d174d;">📸 إنستغرام المعلن: ' + (adsIgProfileUrl(a.igHandle) ? '<a href="' + adsEsc(adsIgProfileUrl(a.igHandle)) + '" target="_blank" rel="nofollow noopener">' + adsEsc(a.igHandle) + '</a> — تأكد إنه بيتابع @adawati2027' : adsEsc(a.igHandle || '—')) + '</div>' +
          (a.adminNote ? '<div class="ads-note">💬 آخر ملاحظة: ' + adsEsc(a.adminNote) + '</div>' : '') +
          '<textarea class="note" placeholder="ملاحظة للمعلن (مطلوبة عند طلب تعديل أو الرفض)" style="width:100%;margin-top:10px;padding:8px;border:1px solid var(--border);border-radius:8px;font-family:inherit;font-size:15px;box-sizing:border-box;"></textarea>' +
          '<div class="ads-row">' + adsDurationSelect(30) +
          (a.status !== 'approved' ? '<button type="button" class="ads-btn" data-act="approved">✅ موافقة ونشر</button>' : '<button type="button" class="ads-btn" data-act="extend">⏱️ تعديل المدة</button>') +
          '<button type="button" class="ads-btn warn" data-act="changes">✏️ اطلب تعديل</button>' +
          (a.status !== 'rejected' ? '<button type="button" class="ads-btn danger" data-act="rejected">⛔ رفض</button>' : '') +
          '<button type="button" class="ads-btn secondary" data-act="delete">🗑️ حذف</button></div><div class="res"></div></div>';
      }).join('');
    }).catch(function() { list.innerHTML = '<div class="card">ما زبط التحميل.</div>'; });
  }
  list.addEventListener('click', function(e) {
    var ib = e.target.closest('[data-img]');
    if (ib) {
      var ibox = ib.closest('[data-id]').querySelector('.imgbox');
      ib.disabled = true;
      fbRef.db.collection('adProofs').doc(ib.closest('[data-id]').getAttribute('data-id')).get().then(function(d) {
        var src = d.exists ? String(d.data().image || '') : '';
        ibox.innerHTML = src.indexOf('data:image/jpeg;base64,') === 0 ? '<img src="' + src + '" alt="" style="max-width:100%;max-height:520px;border-radius:8px;margin-top:8px;">' : 'ما في صورة.';
      }).catch(function() { ib.disabled = false; ibox.textContent = 'ما زبط تحميل الصورة.'; });
      return;
    }
    var b = e.target.closest('[data-act]'); if (!b) return;
    var c = b.closest('[data-id]'), id = c.getAttribute('data-id'), act = b.getAttribute('data-act'), note = c.querySelector('.note').value.trim(), res = c.querySelector('.res');
    if ((act === 'changes' || act === 'rejected') && !note) { res.innerHTML = '<div class="ads-msg err">اكتب ملاحظة للمعلن أول.</div>'; return; }
    if (act === 'delete' && b.getAttribute('data-sure') !== '1') { b.setAttribute('data-sure', '1'); b.textContent = '⚠️ متأكد؟ اكبس مرة ثانية'; return; }
    b.disabled = true;
    var exp = adsExpiresFromDays(c.querySelector('.dur').value);
    if (act === 'extend') {
      fbRef.db.collection('ads').doc(id).update({ expiresAt: exp }).then(function() { b.disabled = false; res.innerHTML = '<div class="ads-msg ok">✅ ' + adsEsc(adsExpiryText({ status: 'approved', expiresAt: exp })) + '</div>'; })
        .catch(function() { b.disabled = false; res.innerHTML = '<div class="ads-msg err">ما زبط.</div>'; });
      return;
    }
    var op = act === 'delete' ? fbRef.db.collection('adProofs').doc(id).delete().catch(function(){}).then(function() { return fbRef.db.collection('ads').doc(id).delete(); }) : setStatus(id, act, act === 'approved' ? (note || '') : note, act === 'approved' ? { expiresAt: exp } : undefined);
    op.then(function() { c.remove(); if (!list.querySelector('[data-id]')) list.innerHTML = '<div class="card">✅ خلصت هالقائمة.</div>'; })
      .catch(function() { b.disabled = false; res.innerHTML = '<div class="ads-msg err">ما زبط — تأكد إنك مسجّل كأدمن.</div>'; });
  });
  adsOnUser(function(user, fb) {
    fbRef = fb;
    if (!user) { adsSignInPrompt(list, 'سجّل دخول بحساب الأدمن.'); return; }
    adsIsAdmin(fb, user).then(function(ok) {
      if (!ok) { list.innerHTML = '<div class="card">⛔ هالحساب مش أدمن.<div class="ads-hint" style="margin-top:8px;">UID: ' + adsEsc(user.uid) + '</div></div>'; return; }
      load();
    });
  });
});
</script>
