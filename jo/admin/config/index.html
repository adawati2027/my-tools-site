.cf-svc a:hover{border-color:var(--primary)}
.cf-svc b{display:block;font-size:14px}
.cf-svc span{display:block;font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.6}
.cf-h{font-size:12px;color:var(--text-muted);line-height:1.7;margin-top:2px}

<script>

  var KEYS = [

    ['adawati_reading_goal_v1', 'هدف القراءة'], ['adawati_events_v1', 'العد التنازلي للمناسبات'], ['adawati_pomo_v1', 'بومودورو'], ['ckSel', 'ماذا أطبخ'],

  ];
  var SERVICES = [
    ['Firebase (مشروع adawati-challenges)', 'الحسابات وقاعدة البيانات والقواعد. هنا تُنشر قواعد Firestore ويُنشأ مستند المشرف.', 'https://console.firebase.google.com/'],
    ['Google Search Console', 'الفهرسة والنقرات ومخطط الموقع.', 'https://search.google.com/search-console'],
    ['Google Analytics 4', 'الزوار والصفحات الأكثر زيارة (G-97DQT5FHPF).', 'https://analytics.google.com/'],
    ['Google AdSense', 'إعلانات الموقع وحالة المراجعة (ca-pub-3337905412116301).', 'https://adsense.google.com/'],
    ['Google AdMob', 'إعلانات تطبيقي أندرويد وآيفون.', 'https://admob.google.com/'],
    ['Google Ads', 'حملات الإعلان المدفوع، إن وُجدت.', 'https://ads.google.com/'],
    ['Google Cloud Console', 'مفاتيح الواجهات البرمجية وحسابات الخدمة.', 'https://console.cloud.google.com/'],
    ['Google Play Console', 'تطبيق أندرويد: المراجعة والإصدارات.', 'https://play.google.com/console'],
    ['App Store Connect', 'تطبيق آيفون: المراجعة والإصدارات.', 'https://appstoreconnect.apple.com/'],
    ['Cloudflare', 'النطاق وقواعد الأمان والـ Worker.', 'https://dash.cloudflare.com/'],
    ['GitHub', 'مستودع الموقع adawati2027/my-tools-site.', 'https://github.com/adawati2027/my-tools-site'],
    ['Buttondown', 'النشرة البريدية والمشتركون.', 'https://buttondown.com/'],
    ['Instagram', 'حساب @adawati2027.', 'https://www.instagram.com/adawati2027/'],
    ['Meta للمطورين', 'تطبيقات فيسبوك وإنستغرام.', 'https://developers.facebook.com/'],
    ['Bing Webmaster Tools', 'الفهرسة في Bing (IndexNow).', 'https://www.bing.com/webmasters']
  ];
  var QUIZZES = [['jordan-quiz', 'الأردن'], ['general-quiz', 'ثقافة عامة'], ['culture-quiz', 'الثقافة'], ['geography-quiz', 'الجغرافيا'], ['science-quiz', 'العلوم'], ['math-quiz', 'الرياضيات'], ['english-quiz', 'الإنجليزية'], ['arabic-language-quiz', 'اللغة العربية'], ['arabic-proverbs-quiz', 'الأمثال'], ['islamic-history-quiz', 'التاريخ الإسلامي'], ['animals-quiz', 'الحيوانات'], ['cooking-quiz', 'الطبخ'], ['inventions-quiz', 'الاختراعات'], ['logo-quiz', 'الشعارات'], ['makeup-quiz', 'المكياج'], ['songs-quiz', 'الأغاني'], ['world-football-quiz', 'كرة القدم'], ['world-sports-quiz', 'الرياضة'], ['oman-quiz', 'عُمان'], ['saudi-quiz', 'السعودية'], ['uae-quiz', 'الإمارات'], ['egypt-quiz', 'مصر']];
  var DOC = ['config', 'site'];
  var body = document.getElementById('cfBody'), fbRef = null;
  function esc(s) { return adsEsc(s); }

  function build(c) {
    var s = c.sync || {}, q = c.quiz || {}, ch = c.chat || {}, dis = s.disabledKeys || [], bn = c.banner || {}, ad = c.ads || {}, mt = c.maintenance || {}, pg = c.pages || {};
    var ret = [[0, 'بلا حد (احتفظ بكل شيء)'], [30, '30 يوماً'], [90, '90 يوماً'], [180, '180 يوماً'], [365, 'سنة'], [730, 'سنتان']];
    var h = '<div class="card cf-sec"><h2>🔄 مزامنة بيانات الأدوات مع الحساب</h2><div class="cf-h">تخص المستخدمين المسجّلين فقط.</div>' +
      '<div class="cf-row"><label for="cSyncOn">تفعيل المزامنة</label><input type="checkbox" id="cSyncOn"' + (s.enabled === false ? '' : ' checked') + '></div>' +
      '<div class="cf-row"><div><label for="cRet">مدة حفظ السجلّات القديمة</label><div class="cf-h">تُحذف من الحساب السجلّات الأقدم من المدة (سجلات الحاسبات، بومودورو، تقسيم الفاتورة، نتائج التحديات). الافتراضي: بلا حد.</div></div><select id="cRet">' +
      ret.map(function (r) { return '<option value="' + r[0] + '"' + ((+s.retentionDays || 0) === r[0] ? ' selected' : '') + '>' + r[1] + '</option>'; }).join('') + '</select></div>' +
      '<div class="cf-row"><div><label for="cMax">أقصى حجم لكل أداة (كيلوبايت)</label><div class="cf-h">حماية من تضخّم المستند، فحدّ Firestore للمستند ميغابايت واحد.</div></div><input type="number" id="cMax" min="20" max="500" value="' + (s.maxKeyKB > 0 ? s.maxKeyKB : 150) + '"></div>' +
      '<div style="margin-top:10px;font-weight:700;font-size:14px;">الأدوات التي تُزامَن</div><div class="cf-keys">' +
      KEYS.map(function (k) { return '<label><input type="checkbox" data-k="' + esc(k[0]) + '"' + (dis.indexOf(k[0]) < 0 ? ' checked' : '') + '> ' + esc(k[1]) + '</label>'; }).join('') + '</div></div>' +

      '<div class="card cf-sec"><h2>🎮 الاختبارات والتحديات</h2>' +
      '<div class="cf-row"><div><label for="cQ">عدد الأسئلة في كل جولة</label><div class="cf-h">من 5 إلى 20، والحد الأعلى 20 بسبب قواعد التحديات. الافتراضي 12.</div></div><input type="number" id="cQ" min="5" max="20" value="' + (q.questionsPerGame >= 5 && q.questionsPerGame <= 20 ? q.questionsPerGame : 12) + '"></div>' +
      '<div class="cf-row"><div><label for="cSecAll">وقت السؤال لكل الاختبارات (ثانية)</label><div class="cf-h">من 5 إلى 60. اتركه فارغاً لاستعمال وقت كل اختبار الافتراضي (15 ثانية). يُطبَّق على التحديات والعب الفردي.</div></div><input type="number" id="cSecAll" min="5" max="60" placeholder="15" value="' + (q.secondsDefault >= 5 && q.secondsDefault <= 60 ? q.secondsDefault : '') + '"></div>' +
      '<div style="margin-top:10px;font-weight:700;font-size:14px;">وقت خاص بكل اختبار (يتفوق على الوقت العام، فارغ = العام)</div><div class="cf-keys">' +
      QUIZZES.map(function (z) { var v = q.seconds && q.seconds[z[0]]; return '<label>' + esc(z[1]) + '<input type="number" data-s="' + esc(z[0]) + '" min="5" max="60" style="width:70px;margin-inline-start:auto;padding:6px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:15px;" value="' + (v >= 5 && v <= 60 ? v : '') + '"></label>'; }).join('') + '</div>' +
      '<div class="cf-row"><div><label for="cChat">دردشة التحديات</label><div class="cf-h">أوقفها مؤقتاً عند وجود إساءة، ويصل الأمر للمستخدمين خلال 30 دقيقة.</div></div><input type="checkbox" id="cChat"' + (ch.enabled === false ? '' : ' checked') + '></div></div>' +

      '<div class="card cf-sec"><h2>📢 شريط إعلان أعلى الصفحات</h2><div class="cf-h">رسالة تظهر لكل الزوار، ويستطيع الزائر إغلاقها، ولا تعود له إلا إذا غيّرت النص.</div>' +
      '<div class="cf-row"><label for="bOn">تفعيل الشريط</label><input type="checkbox" id="bOn"' + (bn.enabled === true ? ' checked' : '') + '></div>' +
      '<div style="margin-top:6px;"><label class="cf-h" for="bTxt">النص</label><input type="text" id="bTxt" maxlength="160" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:15px;" value="' + esc(bn.text || '') + '"></div>' +
      '<div style="margin-top:6px;"><label class="cf-h" for="bLnk">رابط اختياري (يبدأ بـ https:// أو /)</label><input type="text" id="bLnk" dir="ltr" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:15px;" value="' + esc(bn.link || '') + '"></div>' +
      '<div style="margin-top:6px;"><label class="cf-h" for="bLt">نص الرابط</label><input type="text" id="bLt" maxlength="30" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:15px;" value="' + esc(bn.linkText || '') + '"></div>' +
      '<div class="cf-row"><label for="bSt">اللون</label><select id="bSt">' + [['info', 'أزرق (معلومة)'], ['warn', 'برتقالي (تنبيه)'], ['ok', 'أخضر (خبر سار)']].map(function (o) { return '<option value="' + o[0] + '"' + ((bn.style || 'info') === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div></div>' +

      '<div class="card cf-sec"><h2>🧰 التحكم بالموقع</h2>' +
      '<div class="cf-row"><div><label for="aOn">عرض إعلانات AdSense</label><div class="cf-h">أطفئه لإخفاء كل الوحدات الإعلانية فوراً، مثلاً أثناء مراجعة جوجل أو عند ظهور مشكلة.</div></div><input type="checkbox" id="aOn"' + (ad.enabled === false ? '' : ' checked') + '></div>' +
      '<div class="cf-row"><div><label for="mOn">وضع الصيانة</label><div class="cf-h">يغطي كل الصفحات برسالة، عدا صفحات المشرف (المسار فيه /admin/) حتى تستطيع إيقافه.</div></div><input type="checkbox" id="mOn"' + (mt.enabled === true ? ' checked' : '') + '></div>' +
      '<div style="margin-top:6px;"><label class="cf-h" for="mTxt">رسالة الصيانة</label><input type="text" id="mTxt" maxlength="200" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:15px;" value="' + esc(mt.message || '') + '"></div>' +
      '<div style="margin-top:14px;"><label style="font-weight:700;font-size:14px;" for="pList">إيقاف صفحات أو أدوات مؤقتاً</label><div class="cf-h">مسار في كل سطر. المسار الذي ينتهي بـ / يشمل كل ما تحته. مثال: jo/games/jordan-quiz/ أو jo/calculators/tawjihi-average/. تُخفى بطاقتها من القوائم وتظهر رسالة بدل الصفحة.</div><textarea id="pList" dir="ltr" rows="4" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:15px;">' + esc((pg.disabled || []).join('\n')) + '</textarea></div>' +
      '<div style="margin-top:6px;"><label class="cf-h" for="pMsg">رسالة الصفحات الموقوفة (اختيارية)</label><input type="text" id="pMsg" maxlength="200" style="width:100%;box-sizing:border-box;padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:15px;" value="' + esc(pg.message || '') + '"></div></div>' +

      '<div class="card cf-sec"><button type="button" class="ads-btn" id="cSave">💾 حفظ الإعدادات</button> <button type="button" class="ads-btn secondary" id="cReset">↩️ الافتراضي</button><div id="cMsg"></div></div>' +

      '<div class="card cf-sec"><h2>🧭 الخدمات والمنصات المرتبطة بالمشروع</h2><div class="cf-h">روابط سريعة إلى لوحات التحكم. بعضها قد يحتاج تسجيل الدخول بالحساب الذي أنشأ الخدمة.</div><div class="cf-svc">' +
      SERVICES.map(function (x) { return '<a href="' + esc(x[2]) + '" target="_blank" rel="noopener"><b>' + esc(x[0]) + '</b><span>' + esc(x[1]) + '</span></a>'; }).join('') + '</div></div>';
    body.innerHTML = h;
    document.getElementById('cSave').addEventListener('click', save);
    document.getElementById('cReset').addEventListener('click', function () { build({}); msg('ok', 'عُبّئت القيم الافتراضية. اضغط حفظ لتثبيتها.'); });
  }

  function msg(t, m) { var e = document.getElementById('cMsg'); if (e) e.innerHTML = '<div class="ads-msg ' + t + '">' + esc(m) + '</div>'; }

  function v(id) { return document.getElementById(id).value.trim(); }
  function secOk(n) { n = parseInt(n, 10); return n >= 5 && n <= 60 ? n : 0; }
  function secAll() { return secOk(document.getElementById('cSecAll').value); }
  function secMap() { var o = {}; [].slice.call(document.querySelectorAll('[data-s]')).forEach(function (i) { var n = secOk(i.value); if (n) o[i.getAttribute('data-s')] = n; }); return o; }

  function save() {
    var btn = document.getElementById('cSave');
    var dis = [].slice.call(document.querySelectorAll('[data-k]')).filter(function (i) { return !i.checked; }).map(function (i) { return i.getAttribute('data-k'); });
    var mx = Math.max(20, Math.min(500, parseInt(document.getElementById('cMax').value, 10) || 150));
    var q = Math.max(5, Math.min(20, parseInt(document.getElementById('cQ').value, 10) || 12));
    var data = {
      sync: { enabled: document.getElementById('cSyncOn').checked, retentionDays: parseInt(document.getElementById('cRet').value, 10) || 0, maxKeyKB: mx, disabledKeys: dis },
      quiz: { questionsPerGame: q, secondsDefault: secAll(), seconds: secMap() },
      chat: { enabled: document.getElementById('cChat').checked },
      banner: { enabled: document.getElementById('bOn').checked, text: v('bTxt'), link: v('bLnk'), linkText: v('bLt'), style: v('bSt') },
      ads: { enabled: document.getElementById('aOn').checked },
      maintenance: { enabled: document.getElementById('mOn').checked, message: v('mTxt') },
      pages: { disabled: v('pList').split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean).slice(0, 100), message: v('pMsg') },
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    };
    btn.disabled = true;
    fbRef.db.collection(DOC[0]).doc(DOC[1]).set(data).then(function () {
      try { localStorage.removeItem('adawati_cfg_v1'); } catch (e) {}
      msg('ok', '✓ تم الحفظ.');
    }).catch(function (e) {
      msg('err', e && e.code === 'permission-denied' ? 'مرفوض: انشر قواعد Firestore الجديدة من docs/firestore.rules (قسم config) ثم أعد المحاولة.' : 'تعذّر الحفظ، حاول مرة أخرى.');
    }).then(function () { btn.disabled = false; });
  }

  adsOnUser(function (user, fb) {
    if (!user || !fb) { adsSignInPrompt(body, 'سجّل الدخول بحساب المشرف لفتح الإعدادات.'); return; }
    fbRef = fb;
    adsIsAdmin(fb, user).then(function (ok) {
      if (!ok) { body.innerHTML = '<div class="card" style="margin-top:16px;">هذه الصفحة للمشرف فقط.</div>'; return; }
      fb.db.collection(DOC[0]).doc(DOC[1]).get().then(function (d) { build(d.exists ? d.data() : {}); })
        .catch(function () { build({}); });
    });
  });
});
</script>
