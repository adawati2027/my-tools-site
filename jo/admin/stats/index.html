<style>
.cf-sec{margin-top:16px}
.cf-sec h2{font-size:17px;margin:0 0 4px}
.cf-row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.cf-row label{font-weight:700;font-size:14px}
.cf-row input[type=number],.cf-row select{padding:9px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-family:inherit;font-size:16px;width:130px;box-sizing:border-box}
.cf-row input[type=checkbox]{width:22px;height:22px}
.cf-keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px;margin-top:8px}
.cf-keys label{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;font-weight:600}
.cf-svc{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px;margin-top:10px}
.cf-svc a{display:block;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);text-decoration:none;color:var(--text)}
.cf-svc a:hover{border-color:var(--primary)}
.cf-svc b{display:block;font-size:14px}
.cf-svc span{display:block;font-size:12px;color:var(--text-muted);margin-top:3px;line-height:1.6}
.cf-h{font-size:12px;color:var(--text-muted);line-height:1.7;margin-top:2px}
</style>

<body>
<nav class="navbar"><div class="nav-container">

    <a href="jo/">أدوات الأردن</a>
  </div>
</div></nav>

<main><div class="tool-page">
  <div class="card">
    <h1 class="card-title">📊 إحصاءات الموقع</h1>
    <div class="cf-h">للمشرف فقط. أرقام من قاعدة البيانات مباشرة. أعداد الزوار والصفحات الأكثر زيارة تجدها في Google Analytics وSearch Console (روابطهما أسفل الصفحة).</div>
  </div>
  <div id="stBody"><div class="card" style="margin-top:16px;">⏳ جاري التحميل...</div></div>
</div></main>

<footer class="footer" style="padding:28px;">
  <div style="max-width:1160px;margin:0 auto;">
    <div class="footer-links"><a href="about.html">من نحن</a><a href="contact.html">تواصل</a><a href="jo/">أدوات الأردن</a></div>

  </div>
</footer>
<script src="i18n-lang-ar.js?v=4" defer></script>
<script src="i18n.js?v=67" defer></script>
<script src="jo/ads/ads.js?v=6" defer></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  var body = document.getElementById('stBody');
  var DAY = 86400000, CAP = 1000;
  function ts(d, f) { var v = d[f]; return v && v.toMillis ? v.toMillis() : 0; }
  function box(n, label, note) { return '<div style="padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface-2);text-align:center;"><div style="font-size:28px;font-weight:800;">' + n + '</div><div style="font-size:13px;font-weight:700;margin-top:2px;">' + label + '</div>' + (note ? '<div class="cf-h">' + note + '</div>' : '') + '</div>'; }
  function grid(items) { return '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px;">' + items.join('') + '</div>'; }
  function get(db, col, fn) { return db.collection(col).limit(CAP).get().then(function (s) { return fn(s); }).catch(function () { return null; }); }
  function num(x) { return x === null ? '—' : String(x) + (x >= CAP ? '+' : ''); }
  function load(db) {
    var now = Date.now();
    Promise.all([
      get(db, 'challenges', function (s) { var a = 0, w = 0, d = 0; s.forEach(function (x) { var t = ts(x.data(), 'createdAt'); a++; if (now - t < 7 * DAY) w++; if (now - t < DAY) d++; }); return { a: a, w: w, d: d }; }),
      get(db, 'chatReports', function (s) { return s.size; }),
      get(db, 'emailBans', function (s) { var n = 0; s.forEach(function (x) { var u = +x.data().until || 0; if (!u || u > now) n++; }); return n; }),
      get(db, 'chatBans', function (s) { var n = 0; s.forEach(function (x) { var u = +x.data().until || 0; if (!u || u > now) n++; }); return n; }),
      get(db, 'ads', function (s) { var o = { pending: 0, approved: 0, other: 0 }; s.forEach(function (x) { var st = x.data().status; o[st === 'pending' || st === 'approved' ? st : 'other']++; }); return o; }),
      get(db, 'adReports', function (s) { return s.size; })
    ]).then(function (r) {
      var c = r[0], ad = r[4], h = '';
      h += '<div class="card cf-sec"><h2>🏁 التحديات</h2>' + grid([box(c ? num(c.a) : '—', 'كل التحديات'), box(c ? c.w : '—', 'آخر 7 أيام'), box(c ? c.d : '—', 'آخر 24 ساعة')]) + '</div>';
      h += '<div class="card cf-sec"><h2>💬 الشات والحظر</h2>' + grid([box(num(r[1]), 'بلاغات الشات', r[1] ? '<a href="jo/ads/admin/">راجعها</a>' : ''), box(num(r[2]), 'بريد محظور حالياً'), box(num(r[3]), 'حظر شات حالياً')]) + '<div class="cf-h" style="margin-top:8px;"><a href="jo/admin/bans/">إدارة الحظر</a></div></div>';
      h += '<div class="card cf-sec"><h2>📣 الإعلانات المجانية</h2>' + grid([box(ad ? ad.pending : '—', 'بانتظار الموافقة', ad && ad.pending ? '<a href="jo/ads/admin/">راجعها</a>' : ''), box(ad ? ad.approved : '—', 'منشورة'), box(num(r[5]), 'بلاغات على إعلانات')]) + '</div>';
      h += '<div class="card cf-sec"><h2>📈 الزوار والفهرسة</h2><div class="cf-svc"><a href="https://analytics.google.com/" target="_blank" rel="noopener"><b>Google Analytics</b><span>الزوار والصفحات الأكثر زيارة</span></a><a href="https://search.google.com/search-console" target="_blank" rel="noopener"><b>Search Console</b><span>الظهور في جوجل والفهرسة</span></a></div></div>';
      body.innerHTML = h;
    });
  }
  adsOnUser(function (user, fb) {
    if (!user || !fb) { adsSignInPrompt(body, 'سجّل الدخول بحساب المشرف لفتح الإحصاءات.'); return; }
    adsIsAdmin(fb, user).then(function (ok) {
      if (!ok) { body.innerHTML = '<div class="card" style="margin-top:16px;">هذه الصفحة للمشرف فقط.</div>'; return; }
      load(fb.db);
    });
  });
});
</script>
</body>
