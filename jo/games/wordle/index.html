<script>
const WORDS = ['مدرسة','طاولة','سيارة','حديقة','ملعقة','جامعة','مزرعة','محفظة','تفاحة','ملابس','شمسية','سماعة','طبيعة','حكومة','مملكة','عائلة','رياضة','سياسة','صداقة','عاصمة','كتابة','قراءة','زراعة','صناعة','تجارة','بطاقة','جريدة','قصيدة','رسالة','بداية','نهاية','حقيبة','سفينة','طائرة','دراجة','نافذة','مسافر','مهندس','جميلة','كبيرة','صغيرة','سريعة','بطيئة',
'بستان','فلاحة','سباحة','كرامة','سلامة','شجاعة','نظافة','سيادة','قيادة','زيارة','تجربة','مكتبة','مدينة','بحيرة','جزيرة','صحراء','بناية','زجاجة','بطولة','رواية','حكاية','كنيسة','سفارة','سياحة','نجارة','خياطة','حدادة','تجميل','تعليم','تمريض','تدريب','تنظيف','تصوير','تصميم','تحليل','تفكير','تسويق','ترجمة','تحضير','تنسيق','تشجيع','تنظيم','توظيف','تدقيق','تركيب','توصيل','تسليم','تحكيم','تلوين','تمويل','تدوير',
'طويلة','قصيرة','عريضة','رقيقة','ضعيفة','نظيفة','باردة','ساخنة','رخيصة','غالية','قديمة','جديدة','قريبة','بعيدة','عميقة','واسعة','ثقيلة','خفيفة','ناعمة','مريحة','مزعجة','سعيدة','حزينة','غاضبة','خائفة','متعبة','نشيطة','كسولة','خجولة','طموحة','مبدعة','ناجحة','فاشلة','كاملة','ناقصة'];

function dayIndex() {
  const epoch = new Date('2026-01-01T00:00:00Z');
  const now = new Date();
  const diffDays = Math.floor((Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - epoch.getTime()) / 86400000);
  return ((diffDays % WORDS.length) + WORDS.length) % WORDS.length;
}

let TARGET = [...WORDS[dayIndex()]];
const WORD_LEN = 5;
const MAX_TRIES = 6;
let currentGuess = [];
let attempts = [];
let gameOver = false;
let keyStates = {};

const KEY_ROWS = [
  ['ذ','ض','ص','ث','ق','ف','غ','ع','ه','خ','ح','ج','د'],
  ['ش','س','ي','ب','ل','ا','ت','ن','م','ك','ط'],
  ['ئ','ء','ؤ','ر','ى','ة','و','ز','ظ']
];

function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let r = 0; r < MAX_TRIES; r++) {
    const row = document.createElement('div');
    row.className = 'wordle-row';
    row.id = 'row-' + r;
    for (let c = 0; c < WORD_LEN; c++) {
      const cell = document.createElement('div');
      cell.className = 'wordle-cell';
      cell.id = 'cell-' + r + '-' + c;
      row.appendChild(cell);
    }
    grid.appendChild(row);
  }
}

function buildKeyboard() {
  const kb = document.getElementById('keyboard');
  kb.innerHTML = '';
  KEY_ROWS.forEach(function(row) {
    const rowDiv = document.createElement('div');
    rowDiv.className = 'wordle-keyboard-row';
    row.forEach(function(letter) {
      const btn = document.createElement('button');
      btn.className = 'wordle-key';
      btn.textContent = letter;
      btn.id = 'key-' + letter;
      btn.onclick = function() { pressLetter(letter); };
      rowDiv.appendChild(btn);
    });
    kb.appendChild(rowDiv);
  });
  const controlsRow = document.createElement('div');
  controlsRow.className = 'wordle-keyboard-row';
  const delBtn = document.createElement('button');
  delBtn.className = 'wordle-key';
  delBtn.textContent = '⌫ حذف';
  delBtn.onclick = deleteLetter;
  const enterBtn = document.createElement('button');
  enterBtn.className = 'wordle-key';
  enterBtn.textContent = '✔ إدخال';
  enterBtn.onclick = submitGuess;
  controlsRow.appendChild(delBtn);
  controlsRow.appendChild(enterBtn);
  kb.appendChild(controlsRow);
}

function pressLetter(letter) {
  if (gameOver || currentGuess.length >= WORD_LEN) return;
  currentGuess.push(letter);
  renderCurrentRow();
}

function deleteLetter() {
  if (gameOver) return;
  currentGuess.pop();
  renderCurrentRow();
}

function renderCurrentRow() {
  const r = attempts.length;
  for (let c = 0; c < WORD_LEN; c++) {
    const cell = document.getElementById('cell-' + r + '-' + c);
    cell.textContent = currentGuess[c] || '';
    cell.classList.toggle('filled', !!currentGuess[c]);
  }
}

function showMessage(msg) {
  document.getElementById('message').textContent = msg;
  setTimeout(function() { document.getElementById('message').textContent = ''; }, 2000);
}

function submitGuess() {
  if (gameOver) return;
  if (currentGuess.length !== WORD_LEN) { showMessage('أكمل الكلمة أول (5 حروف)'); return; }

  const guess = [...currentGuess];
  const result = new Array(WORD_LEN).fill('absent');
  const targetCopy = [...TARGET];

  for (let i = 0; i < WORD_LEN; i++) {
    if (guess[i] === targetCopy[i]) { result[i] = 'correct'; targetCopy[i] = null; }
  }
  for (let i = 0; i < WORD_LEN; i++) {
    if (result[i] === 'correct') continue;
    const idx = targetCopy.indexOf(guess[i]);
    if (idx !== -1) { result[i] = 'present'; targetCopy[idx] = null; }
  }

  const r = attempts.length;
  for (let c = 0; c < WORD_LEN; c++) {
    const cell = document.getElementById('cell-' + r + '-' + c);
    cell.classList.add(result[c]);
    const key = document.getElementById('key-' + guess[c]);
    if (key) {
      const rank = {absent:0, present:1, correct:2};
      if (!keyStates[guess[c]] || rank[result[c]] > rank[keyStates[guess[c]]]) {
        keyStates[guess[c]] = result[c];
        key.className = 'wordle-key ' + result[c];
      }
    }
  }

  attempts.push({guess: guess, result: result});

  if (guess.join('') === TARGET.join('')) {
    gameOver = true;
    showMessage('🎉 برافو! خمّنتها صح!');
    document.getElementById('shareBox').style.display = 'flex';
    return;
  }

  currentGuess = [];
  if (attempts.length >= MAX_TRIES) {
    gameOver = true;
    showMessage('الكلمة كانت: ' + TARGET.join(''));
    document.getElementById('shareBox').style.display = 'flex';
  }
}

function playAgain() {
  TARGET = [...WORDS[Math.floor(Math.random() * WORDS.length)]];
  currentGuess = [];
  attempts = [];
  gameOver = false;
  keyStates = {};
  document.getElementById('shareBox').style.display = 'none';
  document.getElementById('message').textContent = '';
  document.getElementById('cardSubtitle') && (document.getElementById('cardSubtitle').textContent = 'جولة عشوائية جديدة — 5 حروف، 6 محاولات');
  buildGrid();
  buildKeyboard();
}

function shareResult() {
  const emojiMap = {correct:'🟩', present:'🟨', absent:'⬜'};
  let text = 'أدواتي — كلمة اليوم 🇯🇴\n' + attempts.length + '/' + MAX_TRIES + '\n\n';
  attempts.forEach(function(a) {
    text += a.result.map(function(r) { return emojiMap[r]; }).join('') + '\n';
  });
  text += '\nجرّب أنت كمان: ' + location.href;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(function() { showMessage('📋 انسخت! الصقها بواتساب'); });
  }
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter') submitGuess();
  else if (e.key === 'Backspace') deleteLetter();
});

buildGrid();
buildKeyboard();
</script>
