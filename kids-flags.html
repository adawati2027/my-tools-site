};
const _PAGE_LANG = (document.documentElement.lang && FT[document.documentElement.lang]) ? document.documentElement.lang : 'en';
let currentLang=_PAGE_LANG;
function ft(k){return (FT[currentLang]||FT.en)[k];}
function getName(item){return item[currentLang]||item.en;}

const TOTAL=20;
let score=0, qIdx=0, answered=false, questions=[];

function shuffle(a){return [...a].sort(()=>Math.random()-.5);}
function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}

function pick3wrong(correct){
  return shuffle(FLAGS.filter(f=>f!==correct)).slice(0,3);
}

function startGame(){
  score=0; qIdx=0; answered=false;
  questions=shuffle(FLAGS).slice(0,TOTAL);
  renderQ();
}

const SPEECH_LANG_CODES = {ar:'ar-SA',en:'en-US',fr:'fr-FR',es:'es-ES',de:'de-DE',ru:'ru-RU'};
let currentCountryKey='';
function speakCountry(){
  if(!currentCountryKey) return;
  const item=FLAGS.find(f=>f.en===currentCountryKey);
  if(!item) return;
  if(window.speechSynthesis){
    speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(getName(item));
    u.lang=SPEECH_LANG_CODES[currentLang]||'en-US'; u.rate=0.85;
    speechSynthesis.speak(u);
  }
}

function renderQ(){
  if(qIdx>=TOTAL){
    const pct=Math.round(score/TOTAL*100);
    const msg=pct>=90?ft('expert'):pct>=70?ft('great'):pct>=50?ft('good'):ft('keep');
    const stars='⭐'.repeat(Math.min(5,Math.ceil(pct/20)));
    document.getElementById('quizArea').innerHTML=`
      <div class="flag-done">
        <div style="font-size:60px;">🏆</div>
        <div style="font-size:22px;font-weight:900;color:#1e40af;margin:10px 0;">${msg}</div>
        <div style="font-size:20px;">${stars}</div>
        <div style="font-size:15px;color:var(--text-muted);margin:8px 0;">${ft('score')}: ${score} / ${TOTAL} (${pct}%)</div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="startGame()">${ft('playAgain')}</button>
      </div>`;
    return;
  }
  const q=questions[qIdx];
  currentCountryKey=q.en;
  const choices=shuffle([q,...pick3wrong(q)]);
  document.getElementById('fScore').textContent=`${ft('score')}: ${score} / ${TOTAL} | ${ft('q')} ${qIdx+1} ${ft('of')} ${TOTAL}`;
  document.getElementById('fFlag').textContent=q.flag;
  document.getElementById('fChoices').innerHTML=choices.map(c=>
    `<button class="flag-choice" onclick="answerQ(this,'${c.en}','${q.en}')">${getName(c)}</button>`
  ).join('');
  document.getElementById('fFeedback').textContent='';
  answered=false;
}

function answerQ(btn,chosenKey,correctKey){
  if(answered) return;
  answered=true;
  const correctItem=FLAGS.find(f=>f.en===correctKey);
  const correctName=getName(correctItem);
  if(chosenKey===correctKey){
    btn.classList.add('correct');
    score++;
    document.getElementById('fFeedback').textContent=ft('correct');
    if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(correctName);u.lang=SPEECH_LANG_CODES[currentLang]||'en-US';speechSynthesis.speak(u);}
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.flag-choice').forEach(b=>{if(b.textContent===correctName) b.classList.add('correct');});
    document.getElementById('fFeedback').textContent=ft('itsX')(correctName);
  }
  setTimeout(()=>{qIdx++;renderQ();},1000);
}

function buildBrowse(){
  document.getElementById('fBrowse').innerHTML=FLAGS.map(f=>
    `<div class="flag-item"><div class="flag-item-emoji">${f.flag}</div>${getName(f)}</div>`
  ).join('');
}

function updateStaticText(){
  document.documentElement.dir=currentLang==='ar'?'rtl':'ltr';
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
  set('fSubtitle',ft('subtitle'));
  set('fQuestion',ft('question'));
  set('fAllCountries',ft('allCountries'));
  set('linkScience',ft('scienceQuiz'));
  set('linkAllKids',ft('allKidsTools'));
  set('backToKids',ft('backToKids'));
  set('navKids',ft('kids'));
  set('navHome',ft('home'));
  buildBrowse();
}

document.addEventListener('DOMContentLoaded',()=>{
  const origSet=window.setLang;
  window.setLang=function(lang){
    origSet&&origSet(lang);
    currentLang=lang;
    updateStaticText();
    renderQ();
  };
  window.onLangChange=function(lang){currentLang=lang;updateStaticText();renderQ();};
  updateStaticText();
  startGame();
});
</script>
