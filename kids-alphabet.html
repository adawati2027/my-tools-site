<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-97DQT5FHPF"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-97DQT5FHPF');</script>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3337905412116301" crossorigin="anonymous"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="/icon-192.svg" type="image/svg+xml">
<title>ABC Alphabet for Kids — Letters with Pictures & Sounds | Adawati</title>
<meta name="description" content="Fun A-Z alphabet learning for kids ages 4-8: each letter has a picture emoji and audio pronunciation. Learn and quiz mode. Free, no signup.">
<meta name="robots" content="index, follow">
<link rel="canonical" href="https://adawati.space/kids-alphabet.html">
<link rel="stylesheet" href="style.css">
<style>
.alpha-tabs{display:flex;gap:8px;justify-content:center;margin-bottom:16px;}
.alpha-tab{padding:10px 24px;border-radius:99px;border:2px solid transparent;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;background:var(--surface-2);color:var(--text);}
.alpha-tab.active{background:var(--primary);color:#fff;}
.alpha-card{text-align:center;padding:20px;background:linear-gradient(135deg,#fef9c3,#fde68a);border-radius:20px;margin-bottom:16px;cursor:pointer;transition:transform .15s;}
.alpha-card:active{transform:scale(.97);}
.alpha-letter{font-size:80px;font-weight:900;color:var(--primary);line-height:1;}
.alpha-emoji{font-size:80px;line-height:1;margin:8px 0;}
.alpha-word{font-size:26px;font-weight:900;color:var(--text);margin:4px 0;}
.alpha-sub{font-size:14px;color:var(--text-muted);font-weight:600;}
.alpha-nav{display:flex;gap:12px;justify-content:center;align-items:center;margin:12px 0;}
.alpha-nav button{width:44px;height:44px;border-radius:50%;border:2px solid var(--border);background:var(--surface-2);font-size:20px;cursor:pointer;font-family:inherit;transition:all .15s;}
.alpha-nav button:hover{border-color:var(--primary);}
.alpha-progress{font-size:14px;font-weight:700;color:var(--text-muted);}
.alpha-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px;margin-top:12px;}
.alpha-grid-item{background:var(--surface-2);border-radius:10px;padding:8px 4px;text-align:center;cursor:pointer;border:2px solid transparent;transition:all .15s;font-weight:800;}
.alpha-grid-item:hover{border-color:var(--primary);}
.alpha-grid-item .gi-letter{font-size:22px;color:var(--primary);font-weight:900;}
.alpha-grid-item .gi-emoji{font-size:20px;}
/* Quiz styles */
.aq-emoji{font-size:100px;text-align:center;line-height:1;margin:10px 0;}
.aq-choices{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:400px;margin:12px auto;}
.aq-choice{padding:16px 8px;border-radius:14px;border:3px solid var(--border);background:var(--surface-2);font-size:28px;font-weight:900;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;color:var(--primary);}
.aq-choice:hover{transform:scale(1.08);border-color:var(--primary);}
.aq-choice.correct{background:#dcfce7;border-color:#22c55e;}
.aq-choice.wrong{background:#fee2e2;border-color:#ef4444;}
</style>
</head>
<body>
<nav class="navbar"><div class="nav-container">
  <a href="index.html" class="nav-brand">Adawati</a>
  <div class="nav-links"><a href="kids-learn.html" id="navKids">🧒 Kids</a><a href="index.html" id="navHome">Home</a></div>
</div></nav>

<main><div class="tool-page">
  <div class="page-header"><a href="kids-learn.html" id="backToKids">← Back to Kids</a></div>
  <div class="card">
    <div class="card-icon" style="background:#fef9c3;">🔤</div>
    <h1 class="card-title">ABC Alphabet</h1>
    <div class="card-subtitle" id="abSubtitle">Letters, Pictures & Sounds — Ages 4–8</div>
    <div class="divider"></div>

    <div class="alpha-tabs">
      <button class="alpha-tab active" onclick="setMode('learn')" id="tabLearn">📖 Learn</button>
      <button class="alpha-tab" onclick="setMode('quiz')" id="tabQuiz">🎯 Quiz</button>
      <button class="alpha-tab" onclick="setMode('grid')" id="tabGrid">🔤 All Letters</button>
    </div>

    <div id="learnMode">
      <div class="alpha-card" onclick="speakCurrent()">
        <div class="alpha-letter" id="aLetter">A</div>
        <div class="alpha-emoji" id="aEmoji">🍎</div>
        <div class="alpha-word" id="aWord">Apple</div>
        <div class="alpha-sub" id="tapToHear">🔊 Tap to hear!</div>
      </div>
      <div class="alpha-nav">
        <button onclick="prevLetter()">◀</button>
        <div class="alpha-progress" id="aProgress">1 / 26</div>
        <button onclick="nextLetter()">▶</button>
      </div>
    </div>

    <div id="quizMode" style="display:none;">
      <div style="font-size:14px;font-weight:700;color:var(--text-muted);text-align:center;margin-bottom:8px;" id="qScore">Score: 0 / 26</div>
      <div style="font-size:16px;font-weight:700;text-align:center;margin-bottom:8px;" id="quizQuestion">Which letter does this start with? 🔊 Tap image to hear!</div>
      <div class="aq-emoji" id="qEmoji" onclick="speakQuizWord()">🍎</div>
      <div style="font-size:18px;font-weight:700;text-align:center;color:var(--text-muted);margin-bottom:10px;" id="qWord"></div>
      <div class="aq-choices" id="qChoices"></div>
      <div style="font-size:20px;font-weight:800;text-align:center;min-height:28px;" id="qFeedback"></div>
    </div>

    <div id="gridMode" style="display:none;">
      <div class="alpha-grid" id="aGrid"></div>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;">
      <a href="kids-spelling.html" class="btn" style="background:var(--surface-2);color:var(--text);text-decoration:none;" id="linkSpelling">🔤 Spelling Bee</a>
      <a href="kids-learn.html" class="btn" style="background:var(--surface-2);color:var(--text);text-decoration:none;" id="linkAllKids">🧒 All Kids Tools</a>
    </div>
  </div>
</div></main>

<script>
const ALPHA = [
  {l:'A',e:'🍎',w:'Apple'}, {l:'B',e:'🐝',w:'Bee'},    {l:'C',e:'🐱',w:'Cat'},
  {l:'D',e:'🐬',w:'Dolphin'},{l:'E',e:'🐘',w:'Elephant'},{l:'F',e:'🦊',w:'Fox'},
  {l:'G',e:'🦒',w:'Giraffe'},{l:'H',e:'🏠',w:'House'},  {l:'I',e:'🍦',w:'Ice Cream'},
  {l:'J',e:'🎵',w:'Jingle'},{l:'K',e:'🦘',w:'Kangaroo'},{l:'L',e:'🦁',w:'Lion'},
  {l:'M',e:'🌙',w:'Moon'},  {l:'N',e:'🌙',w:'Night'},   {l:'O',e:'🐙',w:'Octopus'},
  {l:'P',e:'🦚',w:'Peacock'},{l:'Q',e:'👑',w:'Queen'},  {l:'R',e:'🌈',w:'Rainbow'},
  {l:'S',e:'🦈',w:'Shark'}, {l:'T',e:'🌳',w:'Tree'},    {l:'U',e:'☂️',w:'Umbrella'},
  {l:'V',e:'🌋',w:'Volcano'},{l:'W',e:'🐋',w:'Whale'},  {l:'X',e:'🎸',w:'Xylophone'},
  {l:'Y',e:'🧶',w:'Yarn'},  {l:'Z',e:'🦓',w:'Zebra'},
];
// Fix N
ALPHA[13]={l:'N',e:'🥜',w:'Nut'};
ALPHA[9]={l:'J',e:'🫙',w:'Jar'};

const AB_T = {
  en:{subtitle:'Letters, Pictures & Sounds — Ages 4–8',tabLearn:'📖 Learn',tabQuiz:'🎯 Quiz',tabGrid:'🔤 All Letters',
      tapToHear:'🔊 Tap to hear!',quizQuestion:'Which letter does this start with? 🔊 Tap image to hear!',
      score:'Score',q:'Q',of:'of',correct:'✅ Correct!',itsXfor:(x,w)=>`❌ It's ${x} for ${w}`,playAgain:'Play Again',
      master:'🎉 Alphabet Master!',great:'👍 Great effort!',keep:'💪 Keep practicing!',
      spellingBee:'🔤 Spelling Bee',allKidsTools:'🧒 All Kids Tools',backToKids:'← Back to Kids',kids:'🧒 Kids',home:'Home'},
  ar:{subtitle:'حروف وصور وأصوات — للأطفال من 4 إلى 8 سنوات',tabLearn:'📖 تعلّم',tabQuiz:'🎯 اختبار',tabGrid:'🔤 كل الحروف',
      tapToHear:'🔊 انقر للاستماع!',quizQuestion:'بأي حرف تبدأ هذه الكلمة؟ 🔊 انقر الصورة للاستماع!',
      score:'النتيجة',q:'سؤال',of:'من',correct:'✅ إجابة صحيحة!',itsXfor:(x,w)=>`❌ الحرف الصحيح هو ${x} لكلمة ${w}`,playAgain:'العب مجدداً',
      master:'🎉 سيد الأبجدية!',great:'👍 مجهود رائع!',keep:'💪 استمر في التمرين!',
      spellingBee:'🔤 مسابقة التهجئة',allKidsTools:'🧒 كل أدوات الأطفال',backToKids:'← رجوع للأطفال',kids:'🧒 الأطفال',home:'الرئيسية'},
  fr:{subtitle:'Lettres, images et sons — 4 à 8 ans',tabLearn:'📖 Apprendre',tabQuiz:'🎯 Quiz',tabGrid:'🔤 Toutes les lettres',
      tapToHear:'🔊 Touche pour écouter !',quizQuestion:'Par quelle lettre ce mot commence-t-il ? 🔊 Touche l\'image pour écouter !',
      score:'Score',q:'Q',of:'sur',correct:'✅ Correct !',itsXfor:(x,w)=>`❌ C'est ${x} pour ${w}`,playAgain:'Rejouer',
      master:'🎉 Maître de l\'alphabet !',great:'👍 Bel effort !',keep:'💪 Continue à t\'entraîner !',
      spellingBee:'🔤 Concours d\'orthographe',allKidsTools:'🧒 Tous les jeux enfants',backToKids:'← Retour aux jeux enfants',kids:'🧒 Enfants',home:'Accueil'},
  es:{subtitle:'Letras, imágenes y sonidos — 4 a 8 años',tabLearn:'📖 Aprender',tabQuiz:'🎯 Quiz',tabGrid:'🔤 Todas las letras',
      tapToHear:'🔊 ¡Toca para escuchar!',quizQuestion:'¿Con qué letra empieza esta palabra? 🔊 ¡Toca la imagen para escuchar!',
      score:'Puntaje',q:'P',of:'de',correct:'✅ ¡Correcto!',itsXfor:(x,w)=>`❌ Es ${x} de ${w}`,playAgain:'Jugar de nuevo',
      master:'🎉 ¡Maestro del alfabeto!',great:'👍 ¡Buen esfuerzo!',keep:'💪 ¡Sigue practicando!',
      spellingBee:'🔤 Concurso de ortografía',allKidsTools:'🧒 Todos los juegos infantiles',backToKids:'← Volver a juegos infantiles',kids:'🧒 Niños',home:'Inicio'},
  de:{subtitle:'Buchstaben, Bilder & Töne — 4 bis 8 Jahre',tabLearn:'📖 Lernen',tabQuiz:'🎯 Quiz',tabGrid:'🔤 Alle Buchstaben',
      tapToHear:'🔊 Zum Anhören tippen!',quizQuestion:'Mit welchem Buchstaben beginnt dieses Wort? 🔊 Bild antippen zum Anhören!',
      score:'Punkte',q:'F',of:'von',correct:'✅ Richtig!',itsXfor:(x,w)=>`❌ Es ist ${x} für ${w}`,playAgain:'Nochmal spielen',
      master:'🎉 Alphabet-Meister!',great:'👍 Toller Einsatz!',keep:'💪 Übe weiter!',
      spellingBee:'🔤 Buchstabierwettbewerb',allKidsTools:'🧒 Alle Kinderspiele',backToKids:'← Zurück zu Kinderspielen',kids:'🧒 Kinder',home:'Startseite'},
  ru:{subtitle:'Буквы, картинки и звуки — от 4 до 8 лет',tabLearn:'📖 Учить',tabQuiz:'🎯 Квиз',tabGrid:'🔤 Все буквы',
      tapToHear:'🔊 Нажми, чтобы услышать!',quizQuestion:'С какой буквы начинается это слово? 🔊 Нажми на картинку, чтобы услышать!',
      score:'Счёт',q:'Вопрос',of:'из',correct:'✅ Правильно!',itsXfor:(x,w)=>`❌ Это ${x} для ${w}`,playAgain:'Играть снова',
      master:'🎉 Мастер алфавита!',great:'👍 Отличная попытка!',keep:'💪 Продолжай тренироваться!',
      spellingBee:'🔤 Конкурс правописания',allKidsTools:'🧒 Все детские игры',backToKids:'← Назад к детским играм',kids:'🧒 Детям',home:'Главная'},
};
const _PAGE_LANG = (document.documentElement.lang && AB_T[document.documentElement.lang]) ? document.documentElement.lang : 'en';
let currentLang=_PAGE_LANG;
function abt(k){return (AB_T[currentLang]||AB_T.en)[k];}

let curIdx=0, mode='learn';

function setMode(m){
  mode=m;
  ['learn','quiz','grid'].forEach(x=>{
    document.getElementById(x+'Mode').style.display=x===m?'':'none';
    document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===m);
  });
  if(m==='quiz') startQuiz();
  if(m==='grid') buildGrid();
}

function speak(text,rate){
  if(!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.lang='en-US'; u.rate=rate||0.8;
  speechSynthesis.speak(u);
}

function renderLearn(){
  const a=ALPHA[curIdx];
  document.getElementById('aLetter').textContent=a.l;
  document.getElementById('aEmoji').textContent=a.e;
  document.getElementById('aWord').textContent=a.w;
  document.getElementById('aProgress').textContent=`${curIdx+1} / 26`;
}

function speakCurrent(){speak(`${ALPHA[curIdx].l} is for ${ALPHA[curIdx].w}`);}

function prevLetter(){curIdx=(curIdx-1+26)%26;renderLearn();}
function nextLetter(){curIdx=(curIdx+1)%26;renderLearn();}

// Quiz
let qIdx=0, qScore=0, qAnswered=false, qOrder=[];
function startQuiz(){
  qIdx=0; qScore=0; qAnswered=false;
  qOrder=[...ALPHA].sort(()=>Math.random()-.5);
  renderQuiz();
}
function speakQuizWord(){const a=qOrder[qIdx];speak(`${a.l} is for ${a.w}`);}
function renderQuiz(){
  if(qIdx>=26){
    const pct=Math.round(qScore/26*100);
    document.getElementById('quizMode').innerHTML=`
      <div style="text-align:center;padding:24px;background:linear-gradient(135deg,#fef9c3,#fde68a);border-radius:16px;">
        <div style="font-size:60px;">🏆</div>
        <div style="font-size:22px;font-weight:900;color:var(--primary);margin:10px 0;">${pct>=80?abt('master'):pct>=50?abt('great'):abt('keep')}</div>
        <div style="font-size:15px;color:var(--text-muted);">${abt('score')}: ${qScore} / 26 (${pct}%)</div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="startQuiz()">${abt('playAgain')}</button>
      </div>`;
    return;
  }
  const a=qOrder[qIdx];
  const wrongs=[...ALPHA].filter(x=>x.l!==a.l).sort(()=>Math.random()-.5).slice(0,3);
  const choices=[a,...wrongs].sort(()=>Math.random()-.5);
  document.getElementById('qScore').textContent=`${abt('score')}: ${qScore} / 26 | ${abt('q')} ${qIdx+1} ${abt('of')} 26`;
  document.getElementById('qEmoji').textContent=a.e;
  document.getElementById('qWord').textContent=a.w;
  document.getElementById('qChoices').innerHTML=choices.map(c=>
    `<button class="aq-choice" onclick="answerQuiz(this,'${c.l}','${a.l}')">${c.l}</button>`
  ).join('');
  document.getElementById('qFeedback').textContent='';
  qAnswered=false;
  speak(`${a.w}`);
}
function answerQuiz(btn,chosen,correct){
  if(qAnswered) return;
  qAnswered=true;
  if(chosen===correct){btn.classList.add('correct');qScore++;document.getElementById('qFeedback').textContent=abt('correct');}
  else{btn.classList.add('wrong');document.querySelectorAll('.aq-choice').forEach(b=>{if(b.textContent===correct)b.classList.add('correct');});document.getElementById('qFeedback').textContent=abt('itsXfor')(correct,qOrder[qIdx].w);}
  setTimeout(()=>{qIdx++;renderQuiz();},1000);
}

function buildGrid(){
  document.getElementById('aGrid').innerHTML=ALPHA.map(a=>
    `<div class="alpha-grid-item" onclick="speak('${a.l} is for ${a.w}')">
      <div class="gi-letter">${a.l}</div>
      <div class="gi-emoji">${a.e}</div>
      <div style="font-size:10px;color:var(--text-muted);">${a.w}</div>
    </div>`
  ).join('');
}

function updateStaticText(){
  document.documentElement.dir=currentLang==='ar'?'rtl':'ltr';
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
  set('abSubtitle',abt('subtitle'));
  set('tabLearn',abt('tabLearn'));
  set('tabQuiz',abt('tabQuiz'));
  set('tabGrid',abt('tabGrid'));
  set('tapToHear',abt('tapToHear'));
  set('quizQuestion',abt('quizQuestion'));
  set('linkSpelling',abt('spellingBee'));
  set('linkAllKids',abt('allKidsTools'));
  set('backToKids',abt('backToKids'));
  set('navKids',abt('kids'));
  set('navHome',abt('home'));
}

document.addEventListener('DOMContentLoaded',()=>{
  const origSet=window.setLang;
  window.setLang=function(lang){
    origSet&&origSet(lang);
    currentLang=lang;
    updateStaticText();
    if(mode==='quiz') renderQuiz();
  };
  window.onLangChange=function(lang){currentLang=lang;updateStaticText();if(mode==='quiz')renderQuiz();};
  updateStaticText();
  renderLearn();
});
</script>
<script src="i18n.js?v=39" defer></script>
</body></html>
