"❓ FAQs about VAT":"❓ Частые вопросы об НДС",
"What is VAT (Value Added Tax)?":"Что такое НДС (налог на добавленную стоимость)?",
"VAT is an indirect tax applied to most goods and services. It is paid by the end consumer and collected by businesses on behalf of the government.":"НДС — косвенный налог на большинство товаров и услуг. Его платит конечный потребитель, а собирают компании от имени государства.",
"How do I calculate 5% VAT on an amount?":"Как посчитать НДС 5 % от суммы?",
"Multiply the amount by 0.05. Example: 100 × 0.05 = 5 tax. Total = 105.":"Умножьте сумму на 0,05. Пример: 100 × 0,05 = 5 налога. Итого 105.",
"How do I extract VAT from a VAT-inclusive amount?":"Как выделить НДС из суммы с НДС?",
"Divide the inclusive amount by (1 + tax rate). Example: 105 ÷ 1.05 = 100 (before tax). Tax = 5.":"Разделите сумму с НДС на (1 + ставка). Пример: 105 ÷ 1,05 = 100 (без налога). Налог = 5.",
"Which goods are VAT-exempt in Oman?":"Какие товары освобождены от НДС в Омане?",
"Some qualifying supplies may be zero-rated or exempt subject to Tax Authority conditions — for example, certain basic foodstuffs, qualifying healthcare/education services, residential rental, and certain financial services. Most goods and services remain subject to the standard 5% rate.":"Отдельные поставки могут облагаться по нулевой ставке или освобождаться на условиях Налогового управления — например, некоторые базовые продукты, соответствующие требованиям услуги здравоохранения и образования, аренда жилья и отдельные финансовые услуги. Большинство товаров и услуг облагается стандартной ставкой 5 %.",
"Why is Saudi Arabia's VAT rate 15% instead of 5%?":"Почему в Саудовской Аравии НДС 15 %, а не 5 %?",
"Saudi Arabia raised its VAT from 5% to 15% in July 2020 due to fiscal pressures from COVID-19 and lower oil prices. Oman and UAE have maintained the 5% rate.":"Саудовская Аравия повысила НДС с 5 % до 15 % в июле 2020 года из-за бюджетного давления, вызванного COVID-19 и падением цен на нефть. Оман и ОАЭ сохранили ставку 5 %.",
"When must a business register for VAT in Oman?":"Когда компании нужно встать на учёт по НДС в Омане?",
"Businesses must register when annual turnover exceeds OMR 38,500. Voluntary registration from OMR 19,250. Competent authority: Tax Authority taa.gov.om.":"Регистрация обязательна при годовом обороте свыше 38 500 OMR, добровольная — от 19 250 OMR. Уполномоченный орган: Налоговое управление taa.gov.om.",
"When was VAT introduced in Oman?":"Когда в Омане ввели НДС?",
"Oman implemented VAT at 5% in April 2021, making it the fourth GCC country to introduce VAT, after the UAE and Saudi Arabia (2018) and Bahrain (2019).":"Оман ввёл НДС по ставке 5 % в апреле 2021 года и стал четвёртой страной ССАГПЗ, сделавшей это, — после ОАЭ и Саудовской Аравии (2018) и Бахрейна (2019).",
"Are exports zero-rated for VAT in Oman?":"Облагается ли экспорт из Омана НДС по нулевой ставке?",
"Exports from Oman are zero-rated (0% VAT). Exporters do not charge VAT to foreign buyers but can reclaim any input VAT paid locally.":"Экспорт из Омана облагается по нулевой ставке (0 % НДС). Экспортёры не начисляют НДС иностранным покупателям, но могут вернуть уплаченный внутри страны входящий НДС.",
"How to calculate VAT on a restaurant bill in Oman?":"Как посчитать НДС в счёте ресторана в Омане?",
"Prepared food and restaurant meals are subject to 5% VAT in Oman. Example: bill OMR 20 → VAT = 20 × 0.05 = OMR 1 → total = OMR 21. Enter the amount in the calculator above and select Oman 5% for the instant result.":"Готовая еда и блюда в ресторанах облагаются НДС 5 % в Омане. Пример: счёт 20 OMR → НДС = 20 × 0,05 = 1 OMR → итого 21 OMR. Введите сумму в калькулятор выше и выберите «Оман 5 %», чтобы сразу получить результат.",
"Does VAT apply to salaries and wages in Oman?":"Облагаются ли зарплаты НДС в Омане?",
"No. Salaries and wages are not subject to VAT in Oman. Employment income is outside the scope of VAT. For salary calculations including SPF deduction, use the":"Нет. Зарплаты в Омане НДС не облагаются: доходы от работы по найму не входят в сферу действия НДС. Для расчёта зарплаты с вычетом SPF используйте",
"Salary Calculator":"Калькулятор зарплаты",
"How do I add 5% VAT to a price in Oman?":"Как добавить 5 % НДС к цене в Омане?",
"Multiply the pre-tax price by 1.05. Examples: OMR 50 × 1.05 = OMR 52.5 | OMR 200 × 1.05 = OMR 210 | OMR 1,000 × 1.05 = OMR 1,050. Use the calculator above for any amount instantly.":"Умножьте цену без налога на 1,05. Примеры: 50 OMR × 1,05 = 52,5 OMR | 200 OMR × 1,05 = 210 OMR | 1000 OMR × 1,05 = 1050 OMR. Калькулятор выше мгновенно посчитает любую сумму.",

"VAT in Gulf Countries — Rates and Zero-Rated Categories":"НДС в странах Залива — ставки и категории с нулевой ставкой",
"Value Added Tax (VAT) was introduced across GCC countries at different times. The UAE and Saudi Arabia introduced 5% VAT in January 2018; Saudi Arabia raised its rate to 15% in July 2020. Oman introduced 5% VAT in April 2021. Bahrain introduced 5% in January 2019 (raised to 10% in 2022).":"Налог на добавленную стоимость (НДС) вводился в странах ССАГПЗ в разное время. ОАЭ и Саудовская Аравия ввели НДС 5 % в январе 2018 года; Саудовская Аравия повысила ставку до 15 % в июле 2020 года. Оман ввёл НДС 5 % в апреле 2021 года. Бахрейн ввёл ставку 5 % в январе 2019 года (повысил до 10 % в 2022 году).",
"Adding vs. extracting VAT":"Начисление и выделение НДС",

"Common zero-rated and exempt categories":"Распространённые категории с нулевой ставкой и льготами",
"Certain qualifying food items, healthcare/education services, residential rent, and international exports may be zero-rated (0% VAT) or exempt in GCC countries, subject to specific conditions — these are not blanket category exemptions. Most goods and services remain subject to the standard rate. Always consult the local tax authority for definitive guidance on your specific goods or services.":"Отдельные продукты питания, услуги здравоохранения и образования, аренда жилья и международный экспорт могут облагаться по нулевой ставке (0 % НДС) или освобождаться от налога в странах ССАГПЗ при соблюдении определённых условий — это не общие льготы для целых категорий. Большинство товаров и услуг облагается стандартной ставкой. За окончательным ответом по вашим товарам или услугам всегда обращайтесь в местный налоговый орган."}-->
