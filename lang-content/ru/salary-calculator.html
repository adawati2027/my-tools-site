"What is the difference between basic and gross salary?":"Чем базовый оклад отличается от зарплаты брутто?",
"Basic salary is the fixed amount specified in the employment contract. Gross = Basic + all allowances (housing, transport, etc.).":"Базовый оклад — фиксированная сумма, указанная в трудовом договоре. Брутто = оклад + все пособия (жильё, транспорт и т. д.).",
"Is SPF deducted from allowances?":"Удерживается ли SPF с пособий?",
"SPF is calculated on the contributory wage per SPF rules (cap OMR 3,000 for the basic branch) — this calculator uses basic salary as a simplified input; actual amounts may differ.":"SPF рассчитывается от облагаемой взносами зарплаты по правилам SPF (потолок 3000 OMR для основной ветви) — калькулятор для упрощения использует базовый оклад, поэтому реальные суммы могут отличаться.",
"What is the minimum wage in Oman?":"Какая минимальная зарплата в Омане?",
"The minimum wage for Omani nationals is OMR 325 per month (per the latest decree). Check the Ministry of Labour for official updates.":"Минимальная зарплата для граждан Омана — 325 OMR в месяц (по последнему указу). Официальные обновления смотрите на сайте Министерства труда.",
"How do I estimate my SPF deduction?":"Как оценить мой вычет SPF?",
"This calculator uses basic salary for a simplified 8% estimate. The official calculation depends on the contributory wage per SPF rules. Estimate: deduction ≈ Basic × 8% (cap OMR 3,000 for basic branch).":"Калькулятор использует базовый оклад для упрощённой оценки по ставке 8 %. Официальный расчёт зависит от облагаемой взносами зарплаты по правилам SPF. Оценка: вычет ≈ оклад × 8 % (потолок 3000 OMR для основной ветви).",
"Does SPF deduction apply to expatriates?":"Применяется ли вычет SPF к экспатам?",
"No, the 8% deduction does not apply to expatriate employees. Expatriates have a separate savings system funded by the employer. Expat net salary = gross with no deductions.":"Нет, вычет 8 % не применяется к иностранным работникам. У экспатов отдельная накопительная система, которую финансирует работодатель. Нетто экспата = брутто без вычетов.",
"What does the SPF social protection system cover?":"Что покрывает система социальной защиты SPF?",
"SPF covers several insurance branches including: old age, disability and death; employment security; work injuries and occupational diseases; sick and emergency leave; and maternity leave. For updated details visit spf.gov.om.":"SPF охватывает несколько ветвей страхования: старость, инвалидность и смерть; гарантии занятости; несчастные случаи на производстве и профзаболевания; больничные и отпуска по чрезвычайным обстоятельствам; декретный отпуск. Актуальные данные — на spf.gov.om.",
"Is there income tax on salaries in Oman?":"Есть ли в Омане подоходный налог на зарплату?",
"As of 2026, no personal income tax applies to salaries in Oman. However, the Personal Income Tax (PIT) law was issued in 2025 and will begin applying from 2028 under specific conditions. Currently, the only deduction for Omani employees is SPF at 8%.":"По состоянию на 2026 год подоходный налог с физических лиц на зарплату в Омане не взимается. Однако закон о подоходном налоге с физических лиц (PIT) был принят в 2025 году и начнёт применяться с 2028 года при определённых условиях. Сейчас единственный вычет для работников-оманцев — взнос SPF 8 %.",
"What is the difference between PASI and SPF in Oman?":"Чем PASI отличается от SPF в Омане?",
"PASI (Public Authority for Social Insurance) was the old name of the supervising body. It was merged into the new Social Protection Fund (SPF) which now consolidates all social protection branches in Oman.":"PASI (Государственное управление социального страхования) — прежнее название надзорного органа. Его объединили с новым Фондом социальной защиты (SPF), который теперь объединяет все ветви социальной защиты в Омане.",
"What is the employer SPF contribution rate in Oman?":"Какова ставка взноса работодателя в SPF в Омане?",
"For Omani employees, the employer contributes a combined 14.5% of the contributory wage across active SPF branches (11% for old age/disability/death, with the remaining ~3.5% spread across work injuries, employment security, and maternity/sick leave branches). The employee contributes 8% (7.5% old age/disability/death + 0.5% employment security). Combined total = 22.5% of contributory wage. Rates can change — verify current figures at spf.gov.om.":"За работников-оманцев работодатель платит в сумме 14,5 % облагаемой зарплаты по действующим ветвям SPF (11 % на старость/инвалидность/смерть, остальные ~3,5 % распределены между несчастными случаями на производстве, гарантиями занятости и декретными/больничными). Работник платит 8 % (7,5 % старость/инвалидность/смерть + 0,5 % гарантии занятости). Итого = 22,5 % облагаемой зарплаты. Ставки могут меняться — проверяйте актуальные цифры на spf.gov.om.",
"How is overtime calculated in Oman?":"Как рассчитываются сверхурочные в Омане?",
"Under the Oman Labour Law, overtime on regular weekdays is paid at 125% of the normal hourly rate. Work on weekly rest days or public holidays is paid at 150%. The overtime base is calculated from basic salary only.":"По Трудовому кодексу Омана сверхурочная работа в обычные будни оплачивается в размере 125 % обычной почасовой ставки. Работа в выходные или праздничные дни оплачивается в размере 150 %. База для сверхурочных — только базовый оклад.",

"Oman Salary Calculator — SPF Explained":"Калькулятор зарплаты в Омане — SPF простыми словами",
"Oman's Social Protection Fund (SPF) replaced the previous PASI (Public Authority for Social Insurance) system. Omani national employees contribute 8% of their gross basic salary; employers contribute an additional amount. Expatriate employees are not enrolled in SPF and receive no deduction.":"Фонд социальной защиты Омана (SPF) заменил прежнюю систему PASI (Государственное управление социального страхования). Работники-граждане Омана платят 8 % базового оклада брутто; работодатель платит дополнительный взнос. Иностранные работники в SPF не состоят, и вычетов у них нет.",

"Comparing Job Offers — Why Gross Salary Alone Is Misleading":"Сравнение предложений о работе — почему одна сумма брутто вводит в заблуждение",
"A job offer's headline salary figure is often just the gross basic — comparing two offers by that number alone can be misleading. Before accepting an offer, break it down into its real components:":"Крупная цифра в предложении о работе часто — лишь базовый оклад брутто, и сравнение двух предложений только по ней может ввести в заблуждение. Прежде чем соглашаться, разложите предложение на реальные составляющие:",
"Basic salary":"Базовый оклад",
"— the fixed contractual amount, and the figure most deductions/end-of-service calculations are based on.":"— фиксированная сумма по договору; от неё рассчитывается большинство вычетов и выходное пособие.",
"Allowances":"Пособия",
"(housing, transport, other) — add to take-home pay but usually don't count toward SPF/end-of-service calculations, so a high-allowance/low-basic offer can look attractive monthly but pay out less on exit or in social-insurance contributions.":"(жильё, транспорт и прочее) — увеличивают сумму на руки, но обычно не учитываются для SPF и выходного пособия, поэтому предложение с большими пособиями и низким окладом может выглядеть выгодным каждый месяц, но дать меньше при увольнении или в социальных взносах.",
"Deductions":"Вычеты",
"— SPF (Omani nationals only, see above) or any other agreed deductions.":"— SPF (только граждане Омана, см. выше) или другие согласованные вычеты.",
"Net salary":"Чистая зарплата",
"— what actually reaches your bank account, the number that matters for budgeting.":"— то, что реально поступает на ваш счёт; именно эта цифра важна для бюджета.",
"When comparing two offers, run both through this calculator using their actual basic salary (not the combined gross figure some offer letters lead with) to see a realistic net-pay comparison, and separately check how each structures its basic-vs-allowance split — it affects both your monthly net and your eventual end-of-service benefit.":"Сравнивая два предложения, прогоните оба через калькулятор с их настоящим базовым окладом (а не с общей суммой брутто, которую выделяют некоторые письма-предложения), чтобы реалистично сравнить нетто, и отдельно проверьте соотношение оклада и пособий в каждом — оно влияет и на ежемесячное нетто, и на будущее выходное пособие."}-->
