"What is the difference between the new and old system?":"Чем новая система отличается от старой?",
"Old system: 15 days for years 1–3, 20 days for years 3–5, 30 days after 5 years (calculated from daily rate = basic÷26). New system (Article 61): minimum is one full month's salary per year with fractions pro-rated. The higher amount applies per the employment contract and applicable system.":"Старая система: 15 дней за 1–3-й годы, 20 дней за 3–5-й годы, 30 дней после 5 лет (от дневной ставки = оклад ÷ 26). Новая система (статья 61): минимум один полный оклад в год, неполные годы — пропорционально. Применяется бо́льшая сумма согласно трудовому договору и применимой системе.",
"Am I entitled to gratuity if I worked less than one year?":"Положено ли пособие, если я проработал меньше года?",
"Under the updated Omani Labor Law (Article 61), fractions of a year are calculated proportionally. An employee who completed 6 months is entitled to 0.5 months' salary.":"По обновлённому Трудовому кодексу Омана (статья 61) неполные годы рассчитываются пропорционально. Работник, проработавший 6 месяцев, имеет право на 0,5 оклада.",
"Is an expatriate entitled to end of service gratuity?":"Положено ли выходное пособие экспату?",
"Yes. Oman's Labor Law applies to both Omani nationals and expatriates. Expatriate employees are entitled to end of service gratuity under the stated provisions, and also have an SPF savings program funded by the employer.":"Да. Трудовой кодекс Омана распространяется и на граждан Омана, и на экспатов. Иностранные работники имеют право на выходное пособие по указанным положениям, а также участвуют в накопительной программе SPF, которую финансирует работодатель.",
"Are allowances included in the gratuity calculation?":"Учитываются ли надбавки при расчёте пособия?",
"Under labor law, gratuity is calculated on basic salary only. Some companies include allowances in the individual contract and use them in the calculation — check your contract to confirm.":"По Трудовому кодексу пособие рассчитывается только от базового оклада. Некоторые компании включают надбавки в индивидуальный договор и учитывают их в расчёте — проверьте свой договор.",
"What is the difference in end of service between Omani nationals and expatriates?":"Чем отличается выходное пособие у граждан Омана и экспатов?",
"For Omanis: end of service is managed through the SPF savings program with employer contributions of 11.5% monthly. For expatriates: calculated under Article 61 (minimum one month's salary per year of service).":"У граждан Омана выходное пособие формируется через накопительную программу SPF за счёт ежемесячных взносов работодателя в размере 11,5 %. У экспатов оно рассчитывается по статье 61 (минимум один оклад за год работы).",
"When must end of service gratuity be paid?":"Когда должно быть выплачено выходное пособие?",
"Under Article 91 of Oman's Labor Law, the employer must pay the employee's wages and all entitlements upon termination of employment. If the employee leaves voluntarily, entitlements must be paid within 7 days of the leaving date. In case of delay, the employee can file a complaint with the Ministry of Labour.":"По статье 91 Трудового кодекса Омана работодатель обязан выплатить работнику зарплату и все причитающиеся суммы при прекращении трудовых отношений. Если работник уходит по собственному желанию, выплата должна быть произведена в течение 7 дней с даты ухода. При задержке работник может подать жалобу в Министерство труда.",
"Is gratuity paid in case of resignation?":"Выплачивается ли пособие при увольнении по собственному желанию?",
"Entitlements differ based on the reason for termination, the applicable legal system, and the employment contract. Specific circumstances may affect the entitlement. Check your contract and consult a specialist lawyer to confirm.":"Права зависят от причины прекращения договора, применимой правовой системы и трудового договора. Особые обстоятельства могут повлиять на право на пособие. Проверьте договор и проконсультируйтесь с профильным юристом.",
"What is the minimum service period to claim gratuity?":"Какой минимальный стаж нужен, чтобы получить пособие?",
"End of service gratuity is calculated per the provisions applicable to the employee, their contract, and the prevailing legal system. Do not use the 3-year rule as a general rule; entitlements may differ based on the termination reason and applicable system.":"Выходное пособие рассчитывается по положениям, применимым к работнику, его договору и действующей правовой системе. Не применяйте «правило трёх лет» как общее; права могут различаться в зависимости от причины увольнения и применимой системы.",
"Am I entitled to full gratuity if I resign?":"Положено ли полное пособие при увольнении по собственному желанию?",
"Under the updated Article 61, gratuity is calculated proportionally for each year of service whether termination is employee- or employer-initiated. In case of disciplinary dismissal under Article 40, gratuity may be forfeited in whole or in part. Consult a specialist lawyer for your specific situation.":"По обновлённой статье 61 пособие рассчитывается пропорционально за каждый год работы — независимо от того, кто инициировал прекращение договора. При дисциплинарном увольнении по статье 40 пособие может быть утрачено полностью или частично. Проконсультируйтесь с профильным юристом по вашей ситуации.",
"How is gratuity calculated for a partial year?":"Как рассчитывается пособие за неполный год?",
