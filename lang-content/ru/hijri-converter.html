"What is the difference between Hijri and Gregorian calendars?":"Чем календарь хиджры отличается от григорианского?",
"The Hijri calendar is lunar (based on moon cycles) with 354-355 days per year. The Gregorian calendar is solar with 365-366 days. This is why the Hijri year advances about 11 days each Gregorian year.":"Календарь хиджры — лунный (по циклам луны), в году 354–355 дней. Григорианский — солнечный, в году 365–366 дней. Поэтому год хиджры каждый григорианский год смещается примерно на 11 дней.",
"When did the Hijri calendar begin?":"Когда начался календарь хиджры?",
"The Hijri calendar began from the Prophet Muhammad's ﷺ migration (Hijra) from Mecca to Medina, corresponding to July 16, 622 CE.":"Летоисчисление хиджры начинается с переселения (хиджры) Пророка Мухаммада ﷺ из Мекки в Медину, что соответствует 16 июля 622 года н. э.",
"Why might the Hijri date differ by a day?":"Почему дата по хиджре может отличаться на день?",

"How do I find today's Hijri date?":"Как узнать сегодняшнюю дату по хиджре?",

"What are the Hijri months in order?":"Какие месяцы хиджры по порядку?",
"Muharram, Safar, Rabi al-Awwal, Rabi al-Thani, Jumada al-Awwal, Jumada al-Thani, Rajab, Sha'ban, Ramadan, Shawwal, Dhu al-Qi'dah, Dhu al-Hijjah — 12 lunar months in each Hijri year.":"Мухаррам, Сафар, Раби аль-авваль, Раби ас-сани, Джумада аль-уля, Джумада ас-сания, Раджаб, Шаабан, Рамадан, Шавваль, Зуль-када, Зуль-хиджа — 12 лунных месяцев в каждом году хиджры.",
"How do I accurately convert a Gregorian date to Hijri?":"Как точно перевести григорианскую дату в хиджру?",
"Use the first tab \"Gregorian → Hijri\" and enter the Gregorian date. The tool uses a tabular Hijri calendar algorithm. Note that the official date in some countries may differ by 1–2 days due to local moon sighting.":"Откройте первую вкладку «Григорианский → Хиджра» и введите григорианскую дату. Инструмент использует табличный алгоритм календаря хиджры. Учтите, что официальная дата в некоторых странах может отличаться на 1–2 дня из-за местного наблюдения луны.",
