"How does the loan calculator work?":"Как работает кредитный калькулятор?",
"This calculator uses the equal installment (amortization) formula used by most banks. The monthly payment stays fixed throughout the loan term, but the split between principal and interest changes each month.":"Калькулятор использует формулу равных (аннуитетных) платежей, которую применяют большинство банков. Ежемесячный платёж остаётся одинаковым весь срок, но соотношение основного долга и процентов в нём меняется каждый месяц.",
"Early on, most of each payment goes to interest. Over time, the principal portion grows and interest shrinks. The full amortization schedule shows this month by month.":"В начале большая часть платежа уходит на проценты. Со временем доля основного долга растёт, а доля процентов уменьшается. Полный график погашения показывает это помесячно.",
"Formula: Payment = Principal × (r × (1+r)ⁿ) / ((1+r)ⁿ − 1) where r = monthly rate, n = number of months. At 0% interest, the amount is divided equally over all months.":"Формула: Платёж = Сумма × (r × (1+r)ⁿ) / ((1+r)ⁿ − 1), где r — месячная ставка, n — число месяцев. При ставке 0 % сумма делится поровну на все месяцы.",

"* 6% annual rate shown for comparison only. Use the calculator above for your actual rate.":"* Ставка 6 % годовых показана только для сравнения. Для своей ставки используйте калькулятор выше.",
"Frequently Asked Questions about Loans":"Частые вопросы о кредитах",
"What is the difference between simple and compound interest?":"Чем простые проценты отличаются от сложных?",
"Simple interest is calculated on the original principal only. Compound interest is calculated on the principal plus accumulated interest. Most personal and mortgage loans use amortization, which applies interest to the remaining balance each month.":"Простые проценты начисляются только на исходную сумму. Сложные — на сумму плюс накопленные проценты. Большинство потребительских и ипотечных кредитов аннуитетные: проценты ежемесячно начисляются на остаток долга.",
"How can I reduce total interest paid?":"Как уменьшить общую сумму процентов?",
"Three ways: (1) Shorten the loan term — lower total interest despite a higher monthly payment. (2) Make extra principal payments. (3) Get a lower interest rate by comparing bank offers.":"Три способа: (1) сократить срок кредита — меньше процентов в сумме, хотя платёж выше; (2) вносить досрочные платежи в счёт основного долга; (3) получить ставку ниже, сравнив предложения банков.",
"Does the calculator include insurance and admin fees?":"Учитывает ли калькулятор страховку и комиссии?",
"No, it calculates the base payment only. Banks may add life insurance premiums, administrative fees, and origination charges. Contact your bank for the full payment amount.":"Нет, он считает только базовый платёж. Банки могут добавлять страхование жизни, административные сборы и комиссию за выдачу. Полную сумму платежа уточняйте в банке.",
"What is an amortization schedule?":"Что такое график погашения?",
"An amortization schedule shows month-by-month how each payment is split between principal and interest, and tracks the remaining balance after each payment.":"График погашения показывает по месяцам, как каждый платёж делится между основным долгом и процентами, и отслеживает остаток долга после каждого платежа.",
"What is a healthy debt-to-income ratio?":"Какая долговая нагрузка считается нормальной?",
"Acceptable debt-to-income ratios vary by bank and individual circumstances — there is no universal rule. Consult your lender to find out the limit that applies to your situation.":"Допустимое соотношение долга и дохода зависит от банка и вашей ситуации — универсального правила нет. Узнайте у кредитора, какой лимит применяется в вашем случае.",
"Does early repayment save interest?":"Экономит ли досрочное погашение проценты?",
"Yes. Every extra payment on the principal reduces the remaining balance and therefore interest in future months. Extra payments early in the loan term save significantly more than later. Check your contract for any early repayment penalty.":"Да. Каждый дополнительный платёж в счёт основного долга уменьшает остаток, а значит, и проценты в следующие месяцы. Досрочные платежи в начале срока экономят гораздо больше, чем ближе к концу. Проверьте в договоре, нет ли штрафа за досрочное погашение.",
"What is the difference between Islamic finance and a conventional loan?":"Чем исламское финансирование отличается от обычного кредита?",
"In Islamic finance (Murabaha/Ijara), the bank buys the asset and sells it at a pre-agreed profit — technically no interest. In a conventional loan, interest accrues on the remaining balance monthly. This calculator works for both if you enter the equivalent annual rate.":"В исламском финансировании (мурабаха/иджара) банк покупает актив и продаёт его клиенту с заранее согласованной наценкой — формально без процентов. В обычном кредите проценты ежемесячно начисляются на остаток долга. Калькулятор подходит для обоих вариантов, если ввести эквивалентную годовую ставку.",

"The calculator uses the standard amortization formula:":"Калькулятор использует стандартную формулу аннуитета:",
"Payment = P × [r(1+r)ⁿ] ÷ [(1+r)ⁿ − 1]":"Платёж = P × [r(1+r)ⁿ] ÷ [(1+r)ⁿ − 1]",
", where P is the principal, r is the monthly interest rate (annual rate ÷ 12), and n is the total number of monthly payments. Results are estimates — actual bank payments may include fees, insurance, or early-settlement charges.":", где P — сумма кредита, r — месячная ставка (годовая ставка ÷ 12), n — общее число ежемесячных платежей. Результаты приблизительные — реальные банковские платежи могут включать комиссии, страховку или штрафы за досрочное погашение.",
"Total interest vs. monthly payment":"Общие проценты или размер платежа",
"A lower monthly payment is not always better. A 5-year loan costs less total interest than a 10-year loan at the same rate, even though the monthly payment is higher. Use the repayment schedule to compare the total interest paid over the full loan term.":"Меньший ежемесячный платёж не всегда лучше. Кредит на 5 лет обходится в меньшую сумму процентов, чем на 10 лет под ту же ставку, хотя платёж выше. Сравните общие проценты за весь срок по графику погашения.",
"Gulf country note":"Примечание для стран Залива",
"Banks in Oman, Saudi Arabia and UAE often quote a flat interest rate rather than APR. A 5% flat rate is roughly equivalent to 9-10% APR under amortization. Always ask your bank for the APR to compare loans on equal terms.":"Банки Омана, Саудовской Аравии и ОАЭ часто указывают ставку flat rate, а не полную стоимость кредита (APR). Flat rate 5 % примерно соответствует 9–10 % APR при аннуитетном погашении. Всегда спрашивайте у банка APR, чтобы сравнивать кредиты на равных.",

"$11,599.68 total paid":"11 599,68 $ всего выплачено",
". Note this is a few cents different from simply multiplying 193.33 × 60 ($11,599.80) — that tiny gap is exactly the rounding you'd expect once you round the monthly figure before multiplying instead of after.":". Это на несколько центов отличается от простого умножения 193,33 × 60 (11 599,80 $) — ровно та разница, которую даёт округление платежа до умножения, а не после.",

"Notice that even though you're paying back $11,599.68 total, only $10,000 of that is the money you actually borrowed — the other $1,599.68 is what the loan costs you for spreading repayment over 5 years instead of paying in full today. Try the calculator above with a shorter term (say 3 years) on the same $10,000 at 6% — the monthly payment goes up, but total interest drops, because the bank charges interest on the outstanding balance for less time.":"Обратите внимание: хотя всего вы возвращаете 11 599,68 $, из них только 10 000 $ — это реально взятые в долг деньги, а остальные 1599,68 $ — плата за то, что вы растянули возврат на 5 лет вместо того, чтобы заплатить всё сразу. Попробуйте калькулятор выше с более коротким сроком (например, 3 года) на те же 10 000 $ под 6 %: платёж вырастет, но общая сумма процентов уменьшится, потому что банк начисляет проценты на остаток долга меньшее время.",
