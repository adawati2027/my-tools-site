"What is BMI (Body Mass Index)?":"Что такое ИМТ (индекс массы тела)?",
"Body Mass Index (BMI) is a simple measurement used to estimate body fat based on weight and height. Devised by the statistician Adolphe Quetelet in the 19th century and adopted by the World Health Organization (WHO) for its weight classification, it is the most widely used tool globally for screening healthy weight.":"Индекс массы тела (ИМТ) — простой показатель, позволяющий оценить количество жира в организме по весу и росту. Его предложил статистик Адольф Кетле в XIX веке, а Всемирная организация здравоохранения (ВОЗ) взяла его за основу своей классификации веса; это самый распространённый в мире инструмент для оценки здорового веса.",
"BMI is calculated by dividing weight in kilograms by the square of height in meters. The result is classified into four categories: underweight, normal weight, overweight, and obese.":"ИМТ рассчитывается делением веса в килограммах на квадрат роста в метрах. Результат относится к одной из четырёх категорий: недостаточный вес, нормальный вес, избыточный вес и ожирение.",
"Note that BMI does not differentiate between fat and muscle, so it may not accurately reflect the situation of athletes, children, or the elderly. Use it as a general indicator, not a medical diagnosis.":"Учтите, что ИМТ не различает жир и мышцы, поэтому может неточно отражать ситуацию у спортсменов, детей и пожилых людей. Используйте его как общий ориентир, а не медицинский диагноз.",
"How is BMI calculated?":"Как рассчитывается ИМТ?",
"The mathematical formula for calculating BMI is:":"Математическая формула ИМТ:",
"BMI = Weight (kg) ÷ Height² (m)":"ИМТ = Вес (кг) ÷ Рост² (м)",
"Example: A person weighing 75 kg and 175 cm tall (1.75 m):":"Пример: человек весом 75 кг и ростом 175 см (1,75 м):",
"BMI = 75 ÷ (1.75 × 1.75) = 75 ÷ 3.0625 ≈ 24.5":"ИМТ = 75 ÷ (1,75 × 1,75) = 75 ÷ 3,0625 ≈ 24,5",
"The result 24.5 falls in the normal range (18.5 – 24.9). If using pounds and inches: BMI = (weight in lbs ÷ height in inches²) × 703":"Результат 24,5 находится в пределах нормы (18,5 – 24,9). Для фунтов и дюймов: ИМТ = (вес в фунтах ÷ рост в дюймах²) × 703",
"Frequently Asked Questions about BMI":"Частые вопросы об ИМТ",
"Is BMI accurate for everyone?":"Точен ли ИМТ для всех?",
"BMI is a useful general indicator for most adults, but may be less accurate for athletes (muscle weighs more than fat), pregnant women, children, and older adults. For a more accurate assessment, consult a doctor and consider additional measurements like waist circumference or body fat percentage.":"ИМТ — полезный общий показатель для большинства взрослых, но он может быть менее точным для спортсменов (мышцы тяжелее жира), беременных, детей и пожилых людей. Для более точной оценки обратитесь к врачу и используйте дополнительные измерения — окружность талии или процент жира.",
"What is the ideal BMI for adults?":"Какой ИМТ идеален для взрослых?",
"According to WHO, a BMI between 18.5 and 24.9 is considered ideal for adults. Children and adolescents use separate growth charts that account for age and sex. Some research suggests the optimal range may vary by ethnicity and body composition.":"По данным ВОЗ, идеальным для взрослых считается ИМТ от 18,5 до 24,9. Для детей и подростков используются отдельные кривые роста с учётом возраста и пола. Некоторые исследования показывают, что оптимальный диапазон может зависеть от этнической принадлежности и состава тела.",
"How do I calculate BMI in pounds and inches?":"Как рассчитать ИМТ в фунтах и дюймах?",
"If your weight is in pounds and height in inches, use: BMI = (weight in lbs ÷ height in inches²) × 703. Quick conversion: 1 kg = 2.205 lbs, 1 inch = 2.54 cm. This calculator uses metric units (kg and cm) only.":"Если вес указан в фунтах, а рост в дюймах: ИМТ = (вес в фунтах ÷ рост в дюймах²) × 703. Быстрый перевод: 1 кг = 2,205 фунта, 1 дюйм = 2,54 см. Этот калькулятор использует только метрические единицы (кг и см).",
"Does BMI differ between men and women?":"Отличается ли ИМТ у мужчин и женщин?",
"The BMI formula is the same for both sexes, but body composition differs. Women typically have a higher fat percentage than men at the same BMI. Some doctors recommend supplementing BMI with waist circumference or waist-to-hip ratio for a more accurate assessment.":"Формула ИМТ одинакова для обоих полов, но состав тела разный. При одинаковом ИМТ у женщин обычно больше процент жира, чем у мужчин. Некоторые врачи советуют дополнять ИМТ окружностью талии или отношением талии к бёдрам.",
"What are the health risks of high or low BMI?":"Чем опасен высокий или низкий ИМТ?",
"A high BMI (≥30) is linked to increased risk of type 2 diabetes, heart disease, high blood pressure, and some cancers. A low BMI (&lt;18.5) is associated with weakened immunity, osteoporosis, and malnutrition. In both cases, consult a doctor.":"Высокий ИМТ (≥ 30) связан с повышенным риском диабета 2-го типа, болезней сердца, гипертонии и некоторых видов рака. Низкий ИМТ (&lt; 18,5) связан с ослабленным иммунитетом, остеопорозом и недоеданием. В обоих случаях обратитесь к врачу.",
"How is BMI calculated — with a worked example?":"Как рассчитывается ИМТ — с примером?",
"BMI formula: weight (kg) ÷ height² (m). Example: a person weighing 75 kg and 175 cm tall: 75 ÷ (1.75 × 1.75) = 75 ÷ 3.0625 ≈ 24.5. This falls in the Normal range (18.5–24.9) per WHO standards.":"Формула ИМТ: вес (кг) ÷ рост² (м). Пример: человек весом 75 кг и ростом 175 см: 75 ÷ (1,75 × 1,75) = 75 ÷ 3,0625 ≈ 24,5. По нормам ВОЗ это нормальный диапазон (18,5–24,9).",
"What is the ideal weight for my height?":"Какой идеальный вес для моего роста?",
"Ideal weight = normal BMI range (18.5–24.9) × height² in metres. Example for 170 cm (1.70 m): lower = 18.5 × (1.70²) ≈ 53.5 kg, upper = 24.9 × (1.70²) ≈ 71.9 kg. Any weight between 53.5 and 71.9 kg is ideal for this height.":"Идеальный вес = нормальный диапазон ИМТ (18,5–24,9) × рост² в метрах. Пример для 170 см (1,70 м): нижняя граница = 18,5 × (1,70²) ≈ 53,5 кг, верхняя = 24,9 × (1,70²) ≈ 71,9 кг. Любой вес от 53,5 до 71,9 кг идеален для этого роста.",
"Is BMI suitable for children?":"Подходит ли ИМТ для детей?",
"No. Children and adolescents under 18 use specialised growth charts (BMI-for-age) that account for sex and age. Adult BMI values (18.5–24.9 normal) do not apply to children. Consult a paediatrician for an accurate assessment.":"Нет. Для детей и подростков до 18 лет используются специальные кривые роста (ИМТ по возрасту) с учётом пола и возраста. Взрослые значения (18,5–24,9 — норма) к детям не применяются. Для точной оценки обратитесь к педиатру.",

"BMI does not measure body fat directly. A muscular athlete may score in the \"overweight\" range despite low body fat. Older adults may have a normal BMI but carry excess fat. Always combine BMI with other health markers and consult a doctor for a complete assessment.":"ИМТ не измеряет жир напрямую. Мускулистый спортсмен может попасть в категорию «избыточный вес» при низком проценте жира. У пожилых людей ИМТ может быть нормальным при избытке жира. Всегда сочетайте ИМТ с другими показателями здоровья и обращайтесь к врачу для полной оценки.",
