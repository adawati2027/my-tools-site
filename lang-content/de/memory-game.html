"How does the memory card matching game work?":"Wie funktioniert das Memory-Kartenspiel?",
"Cards are placed face-down. You flip two at a time — if they match, they stay face-up; if not, they flip back. The goal is to match all pairs in as few flips as possible. Tests short-term memory and concentration.":"Die Karten liegen verdeckt. Du deckst jeweils zwei auf – passen sie zusammen, bleiben sie offen; wenn nicht, werden sie wieder umgedreht. Ziel ist es, alle Paare mit möglichst wenigen Zügen zu finden. Das trainiert Kurzzeitgedächtnis und Konzentration.",
"What difficulty levels does the memory game have?":"Welche Schwierigkeitsstufen hat das Memory-Spiel?",
"There are 6 levels from Easy (fewer cards) to Legendary (many cards with a strict time limit). Higher levels present more cards and less time, making it progressively more challenging for experienced players.":"Es gibt 6 Stufen von Leicht (wenige Karten) bis Legendär (viele Karten mit strengem Zeitlimit). Höhere Stufen bieten mehr Karten und weniger Zeit und werden so auch für erfahrene Spieler immer anspruchsvoller.",
"How to play the Memory Game":"So spielst du Memory",
"Turn over two cards at a time and try to find matching pairs. Matching cards stay face-up; the rest flip back. Finish the board in as few moves and as little time as possible.":"Decke jeweils zwei Karten auf und versuche, passende Paare zu finden. Passende Karten bleiben offen, die anderen werden wieder umgedreht. Schaffe das Spielfeld mit möglichst wenigen Zügen in möglichst kurzer Zeit.",
"Tips for remembering more cards":"Tipps, um dir mehr Karten zu merken",
"Work systematically from one corner instead of clicking randomly. Say what you see in your head (\"star, top left\"), and when you flip one new card, check whether you have already seen its partner before flipping a second unknown card.":"Geh systematisch von einer Ecke aus vor, statt wahllos zu klicken. Benenne im Kopf, was du siehst („Stern, oben links“), und prüfe beim Aufdecken einer neuen Karte, ob du ihr Gegenstück schon gesehen hast, bevor du eine zweite unbekannte Karte umdrehst.",
"Why it is good practice":"Warum es ein gutes Training ist",
"Matching games exercise short-term and visual memory and concentration. They are a gentle brain workout for children and adults alike.":"Memory-Spiele trainieren Kurzzeit- und visuelles Gedächtnis sowie die Konzentration – ein sanftes Gehirntraining für Kinder und Erwachsene."}-->
