"How does the Quick Math challenge work?":"Wie funktioniert die Kopfrechen-Challenge?",
"You are given arithmetic questions — addition, subtraction, multiplication, division — and must answer before the timer runs out. 100 levels progress from simple sums to complex calculations. Each correct answer earns points and advances your level.":"Du bekommst Rechenaufgaben — Addition, Subtraktion, Multiplikation, Division — und musst antworten, bevor die Zeit abläuft. Die 100 Level reichen von einfachen Summen bis zu komplexen Rechnungen. Jede richtige Antwort bringt Punkte und lässt dich aufsteigen.",
"Does practicing mental arithmetic actually improve math skills?":"Verbessert Kopfrechentraining wirklich die Mathe-Fähigkeiten?",
"Yes. Timed mental math practice improves calculation speed and recall of number facts. The pressure of a timer forces your brain to access arithmetic knowledge faster, a technique used in educational programs worldwide.":"Ja. Kopfrechnen unter Zeitdruck verbessert die Rechengeschwindigkeit und das Abrufen von Zahlenfakten. Der Druck des Timers zwingt das Gehirn, schneller auf Rechenwissen zuzugreifen – eine Methode, die weltweit in Lernprogrammen eingesetzt wird.",
"How to play Quick Math":"So spielst du Kopfrechnen",
