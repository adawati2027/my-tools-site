"How does the loan calculator work?":"Wie funktioniert der Kreditrechner?",
"This calculator uses the equal installment (amortization) formula used by most banks. The monthly payment stays fixed throughout the loan term, but the split between principal and interest changes each month.":"Dieser Rechner nutzt die Annuitätenformel (gleichbleibende Raten), die die meisten Banken verwenden. Die Monatsrate bleibt über die gesamte Laufzeit gleich, aber die Aufteilung zwischen Tilgung und Zinsen ändert sich jeden Monat.",
"Early on, most of each payment goes to interest. Over time, the principal portion grows and interest shrinks. The full amortization schedule shows this month by month.":"Anfangs geht der größte Teil jeder Rate in die Zinsen. Mit der Zeit wächst der Tilgungsanteil und der Zinsanteil sinkt. Der vollständige Tilgungsplan zeigt das Monat für Monat.",
"Formula: Payment = Principal × (r × (1+r)ⁿ) / ((1+r)ⁿ − 1) where r = monthly rate, n = number of months. At 0% interest, the amount is divided equally over all months.":"Formel: Rate = Kreditbetrag × (r × (1+r)ⁿ) / ((1+r)ⁿ − 1), wobei r = Monatszins und n = Anzahl der Monate. Bei 0 % Zinsen wird der Betrag gleichmäßig auf alle Monate verteilt.",

"Frequently Asked Questions about Loans":"Häufige Fragen zu Krediten",
"What is the difference between simple and compound interest?":"Was ist der Unterschied zwischen einfachen Zinsen und Zinseszins?",
"Simple interest is calculated on the original principal only. Compound interest is calculated on the principal plus accumulated interest. Most personal and mortgage loans use amortization, which applies interest to the remaining balance each month.":"Einfache Zinsen werden nur auf den ursprünglichen Betrag berechnet, Zinseszinsen auf Betrag plus angesammelte Zinsen. Die meisten Privat- und Baukredite sind Annuitätenkredite: Die Zinsen werden jeden Monat auf die Restschuld berechnet.",
"How can I reduce total interest paid?":"Wie kann ich die Gesamtzinsen senken?",
"Three ways: (1) Shorten the loan term — lower total interest despite a higher monthly payment. (2) Make extra principal payments. (3) Get a lower interest rate by comparing bank offers.":"Drei Wege: (1) Laufzeit verkürzen – weniger Zinsen insgesamt trotz höherer Rate. (2) Sondertilgungen leisten. (3) Durch den Vergleich von Bankangeboten einen niedrigeren Zinssatz bekommen.",
"Does the calculator include insurance and admin fees?":"Enthält der Rechner Versicherungen und Bearbeitungsgebühren?",
"No, it calculates the base payment only. Banks may add life insurance premiums, administrative fees, and origination charges. Contact your bank for the full payment amount.":"Nein, er berechnet nur die Grundrate. Banken können Lebensversicherungsprämien, Verwaltungs- und Bearbeitungsgebühren hinzufügen. Die vollständige Rate erfährst du bei deiner Bank.",
"What is an amortization schedule?":"Was ist ein Tilgungsplan?",
"An amortization schedule shows month-by-month how each payment is split between principal and interest, and tracks the remaining balance after each payment.":"Ein Tilgungsplan zeigt Monat für Monat, wie sich jede Rate auf Tilgung und Zinsen aufteilt, und verfolgt die Restschuld nach jeder Zahlung.",
"What is a healthy debt-to-income ratio?":"Welche Schuldenquote ist gesund?",
"Acceptable debt-to-income ratios vary by bank and individual circumstances — there is no universal rule. Consult your lender to find out the limit that applies to your situation.":"Die akzeptable Schuldenquote (Verhältnis von Schulden zu Einkommen) hängt von Bank und persönlicher Situation ab – eine allgemeingültige Regel gibt es nicht. Frag deinen Kreditgeber, welche Grenze für dich gilt.",
"Does early repayment save interest?":"Spart eine vorzeitige Rückzahlung Zinsen?",
"Yes. Every extra payment on the principal reduces the remaining balance and therefore interest in future months. Extra payments early in the loan term save significantly more than later. Check your contract for any early repayment penalty.":"Ja. Jede zusätzliche Tilgung senkt die Restschuld und damit die Zinsen der folgenden Monate. Sondertilgungen früh in der Laufzeit sparen deutlich mehr als spätere. Prüfe deinen Vertrag auf eine Vorfälligkeitsentschädigung.",
"What is the difference between Islamic finance and a conventional loan?":"Was ist der Unterschied zwischen islamischer Finanzierung und einem herkömmlichen Kredit?",
"In Islamic finance (Murabaha/Ijara), the bank buys the asset and sells it at a pre-agreed profit — technically no interest. In a conventional loan, interest accrues on the remaining balance monthly. This calculator works for both if you enter the equivalent annual rate.":"Bei der islamischen Finanzierung (Murabaha/Idschara) kauft die Bank den Gegenstand und verkauft ihn mit einem vorher vereinbarten Gewinnaufschlag – formal ohne Zinsen. Beim herkömmlichen Kredit fallen monatlich Zinsen auf die Restschuld an. Der Rechner funktioniert für beides, wenn du den gleichwertigen Jahreszins eingibst.",

"Payment = P × [r(1+r)ⁿ] ÷ [(1+r)ⁿ − 1]":"Rate = P × [r(1+r)ⁿ] ÷ [(1+r)ⁿ − 1]",
", where P is the principal, r is the monthly interest rate (annual rate ÷ 12), and n is the total number of monthly payments. Results are estimates — actual bank payments may include fees, insurance, or early-settlement charges.":", wobei P der Kreditbetrag, r der monatliche Zinssatz (Jahreszins ÷ 12) und n die Gesamtzahl der Monatsraten ist. Die Ergebnisse sind Schätzungen – tatsächliche Bankraten können Gebühren, Versicherungen oder Vorfälligkeitsentschädigungen enthalten.",
"Total interest vs. monthly payment":"Gesamtzinsen vs. Monatsrate",
"A lower monthly payment is not always better. A 5-year loan costs less total interest than a 10-year loan at the same rate, even though the monthly payment is higher. Use the repayment schedule to compare the total interest paid over the full loan term.":"Eine niedrigere Monatsrate ist nicht immer besser. Ein 5-Jahres-Kredit kostet beim gleichen Zinssatz insgesamt weniger Zinsen als ein 10-Jahres-Kredit, auch wenn die Monatsrate höher ist. Vergleiche mit dem Tilgungsplan die über die gesamte Laufzeit gezahlten Zinsen.",
"Gulf country note":"Hinweis für die Golfstaaten",
"Banks in Oman, Saudi Arabia and UAE often quote a flat interest rate rather than APR. A 5% flat rate is roughly equivalent to 9-10% APR under amortization. Always ask your bank for the APR to compare loans on equal terms.":"Banken im Oman, in Saudi-Arabien und den VAE nennen oft einen Flat-Zinssatz statt eines effektiven Jahreszinses. Eine Flat Rate von 5 % entspricht bei Annuitätentilgung ungefähr 9–10 % effektivem Jahreszins. Frag deine Bank immer nach dem effektiven Jahreszins, um Kredite fair zu vergleichen.",

"$11,599.68 total paid":"11.599,68 $ insgesamt gezahlt",

"Notice that even though you're paying back $11,599.68 total, only $10,000 of that is the money you actually borrowed — the other $1,599.68 is what the loan costs you for spreading repayment over 5 years instead of paying in full today. Try the calculator above with a shorter term (say 3 years) on the same $10,000 at 6% — the monthly payment goes up, but total interest drops, because the bank charges interest on the outstanding balance for less time.":"Obwohl du insgesamt 11.599,68 $ zurückzahlst, sind nur 10.000 $ davon das Geld, das du tatsächlich geliehen hast – die übrigen 1.599,68 $ kostet es dich, die Rückzahlung über 5 Jahre zu verteilen, statt heute alles zu zahlen. Probiere den Rechner oben mit einer kürzeren Laufzeit (etwa 3 Jahre) für dieselben 10.000 $ zu 6 % aus: Die Monatsrate steigt, aber die Gesamtzinsen sinken, weil die Bank kürzer Zinsen auf die Restschuld berechnet.",
