"What is VAT (Value Added Tax)?":"Was ist die Mehrwertsteuer (MwSt.)?",
"VAT is an indirect tax applied to most goods and services. It is paid by the end consumer and collected by businesses on behalf of the government.":"Die Mehrwertsteuer ist eine indirekte Steuer auf die meisten Waren und Dienstleistungen. Sie wird vom Endverbraucher getragen und von Unternehmen für den Staat eingezogen.",
"How do I calculate 5% VAT on an amount?":"Wie berechne ich 5 % MwSt. auf einen Betrag?",
"Multiply the amount by 0.05. Example: 100 × 0.05 = 5 tax. Total = 105.":"Multipliziere den Betrag mit 0,05. Beispiel: 100 × 0,05 = 5 Steuer. Gesamt = 105.",
"How do I extract VAT from a VAT-inclusive amount?":"Wie rechne ich die MwSt. aus einem Bruttobetrag heraus?",
"Divide the inclusive amount by (1 + tax rate). Example: 105 ÷ 1.05 = 100 (before tax). Tax = 5.":"Teile den Bruttobetrag durch (1 + Steuersatz). Beispiel: 105 ÷ 1,05 = 100 (netto). Steuer = 5.",
"Which goods are VAT-exempt in Oman?":"Welche Waren sind im Oman von der MwSt. befreit?",
"Some qualifying supplies may be zero-rated or exempt subject to Tax Authority conditions — for example, certain basic foodstuffs, qualifying healthcare/education services, residential rental, and certain financial services. Most goods and services remain subject to the standard 5% rate.":"Bestimmte begünstigte Leistungen können unter den Bedingungen der Steuerbehörde nullbesteuert oder befreit sein – etwa bestimmte Grundnahrungsmittel, begünstigte Gesundheits- und Bildungsleistungen, Wohnraumvermietung und bestimmte Finanzdienstleistungen. Die meisten Waren und Dienstleistungen unterliegen weiterhin dem Regelsatz von 5 %.",
"Why is Saudi Arabia's VAT rate 15% instead of 5%?":"Warum liegt die MwSt. in Saudi-Arabien bei 15 % statt 5 %?",
"Saudi Arabia raised its VAT from 5% to 15% in July 2020 due to fiscal pressures from COVID-19 and lower oil prices. Oman and UAE have maintained the 5% rate.":"Saudi-Arabien erhöhte die Mehrwertsteuer im Juli 2020 von 5 % auf 15 % – wegen des finanziellen Drucks durch COVID-19 und niedrigere Ölpreise. Oman und die VAE blieben bei 5 %.",
"When must a business register for VAT in Oman?":"Ab wann muss sich ein Unternehmen im Oman für die MwSt. registrieren?",
"Businesses must register when annual turnover exceeds OMR 38,500. Voluntary registration from OMR 19,250. Competent authority: Tax Authority taa.gov.om.":"Pflicht ist die Registrierung ab einem Jahresumsatz von über 38.500 OMR; freiwillig möglich ab 19.250 OMR. Zuständige Behörde: Steuerbehörde taa.gov.om.",
"When was VAT introduced in Oman?":"Wann wurde die Mehrwertsteuer im Oman eingeführt?",
"Oman implemented VAT at 5% in April 2021, making it the fourth GCC country to introduce VAT, after the UAE and Saudi Arabia (2018) and Bahrain (2019).":"Oman führte die Mehrwertsteuer im April 2021 mit 5 % ein und wurde damit das vierte GCC-Land mit Mehrwertsteuer – nach den VAE und Saudi-Arabien (2018) und Bahrain (2019).",
"Are exports zero-rated for VAT in Oman?":"Sind Exporte im Oman von der MwSt. befreit (Nullsatz)?",
"Exports from Oman are zero-rated (0% VAT). Exporters do not charge VAT to foreign buyers but can reclaim any input VAT paid locally.":"Exporte aus dem Oman unterliegen dem Nullsatz (0 % MwSt.). Exporteure berechnen ausländischen Käufern keine MwSt., können aber die im Inland gezahlte Vorsteuer zurückfordern.",
"How to calculate VAT on a restaurant bill in Oman?":"Wie berechne ich die MwSt. auf eine Restaurantrechnung im Oman?",
"Prepared food and restaurant meals are subject to 5% VAT in Oman. Example: bill OMR 20 → VAT = 20 × 0.05 = OMR 1 → total = OMR 21. Enter the amount in the calculator above and select Oman 5% for the instant result.":"Zubereitete Speisen und Restaurantessen unterliegen im Oman 5 % MwSt. Beispiel: Rechnung 20 OMR → MwSt. = 20 × 0,05 = 1 OMR → Gesamt = 21 OMR. Gib den Betrag oben im Rechner ein und wähle Oman 5 % für das sofortige Ergebnis.",
"Does VAT apply to salaries and wages in Oman?":"Fällt im Oman MwSt. auf Gehälter an?",

"Value Added Tax (VAT) was introduced across GCC countries at different times. The UAE and Saudi Arabia introduced 5% VAT in January 2018; Saudi Arabia raised its rate to 15% in July 2020. Oman introduced 5% VAT in April 2021. Bahrain introduced 5% in January 2019 (raised to 10% in 2022).":"Die Mehrwertsteuer wurde in den GCC-Staaten zu unterschiedlichen Zeitpunkten eingeführt. Die VAE und Saudi-Arabien führten im Januar 2018 eine MwSt. von 5 % ein; Saudi-Arabien erhöhte den Satz im Juli 2020 auf 15 %. Oman führte im April 2021 eine MwSt. von 5 % ein. Bahrain führte im Januar 2019 5 % ein (2022 auf 10 % erhöht).",

"Common zero-rated and exempt categories":"Häufige nullbesteuerte und befreite Kategorien",
"Certain qualifying food items, healthcare/education services, residential rent, and international exports may be zero-rated (0% VAT) or exempt in GCC countries, subject to specific conditions — these are not blanket category exemptions. Most goods and services remain subject to the standard rate. Always consult the local tax authority for definitive guidance on your specific goods or services.":"Bestimmte begünstigte Lebensmittel, Gesundheits- und Bildungsleistungen, Wohnraummieten und internationale Exporte können in den GCC-Staaten unter bestimmten Bedingungen dem Nullsatz (0 % MwSt.) unterliegen oder befreit sein – pauschale Befreiungen ganzer Kategorien sind das nicht. Die meisten Waren und Dienstleistungen unterliegen weiterhin dem Regelsatz. Wende dich für verbindliche Auskünfte zu deinen Waren oder Leistungen immer an die örtliche Steuerbehörde."}-->
