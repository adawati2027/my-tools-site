"How do I play the number guessing game?":"Wie spielt man das Zahlenraten?",
"The game picks a secret number within a range. You enter a guess and the game tells you whether the secret number is higher or lower. Keep guessing until you find it in as few tries as possible. Higher difficulty levels use larger number ranges.":"Das Spiel wählt eine geheime Zahl aus einem Bereich. Du gibst einen Tipp ein und erfährst, ob die geheime Zahl größer oder kleiner ist. Rate weiter, bis du sie mit möglichst wenigen Versuchen gefunden hast. Höhere Stufen verwenden größere Zahlenbereiche.",
"What are the difficulty levels in the number guessing game?":"Welche Schwierigkeitsstufen hat das Zahlenraten?",
"There are 6 levels: Easy (1–10), Medium (1–50), Hard (1–100), Expert (1–500), Master (1–1000), and Legendary (1–5000). Each level requires more strategic guessing to narrow down the answer.":"Es gibt 6 Stufen: Leicht (1–10), Mittel (1–50), Schwer (1–100), Experte (1–500), Meister (1–1000) und Legendär (1–5000). Jede Stufe verlangt mehr Strategie, um die Antwort einzugrenzen.",
"How to play Number Guess":"So spielst du Zahlenraten",

"The fastest strategy":"Die schnellste Strategie",

"Why it is good practice":"Warum es ein gutes Training ist",
