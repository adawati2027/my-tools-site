"How do I control the jump platformer game?":"Wie steuere ich das Jump-’n’-Run-Spiel?",
"Use Space bar or the up arrow key to jump on desktop. On mobile, tap the jump button on screen. Move left and right using arrow keys or on-screen buttons. Reach all platforms and collect stars to complete each level.":"Am Computer springst du mit der Leertaste oder der Pfeiltaste nach oben. Auf dem Handy tippst du auf die Sprungtaste am Bildschirm. Nach links und rechts bewegst du dich mit den Pfeiltasten oder den Bildschirmtasten. Erreiche alle Plattformen und sammle Sterne, um jedes Level zu schaffen.",
"Is the jump game suitable for young children?":"Ist das Sprungspiel für kleine Kinder geeignet?",
"Yes. The game is designed to be simple and safe for children. No violent content, no ads within the game, no in-app purchases. Works directly in the browser — no installation required.":"Ja. Das Spiel ist einfach und kindersicher gestaltet: keine Gewalt, keine Werbung im Spiel, keine In-App-Käufe. Es läuft direkt im Browser – ohne Installation.",
"How to play the Jump Game":"So spielst du das Sprungspiel",
"Jump from platform to platform, collect the stars and reach the end of each level without falling. Each new level adds wider gaps and trickier platforms.":"Springe von Plattform zu Plattform, sammle die Sterne und erreiche das Ende jedes Levels, ohne herunterzufallen. Jedes neue Level bringt größere Lücken und kniffligere Plattformen.",
"Tips for clearing levels":"Tipps, um die Level zu schaffen",
"Time your jump at the very edge of a platform for the longest distance. Collect stars on the way rather than going back for them, and pause for a moment before difficult gaps.":"Spring ganz vom Rand der Plattform ab, um am weitesten zu kommen. Sammle Sterne unterwegs, statt zurückzugehen, und halte vor schwierigen Lücken kurz inne.",
"Why it is good practice":"Warum es ein gutes Training ist",
"Platform games build timing, patience and spatial awareness. They are simple enough for children and still challenging on the higher levels.":"Jump-’n’-Run-Spiele fördern Timing, Geduld und räumliches Vorstellungsvermögen. Sie sind einfach genug für Kinder und bleiben auf höheren Levels eine Herausforderung."}-->
