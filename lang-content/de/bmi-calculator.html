"What is BMI (Body Mass Index)?":"Was ist der BMI (Body-Mass-Index)?",
"Body Mass Index (BMI) is a simple measurement used to estimate body fat based on weight and height. Devised by the statistician Adolphe Quetelet in the 19th century and adopted by the World Health Organization (WHO) for its weight classification, it is the most widely used tool globally for screening healthy weight.":"Der Body-Mass-Index (BMI) ist ein einfaches Maß, mit dem sich der Körperfettanteil anhand von Gewicht und Größe abschätzen lässt. Er wurde im 19. Jahrhundert vom Statistiker Adolphe Quetelet entwickelt und von der Weltgesundheitsorganisation (WHO) für ihre Gewichtsklassifikation übernommen; er ist weltweit das am häufigsten genutzte Instrument zur Einschätzung eines gesunden Gewichts.",
"BMI is calculated by dividing weight in kilograms by the square of height in meters. The result is classified into four categories: underweight, normal weight, overweight, and obese.":"Der BMI wird berechnet, indem man das Gewicht in Kilogramm durch das Quadrat der Körpergröße in Metern teilt. Das Ergebnis wird in vier Kategorien eingeteilt: Untergewicht, Normalgewicht, Übergewicht und Adipositas.",
"Note that BMI does not differentiate between fat and muscle, so it may not accurately reflect the situation of athletes, children, or the elderly. Use it as a general indicator, not a medical diagnosis.":"Beachte, dass der BMI nicht zwischen Fett und Muskeln unterscheidet und die Situation von Sportlern, Kindern oder älteren Menschen daher ungenau abbilden kann. Nutze ihn als allgemeinen Richtwert, nicht als medizinische Diagnose.",
"How is BMI calculated?":"Wie wird der BMI berechnet?",
"The mathematical formula for calculating BMI is:":"Die mathematische Formel für den BMI lautet:",
"BMI = Weight (kg) ÷ Height² (m)":"BMI = Gewicht (kg) ÷ Größe² (m)",
"Example: A person weighing 75 kg and 175 cm tall (1.75 m):":"Beispiel: Eine Person mit 75 kg und 175 cm Größe (1,75 m):",
"BMI = 75 ÷ (1.75 × 1.75) = 75 ÷ 3.0625 ≈ 24.5":"BMI = 75 ÷ (1,75 × 1,75) = 75 ÷ 3,0625 ≈ 24,5",
"The result 24.5 falls in the normal range (18.5 – 24.9). If using pounds and inches: BMI = (weight in lbs ÷ height in inches²) × 703":"Das Ergebnis 24,5 liegt im Normalbereich (18,5 – 24,9). Mit Pfund und Zoll: BMI = (Gewicht in lb ÷ Größe in Zoll²) × 703",
"Frequently Asked Questions about BMI":"Häufige Fragen zum BMI",
"Is BMI accurate for everyone?":"Ist der BMI für alle genau?",
"BMI is a useful general indicator for most adults, but may be less accurate for athletes (muscle weighs more than fat), pregnant women, children, and older adults. For a more accurate assessment, consult a doctor and consider additional measurements like waist circumference or body fat percentage.":"Der BMI ist für die meisten Erwachsenen ein nützlicher Richtwert, kann aber bei Sportlern (Muskeln wiegen mehr als Fett), Schwangeren, Kindern und älteren Menschen ungenauer sein. Für eine genauere Bewertung wende dich an einen Arzt und ziehe weitere Messungen wie Taillenumfang oder Körperfettanteil hinzu.",
"What is the ideal BMI for adults?":"Was ist der ideale BMI für Erwachsene?",
"According to WHO, a BMI between 18.5 and 24.9 is considered ideal for adults. Children and adolescents use separate growth charts that account for age and sex. Some research suggests the optimal range may vary by ethnicity and body composition.":"Laut WHO gilt ein BMI zwischen 18,5 und 24,9 bei Erwachsenen als ideal. Für Kinder und Jugendliche gibt es eigene Wachstumskurven, die Alter und Geschlecht berücksichtigen. Manche Studien deuten darauf hin, dass der optimale Bereich je nach Herkunft und Körperzusammensetzung variieren kann.",
"How do I calculate BMI in pounds and inches?":"Wie berechne ich den BMI in Pfund und Zoll?",
"If your weight is in pounds and height in inches, use: BMI = (weight in lbs ÷ height in inches²) × 703. Quick conversion: 1 kg = 2.205 lbs, 1 inch = 2.54 cm. This calculator uses metric units (kg and cm) only.":"Wenn dein Gewicht in Pfund und deine Größe in Zoll angegeben ist: BMI = (Gewicht in lb ÷ Größe in Zoll²) × 703. Schnelle Umrechnung: 1 kg = 2,205 lb, 1 Zoll = 2,54 cm. Dieser Rechner verwendet nur metrische Einheiten (kg und cm).",
"Does BMI differ between men and women?":"Unterscheidet sich der BMI zwischen Männern und Frauen?",
"The BMI formula is the same for both sexes, but body composition differs. Women typically have a higher fat percentage than men at the same BMI. Some doctors recommend supplementing BMI with waist circumference or waist-to-hip ratio for a more accurate assessment.":"Die BMI-Formel ist für beide Geschlechter gleich, die Körperzusammensetzung aber nicht. Bei gleichem BMI haben Frauen in der Regel einen höheren Fettanteil als Männer. Manche Ärzte empfehlen, den BMI um Taillenumfang oder Taille-Hüft-Verhältnis zu ergänzen.",
"What are the health risks of high or low BMI?":"Welche Gesundheitsrisiken hat ein hoher oder niedriger BMI?",
"A high BMI (≥30) is linked to increased risk of type 2 diabetes, heart disease, high blood pressure, and some cancers. A low BMI (&lt;18.5) is associated with weakened immunity, osteoporosis, and malnutrition. In both cases, consult a doctor.":"Ein hoher BMI (≥ 30) ist mit einem erhöhten Risiko für Typ-2-Diabetes, Herzerkrankungen, Bluthochdruck und einige Krebsarten verbunden. Ein niedriger BMI (&lt; 18,5) geht mit geschwächter Immunabwehr, Osteoporose und Mangelernährung einher. In beiden Fällen solltest du ärztlichen Rat einholen.",
"How is BMI calculated — with a worked example?":"Wie wird der BMI berechnet — mit Rechenbeispiel?",
"BMI formula: weight (kg) ÷ height² (m). Example: a person weighing 75 kg and 175 cm tall: 75 ÷ (1.75 × 1.75) = 75 ÷ 3.0625 ≈ 24.5. This falls in the Normal range (18.5–24.9) per WHO standards.":"BMI-Formel: Gewicht (kg) ÷ Größe² (m). Beispiel: eine Person mit 75 kg und 175 cm: 75 ÷ (1,75 × 1,75) = 75 ÷ 3,0625 ≈ 24,5. Das liegt nach WHO-Standard im Normalbereich (18,5–24,9).",
"What is the ideal weight for my height?":"Was ist das Idealgewicht für meine Größe?",
"Ideal weight = normal BMI range (18.5–24.9) × height² in metres. Example for 170 cm (1.70 m): lower = 18.5 × (1.70²) ≈ 53.5 kg, upper = 24.9 × (1.70²) ≈ 71.9 kg. Any weight between 53.5 and 71.9 kg is ideal for this height.":"Idealgewicht = normaler BMI-Bereich (18,5–24,9) × Größe² in Metern. Beispiel für 170 cm (1,70 m): unten = 18,5 × (1,70²) ≈ 53,5 kg, oben = 24,9 × (1,70²) ≈ 71,9 kg. Jedes Gewicht zwischen 53,5 und 71,9 kg ist für diese Größe ideal.",
"Is BMI suitable for children?":"Ist der BMI für Kinder geeignet?",
"No. Children and adolescents under 18 use specialised growth charts (BMI-for-age) that account for sex and age. Adult BMI values (18.5–24.9 normal) do not apply to children. Consult a paediatrician for an accurate assessment.":"Nein. Für Kinder und Jugendliche unter 18 gibt es spezielle Wachstumskurven (BMI für das Alter), die Geschlecht und Alter berücksichtigen. Die Erwachsenenwerte (18,5–24,9 normal) gelten nicht für Kinder. Wende dich für eine genaue Einschätzung an eine Kinderärztin oder einen Kinderarzt.",

"BMI does not measure body fat directly. A muscular athlete may score in the \"overweight\" range despite low body fat. Older adults may have a normal BMI but carry excess fat. Always combine BMI with other health markers and consult a doctor for a complete assessment.":"Der BMI misst das Körperfett nicht direkt. Ein muskulöser Sportler kann trotz wenig Körperfett im Bereich „Übergewicht“ landen. Ältere Menschen können einen normalen BMI haben und trotzdem zu viel Fett. Kombiniere den BMI immer mit anderen Gesundheitswerten und lass dich für eine vollständige Bewertung ärztlich beraten.",
