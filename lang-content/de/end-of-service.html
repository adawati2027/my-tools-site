"What is the difference between the new and old system?":"Was ist der Unterschied zwischen neuem und altem System?",
"Old system: 15 days for years 1–3, 20 days for years 3–5, 30 days after 5 years (calculated from daily rate = basic÷26). New system (Article 61): minimum is one full month's salary per year with fractions pro-rated. The higher amount applies per the employment contract and applicable system.":"Altes System: 15 Tage für die Jahre 1–3, 20 Tage für die Jahre 3–5, 30 Tage nach 5 Jahren (berechnet vom Tagessatz = Grundgehalt ÷ 26). Neues System (Artikel 61): mindestens ein volles Monatsgehalt pro Jahr, Bruchteile anteilig. Es gilt der höhere Betrag gemäß Arbeitsvertrag und geltendem System.",
"Am I entitled to gratuity if I worked less than one year?":"Habe ich Anspruch auf Abfindung, wenn ich weniger als ein Jahr gearbeitet habe?",
"Under the updated Omani Labor Law (Article 61), fractions of a year are calculated proportionally. An employee who completed 6 months is entitled to 0.5 months' salary.":"Nach dem aktualisierten omanischen Arbeitsgesetz (Artikel 61) werden Bruchteile eines Jahres anteilig berechnet. Wer 6 Monate gearbeitet hat, hat Anspruch auf 0,5 Monatsgehälter.",
"Is an expatriate entitled to end of service gratuity?":"Hat ein Expat Anspruch auf eine Abfindung bei Dienstende?",
"Yes. Oman's Labor Law applies to both Omani nationals and expatriates. Expatriate employees are entitled to end of service gratuity under the stated provisions, and also have an SPF savings program funded by the employer.":"Ja. Das omanische Arbeitsgesetz gilt für omanische Staatsangehörige und Expats. Ausländische Arbeitnehmer haben nach den genannten Bestimmungen Anspruch auf eine Abfindung und verfügen außerdem über ein vom Arbeitgeber finanziertes SPF-Sparprogramm.",
"Are allowances included in the gratuity calculation?":"Werden Zulagen in die Abfindung einbezogen?",
"Under labor law, gratuity is calculated on basic salary only. Some companies include allowances in the individual contract and use them in the calculation — check your contract to confirm.":"Nach dem Arbeitsgesetz wird die Abfindung nur auf das Grundgehalt berechnet. Manche Unternehmen nehmen Zulagen in den Einzelvertrag auf und beziehen sie in die Berechnung ein – prüfe deinen Vertrag.",
"What is the difference in end of service between Omani nationals and expatriates?":"Was ist der Unterschied bei der Abfindung zwischen Omanis und Expats?",
"For Omanis: end of service is managed through the SPF savings program with employer contributions of 11.5% monthly. For expatriates: calculated under Article 61 (minimum one month's salary per year of service).":"Für Omanis wird das Dienstende über das SPF-Sparprogramm mit monatlichen Arbeitgeberbeiträgen von 11,5 % abgewickelt. Für Expats wird nach Artikel 61 berechnet (mindestens ein Monatsgehalt pro Dienstjahr).",
"When must end of service gratuity be paid?":"Wann muss die Abfindung gezahlt werden?",
"Under Article 91 of Oman's Labor Law, the employer must pay the employee's wages and all entitlements upon termination of employment. If the employee leaves voluntarily, entitlements must be paid within 7 days of the leaving date. In case of delay, the employee can file a complaint with the Ministry of Labour.":"Nach Artikel 91 des omanischen Arbeitsgesetzes muss der Arbeitgeber dem Arbeitnehmer bei Ende des Arbeitsverhältnisses den Lohn und alle Ansprüche zahlen. Kündigt der Arbeitnehmer selbst, sind die Ansprüche innerhalb von 7 Tagen nach dem Austrittsdatum zu zahlen. Bei Verzug kann der Arbeitnehmer beim Arbeitsministerium Beschwerde einlegen.",
"Is gratuity paid in case of resignation?":"Wird die Abfindung auch bei eigener Kündigung gezahlt?",
"Entitlements differ based on the reason for termination, the applicable legal system, and the employment contract. Specific circumstances may affect the entitlement. Check your contract and consult a specialist lawyer to confirm.":"Die Ansprüche hängen vom Beendigungsgrund, dem geltenden Rechtssystem und dem Arbeitsvertrag ab. Besondere Umstände können den Anspruch beeinflussen. Prüfe deinen Vertrag und lass dich von einem Fachanwalt beraten.",
"What is the minimum service period to claim gratuity?":"Wie lange muss man mindestens arbeiten, um Abfindung zu verlangen?",
"End of service gratuity is calculated per the provisions applicable to the employee, their contract, and the prevailing legal system. Do not use the 3-year rule as a general rule; entitlements may differ based on the termination reason and applicable system.":"Die Abfindung wird nach den für den Arbeitnehmer, seinen Vertrag und das geltende Rechtssystem maßgeblichen Bestimmungen berechnet. Wende die 3-Jahres-Regel nicht pauschal an; die Ansprüche können je nach Beendigungsgrund und System abweichen.",
"Am I entitled to full gratuity if I resign?":"Habe ich bei eigener Kündigung Anspruch auf die volle Abfindung?",
"Under the updated Article 61, gratuity is calculated proportionally for each year of service whether termination is employee- or employer-initiated. In case of disciplinary dismissal under Article 40, gratuity may be forfeited in whole or in part. Consult a specialist lawyer for your specific situation.":"Nach dem aktualisierten Artikel 61 wird die Abfindung für jedes Dienstjahr anteilig berechnet – unabhängig davon, ob Arbeitnehmer oder Arbeitgeber kündigt. Bei einer Entlassung aus disziplinarischen Gründen nach Artikel 40 kann die Abfindung ganz oder teilweise entfallen. Lass dich zu deinem konkreten Fall von einem Fachanwalt beraten.",
