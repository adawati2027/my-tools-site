"What is the difference between basic and gross salary?":"Was ist der Unterschied zwischen Grund- und Bruttogehalt?",
"Basic salary is the fixed amount specified in the employment contract. Gross = Basic + all allowances (housing, transport, etc.).":"Das Grundgehalt ist der im Arbeitsvertrag festgelegte feste Betrag. Brutto = Grundgehalt + alle Zulagen (Wohnen, Fahrtkosten usw.).",
"Is SPF deducted from allowances?":"Wird der SPF auch von Zulagen abgezogen?",
"SPF is calculated on the contributory wage per SPF rules (cap OMR 3,000 for the basic branch) — this calculator uses basic salary as a simplified input; actual amounts may differ.":"Der SPF wird auf das beitragspflichtige Entgelt nach den SPF-Regeln berechnet (Obergrenze 3.000 OMR im Grundzweig) – dieser Rechner nutzt vereinfacht das Grundgehalt; tatsächliche Beträge können abweichen.",
"What is the minimum wage in Oman?":"Wie hoch ist der Mindestlohn im Oman?",
"The minimum wage for Omani nationals is OMR 325 per month (per the latest decree). Check the Ministry of Labour for official updates.":"Der Mindestlohn für omanische Staatsangehörige beträgt 325 OMR pro Monat (laut neuestem Erlass). Aktuelle offizielle Angaben gibt es beim Arbeitsministerium.",
"How do I estimate my SPF deduction?":"Wie schätze ich meinen SPF-Abzug?",
"This calculator uses basic salary for a simplified 8% estimate. The official calculation depends on the contributory wage per SPF rules. Estimate: deduction ≈ Basic × 8% (cap OMR 3,000 for basic branch).":"Dieser Rechner nutzt das Grundgehalt für eine vereinfachte Schätzung mit 8 %. Die offizielle Berechnung hängt vom beitragspflichtigen Entgelt nach den SPF-Regeln ab. Schätzung: Abzug ≈ Grundgehalt × 8 % (Obergrenze 3.000 OMR im Grundzweig).",
"Does SPF deduction apply to expatriates?":"Gilt der SPF-Abzug auch für Expats?",
"No, the 8% deduction does not apply to expatriate employees. Expatriates have a separate savings system funded by the employer. Expat net salary = gross with no deductions.":"Nein, der 8-%-Abzug gilt nicht für ausländische Arbeitnehmer. Expats haben ein eigenes, vom Arbeitgeber finanziertes Sparsystem. Netto für Expats = brutto ohne Abzüge.",
"What does the SPF social protection system cover?":"Was deckt das SPF-Sozialschutzsystem ab?",
"SPF covers several insurance branches including: old age, disability and death; employment security; work injuries and occupational diseases; sick and emergency leave; and maternity leave. For updated details visit spf.gov.om.":"Der SPF umfasst mehrere Versicherungszweige, darunter: Alter, Invalidität und Tod; Arbeitsplatzsicherheit; Arbeitsunfälle und Berufskrankheiten; Kranken- und Notfallurlaub sowie Mutterschaftsurlaub. Aktuelle Details unter spf.gov.om.",
"Is there income tax on salaries in Oman?":"Gibt es im Oman Einkommensteuer auf Gehälter?",
"As of 2026, no personal income tax applies to salaries in Oman. However, the Personal Income Tax (PIT) law was issued in 2025 and will begin applying from 2028 under specific conditions. Currently, the only deduction for Omani employees is SPF at 8%.":"Stand 2026 fällt im Oman keine persönliche Einkommensteuer auf Gehälter an. Das Gesetz zur persönlichen Einkommensteuer (PIT) wurde jedoch 2025 erlassen und gilt unter bestimmten Bedingungen ab 2028. Derzeit ist der einzige Abzug für omanische Arbeitnehmer der SPF-Beitrag von 8 %.",
"What is the difference between PASI and SPF in Oman?":"Was ist der Unterschied zwischen PASI und SPF im Oman?",
"PASI (Public Authority for Social Insurance) was the old name of the supervising body. It was merged into the new Social Protection Fund (SPF) which now consolidates all social protection branches in Oman.":"PASI (Public Authority for Social Insurance) war der frühere Name der Aufsichtsbehörde. Sie wurde in den neuen Sozialschutzfonds (SPF) eingegliedert, der nun alle Zweige des Sozialschutzes im Oman bündelt.",
"What is the employer SPF contribution rate in Oman?":"Wie hoch ist der SPF-Arbeitgeberbeitrag im Oman?",
"For Omani employees, the employer contributes a combined 14.5% of the contributory wage across active SPF branches (11% for old age/disability/death, with the remaining ~3.5% spread across work injuries, employment security, and maternity/sick leave branches). The employee contributes 8% (7.5% old age/disability/death + 0.5% employment security). Combined total = 22.5% of contributory wage. Rates can change — verify current figures at spf.gov.om.":"Für omanische Arbeitnehmer zahlt der Arbeitgeber insgesamt 14,5 % des beitragspflichtigen Entgelts über die aktiven SPF-Zweige (11 % für Alter/Invalidität/Tod, die übrigen ~3,5 % verteilt auf Arbeitsunfälle, Arbeitsplatzsicherheit sowie Mutterschafts- und Krankenurlaub). Der Arbeitnehmer zahlt 8 % (7,5 % Alter/Invalidität/Tod + 0,5 % Arbeitsplatzsicherheit). Zusammen = 22,5 % des beitragspflichtigen Entgelts. Die Sätze können sich ändern – prüfe aktuelle Zahlen unter spf.gov.om.",
"How is overtime calculated in Oman?":"Wie werden Überstunden im Oman berechnet?",
"Under the Oman Labour Law, overtime on regular weekdays is paid at 125% of the normal hourly rate. Work on weekly rest days or public holidays is paid at 150%. The overtime base is calculated from basic salary only.":"Nach dem omanischen Arbeitsgesetz werden Überstunden an normalen Werktagen mit 125 % des normalen Stundenlohns vergütet. Arbeit an wöchentlichen Ruhetagen oder Feiertagen wird mit 150 % vergütet. Grundlage für Überstunden ist nur das Grundgehalt.",

"Oman's Social Protection Fund (SPF) replaced the previous PASI (Public Authority for Social Insurance) system. Omani national employees contribute 8% of their gross basic salary; employers contribute an additional amount. Expatriate employees are not enrolled in SPF and receive no deduction.":"Der omanische Sozialschutzfonds (SPF) hat das frühere PASI-System (Public Authority for Social Insurance) abgelöst. Omanische Arbeitnehmer zahlen 8 % ihres Bruttogrundgehalts; der Arbeitgeber zahlt einen zusätzlichen Beitrag. Ausländische Arbeitnehmer sind nicht im SPF versichert und haben keinen Abzug.",

"Comparing Job Offers — Why Gross Salary Alone Is Misleading":"Jobangebote vergleichen — warum das Bruttogehalt allein täuscht",
"A job offer's headline salary figure is often just the gross basic — comparing two offers by that number alone can be misleading. Before accepting an offer, break it down into its real components:":"Die hervorgehobene Gehaltszahl in einem Jobangebot ist oft nur das Bruttogrundgehalt – zwei Angebote allein danach zu vergleichen, kann in die Irre führen. Zerlege ein Angebot vor der Annahme in seine tatsächlichen Bestandteile:",

"When comparing two offers, run both through this calculator using their actual basic salary (not the combined gross figure some offer letters lead with) to see a realistic net-pay comparison, and separately check how each structures its basic-vs-allowance split — it affects both your monthly net and your eventual end-of-service benefit.":"Rechne beim Vergleich zweier Angebote beide mit diesem Rechner und ihrem tatsächlichen Grundgehalt durch (nicht mit dem zusammengefassten Brutto, das manche Angebotsschreiben hervorheben), um einen realistischen Netto-Vergleich zu erhalten, und prüfe separat, wie jedes Angebot Grundgehalt und Zulagen aufteilt – das beeinflusst sowohl dein monatliches Netto als auch deine spätere Abfindung."}-->
