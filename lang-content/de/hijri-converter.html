"❓ Frequently Asked Questions":"❓ Häufige Fragen",
"What is the difference between Hijri and Gregorian calendars?":"Was ist der Unterschied zwischen dem Hidschri- und dem gregorianischen Kalender?",
"The Hijri calendar is lunar (based on moon cycles) with 354-355 days per year. The Gregorian calendar is solar with 365-366 days. This is why the Hijri year advances about 11 days each Gregorian year.":"Der Hidschri-Kalender ist ein Mondkalender (nach den Mondphasen) mit 354–355 Tagen pro Jahr. Der gregorianische Kalender ist ein Sonnenkalender mit 365–366 Tagen. Deshalb rückt das Hidschri-Jahr jedes gregorianische Jahr um etwa 11 Tage vor.",
"When did the Hijri calendar begin?":"Wann begann der Hidschri-Kalender?",
"The Hijri calendar began from the Prophet Muhammad's ﷺ migration (Hijra) from Mecca to Medina, corresponding to July 16, 622 CE.":"Der Hidschri-Kalender beginnt mit der Auswanderung (Hidschra) des Propheten Muhammad ﷺ von Mekka nach Medina, was dem 16. Juli 622 n. Chr. entspricht.",
"Why might the Hijri date differ by a day?":"Warum kann das Hidschri-Datum um einen Tag abweichen?",
"Official determination in many countries depends on naked-eye moon sighting, which can cause a one-day difference between countries. This tool uses a tabular Hijri calendar algorithm, which may differ by 1–2 days from the observed calendar.":"In vielen Ländern hängt die offizielle Festlegung von der Mondsichtung mit bloßem Auge ab, was zu einem Tag Unterschied zwischen Ländern führen kann. Dieses Tool verwendet einen tabellarischen Kalenderalgorithmus, der 1–2 Tage vom beobachteten Kalender abweichen kann.",
"How do I find today's Hijri date?":"Wie finde ich das heutige Hidschri-Datum?",
"The tool displays the current Hijri date automatically in the \"Today's Hijri Date\" panel as soon as you open the page. No input required.":"Das Tool zeigt das aktuelle Hidschri-Datum automatisch im Feld „Heutiges Hidschri-Datum“ an, sobald du die Seite öffnest. Keine Eingabe nötig.",
"What are the Hijri months in order?":"Wie lauten die Hidschri-Monate der Reihe nach?",
"Muharram, Safar, Rabi al-Awwal, Rabi al-Thani, Jumada al-Awwal, Jumada al-Thani, Rajab, Sha'ban, Ramadan, Shawwal, Dhu al-Qi'dah, Dhu al-Hijjah — 12 lunar months in each Hijri year.":"Muharram, Safar, Rabi al-Awwal, Rabi al-Thani, Dschumada al-Ula, Dschumada ath-Thaniya, Radschab, Schaban, Ramadan, Schawwal, Dhu l-Qa'da, Dhu l-Hiddscha – 12 Mondmonate in jedem Hidschri-Jahr.",
"How do I accurately convert a Gregorian date to Hijri?":"Wie rechne ich ein gregorianisches Datum genau in Hidschri um?",
"Use the first tab \"Gregorian → Hijri\" and enter the Gregorian date. The tool uses a tabular Hijri calendar algorithm. Note that the official date in some countries may differ by 1–2 days due to local moon sighting.":"Nutze den ersten Tab „Gregorianisch → Hidschri“ und gib das gregorianische Datum ein. Das Tool verwendet einen tabellarischen Hidschri-Algorithmus. Beachte, dass das offizielle Datum in manchen Ländern wegen lokaler Mondsichtung um 1–2 Tage abweichen kann.",
"What are the sacred (Haram) Hijri months?":"Welches sind die heiligen (Haram-)Monate im Hidschri-Kalender?",
"The four sacred months are: Dhu al-Qi'dah, Dhu al-Hijjah, Muharram (three consecutive), and Rajab (separate). They were called sacred because fighting was prohibited in them, a prohibition confirmed by Islam.":"Die vier heiligen Monate sind Dhu l-Qa'da, Dhu l-Hiddscha, Muharram (drei aufeinanderfolgende) und Radschab (einzeln). Sie heißen heilig, weil Kämpfe in ihnen verboten waren – ein Verbot, das der Islam bestätigte.",
"Does the tool support dates before 1900 CE?":"Unterstützt das Tool Daten vor 1900?",
"Yes, the Hijri year field supports the range 1300-1600 AH (approximately 1882-2174 CE). For dates outside this range, a specialized source is recommended for precise conversion.":"Ja, das Feld für das Hidschri-Jahr umfasst den Bereich 1300–1600 AH (etwa 1882–2174 n. Chr.). Für Daten außerhalb dieses Bereichs empfiehlt sich eine spezialisierte Quelle für eine genaue Umrechnung.",

"The Hijri calendar is a":"Der Hidschri-Kalender ist ein",
"lunar calendar":"Mondkalender",
"with 12 months of 29 or 30 days each, totalling 354-355 days per year — about 11 days shorter than the Gregorian year. This means Islamic dates shift earlier through the Gregorian calendar by approximately 11 days each year. The year 1 Hijri corresponds to the Prophet Muhammad's migration (Hijra) from Mecca to Medina in 622 CE.":"mit 12 Monaten zu je 29 oder 30 Tagen, insgesamt 354–355 Tage pro Jahr – etwa 11 Tage kürzer als das gregorianische Jahr. Islamische Daten verschieben sich daher jedes Jahr um rund 11 Tage nach vorn im gregorianischen Kalender. Das Jahr 1 der Hidschra entspricht der Auswanderung des Propheten Muhammad von Mekka nach Medina im Jahr 622 n. Chr.",
"The 12 Hijri months":"Die 12 Hidschri-Monate",
"Muharram, Safar, Rabi' al-Awwal, Rabi' al-Thani, Jumada al-Awwal, Jumada al-Thani, Rajab, Sha'ban, Ramadan, Shawwal, Dhu al-Qi'dah, Dhu al-Hijjah. Ramadan (fasting) and Dhu al-Hijjah (Hajj season) are the two most significant religious months.":"Muharram, Safar, Rabi' al-Awwal, Rabi' al-Thani, Dschumada al-Ula, Dschumada ath-Thaniya, Radschab, Schaban, Ramadan, Schawwal, Dhu l-Qa'da, Dhu l-Hiddscha. Ramadan (Fastenmonat) und Dhu l-Hiddscha (Zeit der Hadsch) sind die beiden wichtigsten religiösen Monate.",
"Tabular vs. observed Hijri dates":"Tabellarische vs. beobachtete Hidschri-Daten",
"Some countries determine the start of Hijri months by physical moon sighting (Oman, Saudi Arabia, UAE), which can vary by one day from calculated dates. This converter uses a tabular Hijri calendar algorithm — a standard mathematical approximation accurate to within 1–2 days of the observed calendar.":"Manche Länder legen den Beginn der Hidschri-Monate durch tatsächliche Mondsichtung fest (Oman, Saudi-Arabien, VAE), was um einen Tag von berechneten Daten abweichen kann. Dieser Umrechner nutzt einen tabellarischen Hidschri-Algorithmus – eine übliche mathematische Näherung, die auf 1–2 Tage genau mit dem beobachteten Kalender übereinstimmt.",
