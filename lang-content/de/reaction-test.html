"What is a good reaction time?":"Was ist eine gute Reaktionszeit?",
"The average human visual reaction time is around 200-250 milliseconds. Below 200ms is considered fast (top 10%). Elite athletes and gamers typically score 150-180ms. Reaction time naturally increases (slows) with age.":"Die durchschnittliche visuelle Reaktionszeit des Menschen liegt bei etwa 200–250 Millisekunden. Unter 200 ms gilt als schnell (die besten 10 %). Spitzensportler und Gamer erreichen meist 150–180 ms. Mit zunehmendem Alter wird die Reaktionszeit natürlicherweise länger (langsamer).",
"Can I improve my reaction time with practice?":"Kann ich meine Reaktionszeit durch Übung verbessern?",
"Regular practice can shave 10-20ms from your baseline by reducing anticipation errors. True neural reaction time has a biological floor of around 100-120ms — no amount of practice can go below that limit.":"Regelmäßiges Training kann 10–20 ms von deinem Ausgangswert abziehen, weil weniger Vorwegnahme-Fehler passieren. Die echte neuronale Reaktionszeit hat eine biologische Untergrenze von etwa 100–120 ms – darunter kommt man auch mit viel Übung nicht.",
"How the Reaction Test works":"So funktioniert der Reaktionstest",
"Wait for the screen to change colour, then tap or click as fast as you can. The test measures the time between the change and your response in milliseconds. Clicking too early counts as a false start.":"Warte, bis der Bildschirm die Farbe wechselt, und tippe oder klicke dann so schnell wie möglich. Der Test misst die Zeit zwischen dem Wechsel und deiner Reaktion in Millisekunden. Zu frühes Klicken zählt als Fehlstart.",
"How to get a fair result":"So erhältst du ein faires Ergebnis",
"Take several attempts and look at your average rather than a single best try. Use the same device each time, sit comfortably and keep your finger resting on the button or screen.":"Mach mehrere Versuche und achte auf den Durchschnitt statt auf einen einzelnen Bestwert. Nutze jedes Mal dasselbe Gerät, sitz bequem und lass den Finger auf der Taste oder dem Bildschirm ruhen.",
"What affects reaction time":"Was die Reaktionszeit beeinflusst",
"Sleep, tiredness, caffeine, age and distractions all change reaction time. Measuring it on different days is a simple way to see how alert you are.":"Schlaf, Müdigkeit, Koffein, Alter und Ablenkung verändern die Reaktionszeit. Wer sie an verschiedenen Tagen misst, sieht ganz einfach, wie wach er ist."}-->
