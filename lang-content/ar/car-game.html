"How do I control the car in the dodging game?":"كيف أتحكم بالسيارة في لعبة المراوغة؟",
"Use the left and right arrow keys on desktop to steer. On mobile, use the on-screen touch buttons. Avoid colliding with oncoming cars. The game speed increases over time — how long can you survive?":"على الكمبيوتر استخدم السهمين الأيمن والأيسر للتوجيه، وعلى الجوال استخدم أزرار اللمس على الشاشة. تجنّب الاصطدام بالسيارات القادمة. تزداد سرعة اللعبة مع الوقت — فكم ستصمد؟",
"Does the car game work on mobile phones?":"هل تعمل لعبة السيارات على الجوال؟",
"Yes. The game includes on-screen touch buttons for mobile and tablet play. No download or app installation is needed — it runs entirely in your browser.":"نعم. تتضمن اللعبة أزرار لمس على الشاشة للجوال والتابلت، ولا تحتاج إلى تنزيل أو تثبيت أي تطبيق — تعمل بالكامل داخل المتصفح.",
"How to play Car Race":"طريقة لعب سباق السيارات",
"Steer your car left and right to dodge the traffic coming toward you. The longer you survive, the faster the road scrolls and the more points you score — so the game gets harder the better you play.":"وجّه سيارتك يميناً ويساراً لتتفادى السيارات القادمة نحوك. كلما صمدت أطول ازدادت سرعة الطريق وجمعت نقاطاً أكثر — فتزداد اللعبة صعوبة كلما أتقنتها.",
"Tips for a higher score":"نصائح لنتيجة أعلى",
