"Is the QR code suitable for printing?":"هل رمز QR مناسب للطباعة؟",
"Yes — the generated image is 220×220 pixels, suitable for digital displays and small print. For large poster printing, SVG tools are recommended for better quality.":"نعم — الصورة الناتجة بحجم 220×220 بكسل، وتناسب الشاشات والطباعة الصغيرة. أما للملصقات الكبيرة فيُنصح بأدوات SVG للحصول على جودة أفضل.",
"Do I need internet to scan a QR code?":"هل أحتاج إلى إنترنت لمسح رمز QR؟",
"Scanning the code with your camera does not need internet. But if the code contains a web link, you will need a connection to open it.":"مسح الرمز بالكاميرا لا يحتاج إنترنت، لكن إذا كان الرمز يحتوي على رابط موقع فستحتاج اتصالاً لفتحه.",
"How much information can one QR code hold?":"كم من المعلومات يتسع له رمز QR واحد؟",
"The maximum is approximately 4,296 alphanumeric characters. Less text means a clearer code that is easier to scan — short links are recommended.":"الحد الأقصى نحو 4,296 حرفاً ورقماً. وكلما قلّ النص كان الرمز أوضح وأسهل في المسح — لذا يُنصح بالروابط القصيرة.",
"Can a QR code expire?":"هل يمكن أن تنتهي صلاحية رمز QR؟",
"A static QR code never expires. But if it links to a web URL that expires or changes, the link will stop working. The code itself remains valid forever.":"رمز QR الثابت لا تنتهي صلاحيته أبداً. لكن إذا كان يشير إلى رابط ينتهي أو يتغير فسيتوقف الرابط عن العمل، بينما يبقى الرمز نفسه صالحاً دائماً.",
"How do I link a QR code to a business card?":"كيف أربط رمز QR ببطاقة العمل؟",
"Create a QR code with your LinkedIn page link, website or WhatsApp number in wa.me/+9685XXXXXXX format, then save and print it on your business card.":"أنشئ رمزاً يحتوي رابط صفحتك على LinkedIn أو موقعك أو رقم واتساب بصيغة wa.me/+9685XXXXXXX، ثم احفظه واطبعه على بطاقتك.",
"What is the difference between a QR code and a barcode?":"ما الفرق بين رمز QR والباركود؟",
"A barcode is one-dimensional and holds only ~20 digits. A QR code is two-dimensional and holds thousands of characters. QR codes scan faster and work even when partially damaged.":"الباركود أحادي البُعد ويتسع لنحو 20 رقماً فقط، أما رمز QR فثنائي البُعد ويتسع لآلاف الأحرف. ويُمسح رمز QR أسرع ويعمل حتى لو تضرر جزء منه.",
"Can I add a logo inside a QR code?":"هل يمكنني إضافة شعار داخل رمز QR؟",
"This tool generates codes without a logo. To add a logo, try QR Code Monkey or Canva — but a logo occupies part of the code and may reduce scan reliability.":"هذه الأداة تُنشئ رموزاً بدون شعار. لإضافة شعار جرّب QR Code Monkey أو Canva — لكن الشعار يغطي جزءاً من الرمز وقد يقلل من سهولة مسحه.",
"What is the best size for printing a QR code?":"ما أفضل حجم لطباعة رمز QR؟",

"QR Code Generator — Uses and Best Practices":"مولّد رمز QR — استخدامات ونصائح",
"A QR (Quick Response) code is a 2D barcode that smartphones can scan with their camera. It can encode a URL, plain text, an email address, a phone number or WiFi credentials. This generator creates QR codes entirely in your browser — no uploads, no account required.":"رمز QR (الاستجابة السريعة) باركود ثنائي البُعد تمسحه الهواتف الذكية بالكاميرا. يمكن أن يحتوي على رابط أو نص أو بريد إلكتروني أو رقم هاتف أو بيانات شبكة واي فاي. يُنشئ هذا المولّد الرموز بالكامل داخل متصفحك — دون رفع ملفات ودون حساب.",

"QR code size and scanning distance":"حجم رمز QR ومسافة المسح",
"For print use, a QR code should be at least 2 cm × 2 cm (roughly 0.8 × 0.8 inches). Scanning distance is approximately 10× the code size — a 3 cm code can be scanned from 30 cm away. Shorter URLs produce simpler codes that scan faster and more reliably.":"للطباعة يجب ألا يقل حجم رمز QR عن 2 × 2 سم. ومسافة المسح نحو 10 أضعاف حجم الرمز — فالرمز بحجم 3 سم يُمسح من مسافة 30 سم. والروابط الأقصر تنتج رموزاً أبسط تُمسح أسرع وبموثوقية أعلى."}-->
