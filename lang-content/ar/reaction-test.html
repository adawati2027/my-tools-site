"What is a good reaction time?":"ما هو زمن رد الفعل الجيد؟",
"The average human visual reaction time is around 200-250 milliseconds. Below 200ms is considered fast (top 10%). Elite athletes and gamers typically score 150-180ms. Reaction time naturally increases (slows) with age.":"متوسط زمن رد الفعل البصري لدى الإنسان نحو 200–250 جزءاً من الألف من الثانية. أقل من 200 ملّي ثانية يُعدّ سريعاً (أفضل 10%). الرياضيون المحترفون واللاعبون يسجّلون عادة 150–180 ملّي ثانية. ويزداد زمن رد الفعل (يتباطأ) طبيعياً مع التقدم في العمر.",
"Can I improve my reaction time with practice?":"هل أستطيع تحسين زمن رد الفعل بالتدريب؟",
"Regular practice can shave 10-20ms from your baseline by reducing anticipation errors. True neural reaction time has a biological floor of around 100-120ms — no amount of practice can go below that limit.":"التدريب المنتظم قد يُنقص 10–20 ملّي ثانية من نتيجتك الأساسية بتقليل أخطاء الاستباق. لكن لزمن رد الفعل العصبي الحقيقي حدّ بيولوجي يقارب 100–120 ملّي ثانية، ولا يمكن النزول تحته مهما كان التدريب.",
"How the Reaction Test works":"كيف يعمل اختبار سرعة رد الفعل",
"Wait for the screen to change colour, then tap or click as fast as you can. The test measures the time between the change and your response in milliseconds. Clicking too early counts as a false start.":"انتظر حتى يتغير لون الشاشة، ثم اضغط بأسرع ما يمكن. يقيس الاختبار الزمن بين التغيير واستجابتك بأجزاء من الألف من الثانية، والضغط المبكر يُحسب انطلاقة خاطئة.",
"How to get a fair result":"كيف تحصل على نتيجة عادلة",
"Take several attempts and look at your average rather than a single best try. Use the same device each time, sit comfortably and keep your finger resting on the button or screen.":"قم بعدة محاولات وانظر إلى المتوسط لا إلى أفضل محاولة واحدة. واستخدم الجهاز نفسه كل مرة، واجلس براحة، وأبقِ إصبعك على الزر أو الشاشة.",
"What affects reaction time":"ما الذي يؤثر في زمن رد الفعل",
"Sleep, tiredness, caffeine, age and distractions all change reaction time. Measuring it on different days is a simple way to see how alert you are.":"النوم والإرهاق والكافيين والعمر والمشتتات كلها تغيّر زمن رد الفعل، وقياسه في أيام مختلفة طريقة بسيطة لمعرفة مدى يقظتك."}-->
