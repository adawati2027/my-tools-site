"How do I play the number guessing game?":"كيف ألعب لعبة «خمّن الرقم»؟",
"The game picks a secret number within a range. You enter a guess and the game tells you whether the secret number is higher or lower. Keep guessing until you find it in as few tries as possible. Higher difficulty levels use larger number ranges.":"تختار اللعبة رقماً سرياً ضمن نطاق محدد. تُدخل تخمينك فتخبرك اللعبة إن كان الرقم السري أكبر أو أصغر. استمر في التخمين حتى تجده بأقل عدد من المحاولات. المستويات الأصعب تستخدم نطاقات أكبر.",
"What are the difficulty levels in the number guessing game?":"ما مستويات الصعوبة في لعبة «خمّن الرقم»؟",
"There are 6 levels: Easy (1–10), Medium (1–50), Hard (1–100), Expert (1–500), Master (1–1000), and Legendary (1–5000). Each level requires more strategic guessing to narrow down the answer.":"هناك 6 مستويات: سهل (1–10)، متوسط (1–50)، صعب (1–100)، خبير (1–500)، محترف (1–1000)، وأسطوري (1–5000). كل مستوى يحتاج تخميناً أذكى لتضييق نطاق الإجابة.",
"How to play Number Guess":"طريقة لعب «خمّن الرقم»",
"The game picks a secret number in a range. After each guess it tells you whether the secret number is higher or lower, until you find it.":"تختار اللعبة رقماً سرياً ضمن نطاق محدد، وبعد كل تخمين تخبرك هل الرقم السري أكبر أم أصغر، حتى تجده.",
"The fastest strategy":"أسرع استراتيجية",

"Why it is good practice":"لماذا هي تمرين مفيد",
