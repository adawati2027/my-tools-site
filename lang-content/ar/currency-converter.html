"This converter uses live exchange rates updated every 4 hours via a public rates API. Rates shown are mid-market rates — the midpoint between buying and selling rates. Banks and exchange offices typically add a 1-3% spread, so the rate you receive in practice will differ slightly from what is shown here.":"يستخدم هذا المحوّل أسعار صرف مباشرة تُحدَّث كل 4 ساعات عبر واجهة أسعار عامة. والأسعار المعروضة أسعار السوق المتوسطة — أي منتصف المسافة بين سعري الشراء والبيع. وتضيف البنوك ومحلات الصرافة عادة فرقاً بنسبة 1–3%، لذا يختلف السعر الذي تحصل عليه فعلياً قليلاً عمّا يظهر هنا.",

"— how far the provider's rate is from the mid-market rate shown by this converter. A wider spread means you get less in the destination currency even with \"no fee\" advertised.":"— أي مدى بُعد سعر المزود عن سعر السوق المتوسط الذي يعرضه هذا المحوّل. وكلما كبر الفرق قلّ ما يصل بعملة البلد المستلم، حتى لو أُعلن «بدون رسوم».",

"A practical way to compare options: take the amount you plan to send, check the rate each provider actually gives you (not just their advertised rate), subtract any fee, and compare the final amount the recipient gets — not the headline rate. Use the OMR reference table above to sanity-check how far a quoted rate is from the mid-market rate.":"طريقة عملية للمقارنة: خذ المبلغ الذي تنوي إرساله، وتحقق من السعر الذي يعطيك إياه كل مزود فعلياً (لا السعر المعلن فقط)، واطرح الرسوم، ثم قارن المبلغ النهائي الذي يستلمه المستفيد — لا السعر المعلن. واستخدم جدول الريال العُماني المرجعي أعلاه لتعرف مدى بُعد السعر المعروض عن سعر السوق.",
