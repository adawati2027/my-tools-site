"What is the difference between Hijri and Gregorian calendars?":"ما الفرق بين التقويمين الهجري والميلادي؟",
"The Hijri calendar is lunar (based on moon cycles) with 354-355 days per year. The Gregorian calendar is solar with 365-366 days. This is why the Hijri year advances about 11 days each Gregorian year.":"التقويم الهجري قمري (يعتمد على دورات القمر) وعدد أيام سنته 354–355 يوماً، أما الميلادي فشمسي وسنته 365–366 يوماً. ولهذا تتقدم السنة الهجرية نحو 11 يوماً كل سنة ميلادية.",
"When did the Hijri calendar begin?":"متى بدأ التقويم الهجري؟",
"The Hijri calendar began from the Prophet Muhammad's ﷺ migration (Hijra) from Mecca to Medina, corresponding to July 16, 622 CE.":"يبدأ التقويم الهجري من هجرة النبي محمد ﷺ من مكة إلى المدينة، الموافقة ليوم 16 يوليو 622م.",
"Why might the Hijri date differ by a day?":"لماذا قد يختلف التاريخ الهجري بيوم؟",
"Official determination in many countries depends on naked-eye moon sighting, which can cause a one-day difference between countries. This tool uses a tabular Hijri calendar algorithm, which may differ by 1–2 days from the observed calendar.":"تعتمد دول كثيرة في تحديد بدايات الأشهر رسمياً على رؤية الهلال بالعين المجردة، مما قد يسبب فرق يوم بين الدول. وتستخدم هذه الأداة خوارزمية تقويم هجري حسابي قد تختلف بيوم أو يومين عن التقويم المعتمد على الرؤية.",
"How do I find today's Hijri date?":"كيف أعرف التاريخ الهجري اليوم؟",
"The tool displays the current Hijri date automatically in the \"Today's Hijri Date\" panel as soon as you open the page. No input required.":"تعرض الأداة التاريخ الهجري الحالي تلقائياً في خانة «التاريخ الهجري اليوم» فور فتح الصفحة، دون أي إدخال.",
"What are the Hijri months in order?":"ما ترتيب الأشهر الهجرية؟",
"Muharram, Safar, Rabi al-Awwal, Rabi al-Thani, Jumada al-Awwal, Jumada al-Thani, Rajab, Sha'ban, Ramadan, Shawwal, Dhu al-Qi'dah, Dhu al-Hijjah — 12 lunar months in each Hijri year.":"محرّم، صفر، ربيع الأول، ربيع الآخر، جمادى الأولى، جمادى الآخرة، رجب، شعبان، رمضان، شوال، ذو القعدة، ذو الحجة — 12 شهراً قمرياً في كل سنة هجرية.",
"How do I accurately convert a Gregorian date to Hijri?":"كيف أحوّل تاريخاً ميلادياً إلى هجري بدقة؟",
"Use the first tab \"Gregorian → Hijri\" and enter the Gregorian date. The tool uses a tabular Hijri calendar algorithm. Note that the official date in some countries may differ by 1–2 days due to local moon sighting.":"استخدم التبويب الأول «ميلادي ← هجري» وأدخل التاريخ الميلادي. تستخدم الأداة خوارزمية تقويم هجري حسابي، مع ملاحظة أن التاريخ الرسمي في بعض الدول قد يختلف بيوم أو يومين بسبب الرؤية المحلية للهلال.",
"What are the sacred (Haram) Hijri months?":"ما الأشهر الحُرُم في التقويم الهجري؟",
"The four sacred months are: Dhu al-Qi'dah, Dhu al-Hijjah, Muharram (three consecutive), and Rajab (separate). They were called sacred because fighting was prohibited in them, a prohibition confirmed by Islam.":"الأشهر الحُرُم أربعة: ذو القعدة وذو الحجة ومحرّم (ثلاثة متتالية)، ورجب (منفرد). وسُمّيت حُرُماً لتحريم القتال فيها، وهو تحريم أقرّه الإسلام.",
"Does the tool support dates before 1900 CE?":"هل تدعم الأداة تواريخ قبل عام 1900م؟",
"Yes, the Hijri year field supports the range 1300-1600 AH (approximately 1882-2174 CE). For dates outside this range, a specialized source is recommended for precise conversion.":"نعم، يدعم حقل السنة الهجرية النطاق من 1300 إلى 1600هـ (نحو 1882–2174م). وللتواريخ خارج هذا النطاق يُنصح بمصدر متخصص لتحويل دقيق.",

"The Hijri calendar is a":"التقويم الهجري",
"lunar calendar":"تقويم قمري",
"with 12 months of 29 or 30 days each, totalling 354-355 days per year — about 11 days shorter than the Gregorian year. This means Islamic dates shift earlier through the Gregorian calendar by approximately 11 days each year. The year 1 Hijri corresponds to the Prophet Muhammad's migration (Hijra) from Mecca to Medina in 622 CE.":"من 12 شهراً، كل منها 29 أو 30 يوماً، بمجموع 354–355 يوماً في السنة — أي أقصر من السنة الميلادية بنحو 11 يوماً. ولذلك تتقدم المناسبات الإسلامية في التقويم الميلادي نحو 11 يوماً كل عام. والسنة الأولى للهجرة توافق هجرة النبي محمد ﷺ من مكة إلى المدينة عام 622م.",
"The 12 Hijri months":"الأشهر الهجرية الاثنا عشر",
"Muharram, Safar, Rabi' al-Awwal, Rabi' al-Thani, Jumada al-Awwal, Jumada al-Thani, Rajab, Sha'ban, Ramadan, Shawwal, Dhu al-Qi'dah, Dhu al-Hijjah. Ramadan (fasting) and Dhu al-Hijjah (Hajj season) are the two most significant religious months.":"محرّم، صفر، ربيع الأول، ربيع الآخر، جمادى الأولى، جمادى الآخرة، رجب، شعبان، رمضان، شوال، ذو القعدة، ذو الحجة. ورمضان (شهر الصيام) وذو الحجة (موسم الحج) أهم شهرين دينياً.",
"Tabular vs. observed Hijri dates":"التاريخ الهجري الحسابي والمعتمد على الرؤية",
"Some countries determine the start of Hijri months by physical moon sighting (Oman, Saudi Arabia, UAE), which can vary by one day from calculated dates. This converter uses a tabular Hijri calendar algorithm — a standard mathematical approximation accurate to within 1–2 days of the observed calendar.":"تحدد بعض الدول بدايات الأشهر الهجرية بالرؤية الفعلية للهلال (عُمان والسعودية والإمارات)، وقد يختلف ذلك بيوم عن التواريخ المحسوبة. ويستخدم هذا المحوّل خوارزمية تقويم هجري حسابي — وهي تقريب رياضي معياري لا يتجاوز فرقه يوماً أو يومين عن التقويم المعتمد على الرؤية.",
