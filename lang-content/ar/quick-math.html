"How does the Quick Math challenge work?":"كيف يعمل تحدي الحساب السريع؟",
"You are given arithmetic questions — addition, subtraction, multiplication, division — and must answer before the timer runs out. 100 levels progress from simple sums to complex calculations. Each correct answer earns points and advances your level.":"تظهر لك مسائل حسابية — جمع وطرح وضرب وقسمة — وعليك الإجابة قبل انتهاء الوقت. تتدرج المستويات المئة من عمليات بسيطة إلى حسابات معقدة. كل إجابة صحيحة تمنحك نقاطاً وتنقلك إلى مستوى أعلى.",
"Does practicing mental arithmetic actually improve math skills?":"هل يحسّن التدرّب على الحساب الذهني مهارات الرياضيات فعلاً؟",
"Yes. Timed mental math practice improves calculation speed and recall of number facts. The pressure of a timer forces your brain to access arithmetic knowledge faster, a technique used in educational programs worldwide.":"نعم. التدرّب على الحساب الذهني مع مؤقّت يرفع سرعة الحساب ويقوّي استحضار الحقائق العددية. ضغط الوقت يدفع الدماغ للوصول إلى المعلومات الحسابية بشكل أسرع، وهي طريقة تستخدمها برامج تعليمية حول العالم.",
"How to play Quick Math":"طريقة لعب الحساب السريع",
"Answer each arithmetic question before the timer runs out. Correct answers earn points and move you up through 100 levels, from simple sums to multi-step calculations.":"أجب عن كل مسألة حسابية قبل انتهاء الوقت؛ فالإجابات الصحيحة تمنحك نقاطاً وترفعك عبر 100 مستوى، من العمليات البسيطة إلى الحسابات متعددة الخطوات.",
"Mental math shortcuts":"اختصارات للحساب الذهني",
"To multiply by 5, multiply by 10 and halve. To add 9, add 10 and subtract 1. Break big numbers into parts: 47 + 38 = 47 + 40 − 2 = 85.":"للضرب في 5 اضرب في 10 ثم خذ النصف. ولإضافة 9 أضف 10 ثم اطرح 1. وفكّك الأعداد الكبيرة: 47 + 38 = 47 + 40 − 2 = 85.",
"Why it is good practice":"لماذا هي تمرين مفيد",
"Regular timed practice makes number facts automatic, which frees up attention for harder problems at school and in daily life — from checking a bill to estimating discounts.":"التدرّب المنتظم مع مؤقّت يجعل الحقائق العددية تلقائية، فيتفرغ انتباهك للمسائل الأصعب في المدرسة والحياة اليومية — من مراجعة فاتورة إلى تقدير الخصومات."}-->
