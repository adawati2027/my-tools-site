"How does the loan calculator work?":"كيف تعمل حاسبة القروض؟",
"This calculator uses the equal installment (amortization) formula used by most banks. The monthly payment stays fixed throughout the loan term, but the split between principal and interest changes each month.":"تستخدم هذه الحاسبة معادلة الأقساط المتساوية (الإطفاء) التي تعتمدها معظم البنوك؛ فيبقى القسط الشهري ثابتاً طوال مدة القرض، لكن توزيعه بين أصل الدين والفائدة يتغير كل شهر.",
"Early on, most of each payment goes to interest. Over time, the principal portion grows and interest shrinks. The full amortization schedule shows this month by month.":"في البداية يذهب معظم القسط إلى الفائدة، ومع الوقت يكبر جزء أصل الدين وتصغر الفائدة. ويوضح جدول السداد الكامل ذلك شهراً بشهر.",
"Formula: Payment = Principal × (r × (1+r)ⁿ) / ((1+r)ⁿ − 1) where r = monthly rate, n = number of months. At 0% interest, the amount is divided equally over all months.":"المعادلة: القسط = أصل الدين × (r × (1+r)ⁿ) / ((1+r)ⁿ − 1)، حيث r = الفائدة الشهرية وn = عدد الأشهر. وعند فائدة 0% يُقسَّم المبلغ بالتساوي على كل الأشهر.",

"Frequently Asked Questions about Loans":"الأسئلة الشائعة عن القروض",
"What is the difference between simple and compound interest?":"ما الفرق بين الفائدة البسيطة والمركّبة؟",
"Simple interest is calculated on the original principal only. Compound interest is calculated on the principal plus accumulated interest. Most personal and mortgage loans use amortization, which applies interest to the remaining balance each month.":"الفائدة البسيطة تُحسب على أصل الدين فقط، والمركّبة على أصل الدين مضافاً إليه الفوائد المتراكمة. ومعظم القروض الشخصية والعقارية تعتمد الإطفاء، أي تُحسب الفائدة شهرياً على الرصيد المتبقي.",
"How can I reduce total interest paid?":"كيف أقلل إجمالي الفوائد المدفوعة؟",
"Three ways: (1) Shorten the loan term — lower total interest despite a higher monthly payment. (2) Make extra principal payments. (3) Get a lower interest rate by comparing bank offers.":"بثلاث طرق: (1) تقصير مدة القرض — فوائد أقل إجمالاً رغم قسط أعلى. (2) دفع مبالغ إضافية من أصل الدين. (3) الحصول على فائدة أقل بمقارنة عروض البنوك.",
"Does the calculator include insurance and admin fees?":"هل تشمل الحاسبة التأمين والرسوم الإدارية؟",
"No, it calculates the base payment only. Banks may add life insurance premiums, administrative fees, and origination charges. Contact your bank for the full payment amount.":"لا، تحسب القسط الأساسي فقط. وقد تضيف البنوك أقساط تأمين على الحياة ورسوماً إدارية ورسوم منح. تواصل مع بنكك لمعرفة القسط الكامل.",
"What is an amortization schedule?":"ما هو جدول السداد (الإطفاء)؟",
"An amortization schedule shows month-by-month how each payment is split between principal and interest, and tracks the remaining balance after each payment.":"جدول السداد يوضح شهراً بشهر كيف يتوزع كل قسط بين أصل الدين والفائدة، ويتابع الرصيد المتبقي بعد كل دفعة.",
"What is a healthy debt-to-income ratio?":"ما نسبة الدين إلى الدخل المناسبة؟",
"Acceptable debt-to-income ratios vary by bank and individual circumstances — there is no universal rule. Consult your lender to find out the limit that applies to your situation.":"تختلف النسبة المقبولة حسب البنك وظروف كل شخص — ولا توجد قاعدة عامة. راجع جهة التمويل لمعرفة الحد الذي ينطبق عليك.",
"Does early repayment save interest?":"هل السداد المبكر يوفّر الفوائد؟",
"Yes. Every extra payment on the principal reduces the remaining balance and therefore interest in future months. Extra payments early in the loan term save significantly more than later. Check your contract for any early repayment penalty.":"نعم. كل دفعة إضافية من أصل الدين تقلل الرصيد المتبقي وبالتالي فوائد الأشهر التالية، والدفعات الإضافية في بداية القرض توفّر أكثر بكثير من المتأخرة. وتحقق من عقدك بشأن أي غرامة على السداد المبكر.",
"What is the difference between Islamic finance and a conventional loan?":"ما الفرق بين التمويل الإسلامي والقرض التقليدي؟",
"In Islamic finance (Murabaha/Ijara), the bank buys the asset and sells it at a pre-agreed profit — technically no interest. In a conventional loan, interest accrues on the remaining balance monthly. This calculator works for both if you enter the equivalent annual rate.":"في التمويل الإسلامي (المرابحة/الإجارة) يشتري البنك الأصل ويبيعه لك بربح متفق عليه مسبقاً — فلا توجد فائدة من الناحية الشرعية. أما القرض التقليدي فتتراكم فيه الفائدة شهرياً على الرصيد المتبقي. وتصلح هذه الحاسبة للحالتين إذا أدخلت النسبة السنوية المكافئة.",

"Loan Calculator — Monthly Payment Formula Explained":"حاسبة القروض — شرح معادلة القسط الشهري",
"The calculator uses the standard amortization formula:":"تستخدم الحاسبة معادلة الإطفاء المعتادة:",
"Payment = P × [r(1+r)ⁿ] ÷ [(1+r)ⁿ − 1]":"القسط = P × [r(1+r)ⁿ] ÷ [(1+r)ⁿ − 1]",
", where P is the principal, r is the monthly interest rate (annual rate ÷ 12), and n is the total number of monthly payments. Results are estimates — actual bank payments may include fees, insurance, or early-settlement charges.":"، حيث P أصل الدين، وr الفائدة الشهرية (السنوية ÷ 12)، وn إجمالي عدد الأقساط الشهرية. والنتائج تقديرية — فالأقساط البنكية الفعلية قد تشمل رسوماً أو تأميناً أو غرامات سداد مبكر.",
"Total interest vs. monthly payment":"إجمالي الفوائد مقابل القسط الشهري",
"A lower monthly payment is not always better. A 5-year loan costs less total interest than a 10-year loan at the same rate, even though the monthly payment is higher. Use the repayment schedule to compare the total interest paid over the full loan term.":"القسط الأقل ليس دائماً الأفضل؛ فقرض لمدة 5 سنوات يكلف فوائد إجمالية أقل من قرض لمدة 10 سنوات بالسعر نفسه، رغم أن قسطه أعلى. استخدم جدول السداد لمقارنة إجمالي الفوائد على كامل المدة.",
"Gulf country note":"ملاحظة لدول الخليج",
"Banks in Oman, Saudi Arabia and UAE often quote a flat interest rate rather than APR. A 5% flat rate is roughly equivalent to 9-10% APR under amortization. Always ask your bank for the APR to compare loans on equal terms.":"كثيراً ما تعلن البنوك في عُمان والسعودية والإمارات فائدة ثابتة (Flat) بدلاً من معدل النسبة السنوي (APR). فالفائدة الثابتة 5% تعادل تقريباً 9–10% سنوياً بنظام الإطفاء. اطلب دائماً من بنكك معدل النسبة السنوي لتقارن القروض بعدل.",

"5 years":"5 سنوات",
"(this matches the first row of the reference table below).":"(وهذا يطابق الصف الأول في الجدول المرجعي أدناه).",
"Step 1 — monthly rate (r):":"الخطوة 1 — الفائدة الشهرية (r):",

"Step 3 — plug into the formula:":"الخطوة 3 — التعويض في المعادلة:",
"Payment = 10,000 × [0.005 × (1.005)⁶⁰] ÷ [(1.005)⁶⁰ − 1]. Since (1.005)⁶⁰ ≈ 1.3489, this works out to Payment ≈":"القسط = 10,000 × [0.005 × (1.005)⁶⁰] ÷ [(1.005)⁶⁰ − 1]. وبما أن (1.005)⁶⁰ ≈ 1.3489 يكون القسط ≈",
"$193.33/month":"193.33 دولاراً شهرياً",
"Step 4 — total cost over the loan:":"الخطوة 4 — التكلفة الإجمالية للقرض:",
"the calculator carries the full unrounded monthly payment through all 60 months (not the $193.33 you see on screen, which is already rounded to the cent) — that gives":"تستخدم الحاسبة القسط الدقيق غير المقرّب طوال الأشهر الستين (لا الـ193.33 المعروضة المقرّبة لأقرب سنت) — فيكون",
"$11,599.68 total paid":"المدفوع الإجمالي 11,599.68 دولاراً",
". Note this is a few cents different from simply multiplying 193.33 × 60 ($11,599.80) — that tiny gap is exactly the rounding you'd expect once you round the monthly figure before multiplying instead of after.":"، ويختلف هذا ببضعة سنتات عن ضرب 193.33 × 60 (11,599.80) — وهو بالضبط أثر التقريب المتوقع عند تقريب القسط قبل الضرب لا بعده.",
"Step 5 — total interest:":"الخطوة 5 — إجمالي الفوائد:",
"11,599.68 − 10,000 (the original principal) =":"11,599.68 − 10,000 (أصل الدين) =",
"$1,599.68 total interest":"إجمالي الفوائد 1,599.68 دولاراً",
"— that's the real cost of borrowing, spread invisibly across 60 payments.":"— وهي التكلفة الحقيقية للاقتراض، موزعة بشكل غير ملحوظ على 60 قسطاً.",
"Notice that even though you're paying back $11,599.68 total, only $10,000 of that is the money you actually borrowed — the other $1,599.68 is what the loan costs you for spreading repayment over 5 years instead of paying in full today. Try the calculator above with a shorter term (say 3 years) on the same $10,000 at 6% — the monthly payment goes up, but total interest drops, because the bank charges interest on the outstanding balance for less time.":"لاحظ أنك رغم سدادك 11,599.68 دولاراً إجمالاً، فإن 10,000 منها فقط هي المال الذي اقترضته فعلاً — والـ1,599.68 الباقية هي ثمن توزيع السداد على 5 سنوات بدل الدفع كاملاً اليوم. جرّب الحاسبة أعلاه بمدة أقصر (3 سنوات مثلاً) على المبلغ نفسه بفائدة 6% — سيرتفع القسط لكن تنخفض الفوائد الإجمالية، لأن البنك يحسب الفائدة على الرصيد المتبقي لمدة أقل.",
