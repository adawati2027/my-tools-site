"How does the memory card matching game work?":"كيف تعمل لعبة الذاكرة (مطابقة البطاقات)؟",
"Cards are placed face-down. You flip two at a time — if they match, they stay face-up; if not, they flip back. The goal is to match all pairs in as few flips as possible. Tests short-term memory and concentration.":"توضع البطاقات مقلوبة على وجهها، وتقلب بطاقتين في كل مرة: إذا تطابقتا تبقيان مكشوفتين، وإلا تنقلبان من جديد. الهدف هو مطابقة كل الأزواج بأقل عدد ممكن من المحاولات. تدرّب اللعبة الذاكرة قصيرة المدى والتركيز.",
"What difficulty levels does the memory game have?":"ما مستويات الصعوبة في لعبة الذاكرة؟",
"There are 6 levels from Easy (fewer cards) to Legendary (many cards with a strict time limit). Higher levels present more cards and less time, making it progressively more challenging for experienced players.":"هناك 6 مستويات من «سهل» (بطاقات أقل) إلى «أسطوري» (بطاقات كثيرة مع حدّ زمني صارم). كلما ارتفع المستوى زادت البطاقات وقلّ الوقت، فيصبح التحدي أصعب تدريجياً حتى على اللاعبين المتمرّسين.",
"How to play the Memory Game":"طريقة لعب لعبة الذاكرة",
"Turn over two cards at a time and try to find matching pairs. Matching cards stay face-up; the rest flip back. Finish the board in as few moves and as little time as possible.":"اقلب بطاقتين في كل مرة وحاول إيجاد الأزواج المتطابقة؛ البطاقات المتطابقة تبقى مكشوفة والباقي ينقلب من جديد. أنهِ اللوحة بأقل عدد من الحركات وفي أقصر وقت.",
"Tips for remembering more cards":"نصائح لتذكّر بطاقات أكثر",
"Work systematically from one corner instead of clicking randomly. Say what you see in your head (\"star, top left\"), and when you flip one new card, check whether you have already seen its partner before flipping a second unknown card.":"ابدأ بترتيب من زاوية واحدة بدل الضغط العشوائي، وردّد في ذهنك ما تراه («نجمة، أعلى اليسار»). وعندما تقلب بطاقة جديدة تأكد هل رأيت شبيهتها من قبل قبل أن تقلب بطاقة مجهولة ثانية.",
"Why it is good practice":"لماذا هي تمرين مفيد",
"Matching games exercise short-term and visual memory and concentration. They are a gentle brain workout for children and adults alike.":"ألعاب المطابقة تمرّن الذاكرة قصيرة المدى والذاكرة البصرية والتركيز، وهي تمرين لطيف للدماغ للصغار والكبار معاً."}-->
