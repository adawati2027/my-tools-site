"How is my Hijri age calculated?":"كيف يُحسب عمري بالهجري؟",
"We convert your birthdate to the Hijri calendar using a tabular algorithm (accurate to within 1–2 days of the observed calendar), then calculate the difference between your Hijri birthdate and today's Hijri date in years, months, and days — not by dividing days by an average year.":"نحوّل تاريخ ميلادك إلى التقويم الهجري بخوارزمية حسابية (بفارق يوم أو يومين عن التقويم المعتمد على الرؤية)، ثم نحسب الفرق بين تاريخ ميلادك الهجري وتاريخ اليوم الهجري بالسنوات والأشهر والأيام — لا بقسمة عدد الأيام على متوسط طول السنة.",
"Why is my Hijri age different from my Gregorian age?":"لماذا يختلف عمري الهجري عن عمري الميلادي؟",
"The Hijri year is lunar (354-355 days), while the Gregorian year is solar (365-366 days). The Hijri year is shorter by about 11 days, so your Hijri age will always be larger — for example, 30 Gregorian years ≈ 30.9 Hijri years.":"السنة الهجرية قمرية (354–355 يوماً) والسنة الميلادية شمسية (365–366 يوماً). فالسنة الهجرية أقصر بنحو 11 يوماً، ولذلك يكون عمرك الهجري دائماً أكبر — مثلاً 30 سنة ميلادية ≈ 30.9 سنة هجرية.",
"Is the calculator accurate?":"هل الحاسبة دقيقة؟",

"Can I calculate someone else's age?":"هل يمكنني حساب عمر شخص آخر؟",
"Yes, enter any person's date of birth in the field and results appear instantly. The calculator works for any date in the past.":"نعم، أدخل تاريخ ميلاد أي شخص وستظهر النتيجة فوراً. تعمل الحاسبة مع أي تاريخ في الماضي.",
