"How do I control the jump platformer game?":"كيف أتحكم في لعبة القفز بين المنصات؟",
"Use Space bar or the up arrow key to jump on desktop. On mobile, tap the jump button on screen. Move left and right using arrow keys or on-screen buttons. Reach all platforms and collect stars to complete each level.":"على الكمبيوتر اضغط مفتاح المسافة أو السهم العلوي للقفز، وعلى الجوال اضغط زر القفز على الشاشة. تحرّك يميناً ويساراً بالأسهم أو بأزرار الشاشة. اصعد إلى كل المنصات واجمع النجوم لإكمال كل مستوى.",
"Is the jump game suitable for young children?":"هل لعبة القفز مناسبة للأطفال الصغار؟",
"Yes. The game is designed to be simple and safe for children. No violent content, no ads within the game, no in-app purchases. Works directly in the browser — no installation required.":"نعم. صُممت اللعبة لتكون بسيطة وآمنة للأطفال: لا محتوى عنيف، ولا إعلانات داخل اللعبة، ولا مشتريات داخلية. تعمل مباشرة في المتصفح دون تثبيت.",
"How to play the Jump Game":"طريقة لعب لعبة القفز",
"Jump from platform to platform, collect the stars and reach the end of each level without falling. Each new level adds wider gaps and trickier platforms.":"اقفز من منصة إلى أخرى، واجمع النجوم، وصِل إلى نهاية كل مستوى دون أن تسقط. وكل مستوى جديد يضيف فجوات أوسع ومنصات أصعب.",
"Tips for clearing levels":"نصائح لاجتياز المستويات",
"Time your jump at the very edge of a platform for the longest distance. Collect stars on the way rather than going back for them, and pause for a moment before difficult gaps.":"اقفز من طرف المنصة تماماً لتقطع أطول مسافة، واجمع النجوم في طريقك بدل الرجوع إليها، وتوقّف لحظة قبل الفجوات الصعبة.",
"Why it is good practice":"لماذا هي تمرين مفيد",
"Platform games build timing, patience and spatial awareness. They are simple enough for children and still challenging on the higher levels.":"ألعاب المنصات تنمّي التوقيت والصبر والإدراك المكاني، وهي بسيطة بما يكفي للأطفال وتبقى تحدياً في المستويات العليا."}-->
