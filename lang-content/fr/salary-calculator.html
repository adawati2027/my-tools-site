"What is the difference between basic and gross salary?":"Quelle est la différence entre salaire de base et salaire brut ?",
"Basic salary is the fixed amount specified in the employment contract. Gross = Basic + all allowances (housing, transport, etc.).":"Le salaire de base est le montant fixe indiqué dans le contrat de travail. Brut = base + toutes les indemnités (logement, transport, etc.).",

"SPF is calculated on the contributory wage per SPF rules (cap OMR 3,000 for the basic branch) — this calculator uses basic salary as a simplified input; actual amounts may differ.":"Le SPF est calculé sur le salaire soumis à cotisation selon les règles du SPF (plafond de 3 000 OMR pour la branche de base) — ce calculateur utilise le salaire de base comme donnée simplifiée ; les montants réels peuvent différer.",
"What is the minimum wage in Oman?":"Quel est le salaire minimum à Oman ?",
"The minimum wage for Omani nationals is OMR 325 per month (per the latest decree). Check the Ministry of Labour for official updates.":"Le salaire minimum des ressortissants omanais est de 325 OMR par mois (selon le dernier décret). Consultez le ministère du Travail pour les mises à jour officielles.",
"How do I estimate my SPF deduction?":"Comment estimer ma retenue SPF ?",
"This calculator uses basic salary for a simplified 8% estimate. The official calculation depends on the contributory wage per SPF rules. Estimate: deduction ≈ Basic × 8% (cap OMR 3,000 for basic branch).":"Ce calculateur utilise le salaire de base pour une estimation simplifiée à 8 %. Le calcul officiel dépend du salaire soumis à cotisation selon les règles du SPF. Estimation : retenue ≈ base × 8 % (plafond de 3 000 OMR pour la branche de base).",
"Does SPF deduction apply to expatriates?":"La retenue SPF s'applique-t-elle aux expatriés ?",
"No, the 8% deduction does not apply to expatriate employees. Expatriates have a separate savings system funded by the employer. Expat net salary = gross with no deductions.":"Non, la retenue de 8 % ne s'applique pas aux salariés expatriés. Ceux-ci relèvent d'un système d'épargne distinct financé par l'employeur. Net d'un expatrié = brut, sans retenue.",
"What does the SPF social protection system cover?":"Que couvre le système de protection sociale SPF ?",
"SPF covers several insurance branches including: old age, disability and death; employment security; work injuries and occupational diseases; sick and emergency leave; and maternity leave. For updated details visit spf.gov.om.":"Le SPF couvre plusieurs branches d'assurance, notamment : vieillesse, invalidité et décès ; sécurité de l'emploi ; accidents du travail et maladies professionnelles ; congés maladie et d'urgence ; et congé maternité. Pour des informations à jour, consultez spf.gov.om.",
"Is there income tax on salaries in Oman?":"Y a-t-il un impôt sur le revenu des salaires à Oman ?",
"As of 2026, no personal income tax applies to salaries in Oman. However, the Personal Income Tax (PIT) law was issued in 2025 and will begin applying from 2028 under specific conditions. Currently, the only deduction for Omani employees is SPF at 8%.":"En 2026, aucun impôt sur le revenu des personnes physiques ne s'applique aux salaires à Oman. Toutefois, la loi sur l'impôt sur le revenu des personnes physiques (PIT) a été promulguée en 2025 et s'appliquera à partir de 2028 sous certaines conditions. Actuellement, la seule retenue pour les salariés omanais est le SPF de 8 %.",
"What is the difference between PASI and SPF in Oman?":"Quelle est la différence entre PASI et SPF à Oman ?",
"PASI (Public Authority for Social Insurance) was the old name of the supervising body. It was merged into the new Social Protection Fund (SPF) which now consolidates all social protection branches in Oman.":"La PASI (Autorité publique de l'assurance sociale) était l'ancien nom de l'organisme de tutelle. Elle a été fusionnée dans le nouveau Fonds de protection sociale (SPF), qui regroupe désormais toutes les branches de la protection sociale à Oman.",
"What is the employer SPF contribution rate in Oman?":"Quel est le taux de cotisation SPF de l'employeur à Oman ?",
"For Omani employees, the employer contributes a combined 14.5% of the contributory wage across active SPF branches (11% for old age/disability/death, with the remaining ~3.5% spread across work injuries, employment security, and maternity/sick leave branches). The employee contributes 8% (7.5% old age/disability/death + 0.5% employment security). Combined total = 22.5% of contributory wage. Rates can change — verify current figures at spf.gov.om.":"Pour les salariés omanais, l'employeur verse au total 14,5 % du salaire soumis à cotisation, répartis entre les branches actives du SPF (11 % pour la vieillesse/invalidité/décès, et environ 3,5 % répartis entre les accidents du travail, la sécurité de l'emploi et les congés maternité/maladie). Le salarié verse 8 % (7,5 % vieillesse/invalidité/décès + 0,5 % sécurité de l'emploi). Total combiné = 22,5 % du salaire soumis à cotisation. Les taux peuvent changer — vérifiez les chiffres actuels sur spf.gov.om.",
"How is overtime calculated in Oman?":"Comment les heures supplémentaires sont-elles calculées à Oman ?",
"Under the Oman Labour Law, overtime on regular weekdays is paid at 125% of the normal hourly rate. Work on weekly rest days or public holidays is paid at 150%. The overtime base is calculated from basic salary only.":"Selon le Code du travail omanais, les heures supplémentaires en semaine sont payées à 125 % du taux horaire normal. Le travail les jours de repos hebdomadaire ou les jours fériés est payé à 150 %. La base des heures supplémentaires est calculée sur le seul salaire de base.",

"Oman's Social Protection Fund (SPF) replaced the previous PASI (Public Authority for Social Insurance) system. Omani national employees contribute 8% of their gross basic salary; employers contribute an additional amount. Expatriate employees are not enrolled in SPF and receive no deduction.":"Le Fonds de protection sociale d'Oman (SPF) a remplacé l'ancien système de la PASI (Autorité publique de l'assurance sociale). Les salariés de nationalité omanaise cotisent 8 % de leur salaire de base brut ; l'employeur verse une cotisation supplémentaire. Les salariés expatriés ne sont pas affiliés au SPF et ne subissent aucune retenue.",

"Comparing Job Offers — Why Gross Salary Alone Is Misleading":"Comparer des offres d'emploi — pourquoi le salaire brut seul est trompeur",
"A job offer's headline salary figure is often just the gross basic — comparing two offers by that number alone can be misleading. Before accepting an offer, break it down into its real components:":"Le salaire mis en avant dans une offre d'emploi n'est souvent que le salaire de base brut — comparer deux offres sur ce seul chiffre peut induire en erreur. Avant d'accepter une offre, décomposez-la en ses éléments réels :",
"Basic salary":"Salaire de base",
"— the fixed contractual amount, and the figure most deductions/end-of-service calculations are based on.":"— le montant contractuel fixe, sur lequel reposent la plupart des retenues et le calcul de l'indemnité de fin de service.",
"Allowances":"Indemnités",
"(housing, transport, other) — add to take-home pay but usually don't count toward SPF/end-of-service calculations, so a high-allowance/low-basic offer can look attractive monthly but pay out less on exit or in social-insurance contributions.":"(logement, transport, autres) — elles augmentent le salaire perçu mais ne comptent généralement pas pour le SPF ni pour l'indemnité de fin de service : une offre avec beaucoup d'indemnités et un salaire de base faible peut sembler attractive chaque mois mais rapporter moins au départ ou en cotisations sociales.",
"Deductions":"Retenues",
"— SPF (Omani nationals only, see above) or any other agreed deductions.":"— SPF (ressortissants omanais uniquement, voir ci-dessus) ou autres retenues convenues.",
"Net salary":"Salaire net",
"— what actually reaches your bank account, the number that matters for budgeting.":"— ce qui arrive réellement sur votre compte bancaire, le chiffre qui compte pour votre budget.",
"When comparing two offers, run both through this calculator using their actual basic salary (not the combined gross figure some offer letters lead with) to see a realistic net-pay comparison, and separately check how each structures its basic-vs-allowance split — it affects both your monthly net and your eventual end-of-service benefit.":"Pour comparer deux offres, passez-les toutes deux dans ce calculateur avec leur véritable salaire de base (et non le brut cumulé que certaines lettres d'offre mettent en avant) afin d'obtenir une comparaison réaliste du net, et vérifiez séparément la répartition base/indemnités de chacune — elle influe à la fois sur votre net mensuel et sur votre future indemnité de fin de service."}-->
