"How does the loan calculator work?":"Comment fonctionne le calculateur de prêt ?",
"This calculator uses the equal installment (amortization) formula used by most banks. The monthly payment stays fixed throughout the loan term, but the split between principal and interest changes each month.":"Ce calculateur utilise la formule des mensualités constantes (amortissement) employée par la plupart des banques. La mensualité reste la même pendant toute la durée du prêt, mais la répartition entre capital et intérêts change chaque mois.",
"Early on, most of each payment goes to interest. Over time, the principal portion grows and interest shrinks. The full amortization schedule shows this month by month.":"Au début, la majeure partie de chaque mensualité sert à payer les intérêts. Avec le temps, la part du capital augmente et celle des intérêts diminue. Le tableau d'amortissement complet le montre mois par mois.",
"Formula: Payment = Principal × (r × (1+r)ⁿ) / ((1+r)ⁿ − 1) where r = monthly rate, n = number of months. At 0% interest, the amount is divided equally over all months.":"Formule : Mensualité = Capital × (r × (1+r)ⁿ) / ((1+r)ⁿ − 1), où r = taux mensuel et n = nombre de mois. À 0 % d'intérêt, le montant est réparti à parts égales sur tous les mois.",

"Frequently Asked Questions about Loans":"Questions fréquentes sur les prêts",
"What is the difference between simple and compound interest?":"Quelle est la différence entre intérêts simples et composés ?",
"Simple interest is calculated on the original principal only. Compound interest is calculated on the principal plus accumulated interest. Most personal and mortgage loans use amortization, which applies interest to the remaining balance each month.":"Les intérêts simples sont calculés uniquement sur le capital initial. Les intérêts composés sont calculés sur le capital plus les intérêts accumulés. La plupart des prêts personnels et immobiliers sont amortissables : les intérêts s'appliquent chaque mois au capital restant dû.",
"How can I reduce total interest paid?":"Comment réduire le total des intérêts payés ?",
"Three ways: (1) Shorten the loan term — lower total interest despite a higher monthly payment. (2) Make extra principal payments. (3) Get a lower interest rate by comparing bank offers.":"Trois moyens : (1) raccourcir la durée du prêt — moins d'intérêts au total malgré une mensualité plus élevée ; (2) faire des remboursements anticipés de capital ; (3) obtenir un taux plus bas en comparant les offres des banques.",
"Does the calculator include insurance and admin fees?":"Le calculateur inclut-il l'assurance et les frais de dossier ?",
"No, it calculates the base payment only. Banks may add life insurance premiums, administrative fees, and origination charges. Contact your bank for the full payment amount.":"Non, il calcule uniquement la mensualité de base. Les banques peuvent ajouter une assurance décès, des frais administratifs et des frais de dossier. Contactez votre banque pour le montant total à payer.",
"What is an amortization schedule?":"Qu'est-ce qu'un tableau d'amortissement ?",
"An amortization schedule shows month-by-month how each payment is split between principal and interest, and tracks the remaining balance after each payment.":"Un tableau d'amortissement indique mois par mois comment chaque mensualité se répartit entre capital et intérêts, et suit le capital restant dû après chaque paiement.",
"What is a healthy debt-to-income ratio?":"Qu'est-ce qu'un taux d'endettement raisonnable ?",
"Acceptable debt-to-income ratios vary by bank and individual circumstances — there is no universal rule. Consult your lender to find out the limit that applies to your situation.":"Le taux d'endettement acceptable varie selon les banques et la situation de chacun — il n'existe pas de règle universelle. Renseignez-vous auprès de votre prêteur sur la limite qui s'applique à votre cas.",
"Does early repayment save interest?":"Le remboursement anticipé fait-il économiser des intérêts ?",
"Yes. Every extra payment on the principal reduces the remaining balance and therefore interest in future months. Extra payments early in the loan term save significantly more than later. Check your contract for any early repayment penalty.":"Oui. Chaque remboursement supplémentaire du capital réduit le solde restant et donc les intérêts des mois suivants. Les remboursements anticipés en début de prêt font économiser bien plus que ceux effectués plus tard. Vérifiez dans votre contrat s'il existe des pénalités de remboursement anticipé.",
"What is the difference between Islamic finance and a conventional loan?":"Quelle est la différence entre la finance islamique et un prêt classique ?",
"In Islamic finance (Murabaha/Ijara), the bank buys the asset and sells it at a pre-agreed profit — technically no interest. In a conventional loan, interest accrues on the remaining balance monthly. This calculator works for both if you enter the equivalent annual rate.":"En finance islamique (Mourabaha/Ijara), la banque achète le bien et le revend avec une marge convenue à l'avance — techniquement sans intérêts. Dans un prêt classique, les intérêts courent chaque mois sur le capital restant dû. Ce calculateur fonctionne pour les deux si vous saisissez le taux annuel équivalent.",

"The calculator uses the standard amortization formula:":"Le calculateur utilise la formule d'amortissement standard :",
"Payment = P × [r(1+r)ⁿ] ÷ [(1+r)ⁿ − 1]":"Mensualité = P × [r(1+r)ⁿ] ÷ [(1+r)ⁿ − 1]",
", where P is the principal, r is the monthly interest rate (annual rate ÷ 12), and n is the total number of monthly payments. Results are estimates — actual bank payments may include fees, insurance, or early-settlement charges.":", où P est le capital, r le taux d'intérêt mensuel (taux annuel ÷ 12) et n le nombre total de mensualités. Les résultats sont des estimations — les mensualités bancaires réelles peuvent inclure des frais, une assurance ou des pénalités de remboursement anticipé.",
"Total interest vs. monthly payment":"Total des intérêts ou mensualité",
"A lower monthly payment is not always better. A 5-year loan costs less total interest than a 10-year loan at the same rate, even though the monthly payment is higher. Use the repayment schedule to compare the total interest paid over the full loan term.":"Une mensualité plus faible n'est pas toujours préférable. Un prêt sur 5 ans coûte moins d'intérêts au total qu'un prêt sur 10 ans au même taux, même si la mensualité est plus élevée. Utilisez le tableau de remboursement pour comparer le total des intérêts payés sur toute la durée.",
