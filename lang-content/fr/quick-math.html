"How does the Quick Math challenge work?":"Comment fonctionne le défi Calcul rapide ?",
"You are given arithmetic questions — addition, subtraction, multiplication, division — and must answer before the timer runs out. 100 levels progress from simple sums to complex calculations. Each correct answer earns points and advances your level.":"Vous recevez des opérations — additions, soustractions, multiplications, divisions — et devez répondre avant la fin du chrono. Les 100 niveaux vont des sommes simples aux calculs complexes. Chaque bonne réponse rapporte des points et vous fait progresser.",
"Does practicing mental arithmetic actually improve math skills?":"Le calcul mental chronométré améliore-t-il vraiment les compétences en maths ?",
"Yes. Timed mental math practice improves calculation speed and recall of number facts. The pressure of a timer forces your brain to access arithmetic knowledge faster, a technique used in educational programs worldwide.":"Oui. S'entraîner au calcul mental chronométré améliore la vitesse de calcul et la mémorisation des résultats. La pression du chrono pousse le cerveau à accéder plus vite à ses connaissances arithmétiques, une technique utilisée dans des programmes éducatifs du monde entier.",
"How to play Quick Math":"Comment jouer à Calcul rapide",
"Answer each arithmetic question before the timer runs out. Correct answers earn points and move you up through 100 levels, from simple sums to multi-step calculations.":"Répondez à chaque opération avant la fin du chrono. Les bonnes réponses rapportent des points et vous font progresser à travers 100 niveaux, des additions simples aux calculs en plusieurs étapes.",
