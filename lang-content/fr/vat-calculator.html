"❓ FAQs about VAT":"❓ Questions fréquentes sur la TVA",
"What is VAT (Value Added Tax)?":"Qu'est-ce que la TVA (taxe sur la valeur ajoutée) ?",
"VAT is an indirect tax applied to most goods and services. It is paid by the end consumer and collected by businesses on behalf of the government.":"La TVA est un impôt indirect appliqué à la plupart des biens et services. Elle est payée par le consommateur final et collectée par les entreprises pour le compte de l'État.",
"How do I calculate 5% VAT on an amount?":"Comment calculer une TVA de 5 % sur un montant ?",
"Multiply the amount by 0.05. Example: 100 × 0.05 = 5 tax. Total = 105.":"Multipliez le montant par 0,05. Exemple : 100 × 0,05 = 5 de taxe. Total = 105.",
"How do I extract VAT from a VAT-inclusive amount?":"Comment extraire la TVA d'un montant TTC ?",
"Divide the inclusive amount by (1 + tax rate). Example: 105 ÷ 1.05 = 100 (before tax). Tax = 5.":"Divisez le montant TTC par (1 + taux). Exemple : 105 ÷ 1,05 = 100 (hors taxe). Taxe = 5.",
"Which goods are VAT-exempt in Oman?":"Quels biens sont exonérés de TVA à Oman ?",
"Some qualifying supplies may be zero-rated or exempt subject to Tax Authority conditions — for example, certain basic foodstuffs, qualifying healthcare/education services, residential rental, and certain financial services. Most goods and services remain subject to the standard 5% rate.":"Certaines livraisons éligibles peuvent être au taux zéro ou exonérées sous conditions de l'Autorité fiscale — par exemple certains produits alimentaires de base, des services de santé/d'éducation éligibles, la location résidentielle et certains services financiers. La plupart des biens et services restent soumis au taux normal de 5 %.",
"Why is Saudi Arabia's VAT rate 15% instead of 5%?":"Pourquoi la TVA saoudienne est-elle de 15 % et non de 5 % ?",
"Saudi Arabia raised its VAT from 5% to 15% in July 2020 due to fiscal pressures from COVID-19 and lower oil prices. Oman and UAE have maintained the 5% rate.":"L'Arabie saoudite a relevé sa TVA de 5 % à 15 % en juillet 2020 en raison des pressions budgétaires liées au COVID-19 et à la baisse des prix du pétrole. Oman et les Émirats ont conservé le taux de 5 %.",
"When must a business register for VAT in Oman?":"Quand une entreprise doit-elle s'immatriculer à la TVA à Oman ?",
"Businesses must register when annual turnover exceeds OMR 38,500. Voluntary registration from OMR 19,250. Competent authority: Tax Authority taa.gov.om.":"L'immatriculation est obligatoire lorsque le chiffre d'affaires annuel dépasse 38 500 OMR. Elle est volontaire à partir de 19 250 OMR. Autorité compétente : Autorité fiscale taa.gov.om.",
"When was VAT introduced in Oman?":"Quand la TVA a-t-elle été introduite à Oman ?",
"Oman implemented VAT at 5% in April 2021, making it the fourth GCC country to introduce VAT, after the UAE and Saudi Arabia (2018) and Bahrain (2019).":"Oman a mis en place la TVA à 5 % en avril 2021, devenant ainsi le quatrième pays du CCG à l'introduire, après les Émirats et l'Arabie saoudite (2018) et Bahreïn (2019).",
"Are exports zero-rated for VAT in Oman?":"Les exportations sont-elles au taux zéro de TVA à Oman ?",
"Exports from Oman are zero-rated (0% VAT). Exporters do not charge VAT to foreign buyers but can reclaim any input VAT paid locally.":"Les exportations depuis Oman sont au taux zéro (0 % de TVA). Les exportateurs ne facturent pas la TVA aux acheteurs étrangers mais peuvent récupérer la TVA payée localement en amont.",
"How to calculate VAT on a restaurant bill in Oman?":"Comment calculer la TVA sur une addition de restaurant à Oman ?",
"Prepared food and restaurant meals are subject to 5% VAT in Oman. Example: bill OMR 20 → VAT = 20 × 0.05 = OMR 1 → total = OMR 21. Enter the amount in the calculator above and select Oman 5% for the instant result.":"Les plats préparés et les repas au restaurant sont soumis à une TVA de 5 % à Oman. Exemple : addition de 20 OMR → TVA = 20 × 0,05 = 1 OMR → total = 21 OMR. Saisissez le montant dans le calculateur ci-dessus et choisissez Oman 5 % pour un résultat instantané.",

"Value Added Tax (VAT) was introduced across GCC countries at different times. The UAE and Saudi Arabia introduced 5% VAT in January 2018; Saudi Arabia raised its rate to 15% in July 2020. Oman introduced 5% VAT in April 2021. Bahrain introduced 5% in January 2019 (raised to 10% in 2022).":"La taxe sur la valeur ajoutée (TVA) a été introduite dans les pays du CCG à des dates différentes. Les Émirats et l'Arabie saoudite ont introduit une TVA de 5 % en janvier 2018 ; l'Arabie saoudite l'a portée à 15 % en juillet 2020. Oman a introduit une TVA de 5 % en avril 2021. Bahreïn l'a introduite à 5 % en janvier 2019 (portée à 10 % en 2022).",
