"What is the difference between the new and old system?":"Quelle est la différence entre le nouveau et l'ancien système ?",
"Old system: 15 days for years 1–3, 20 days for years 3–5, 30 days after 5 years (calculated from daily rate = basic÷26). New system (Article 61): minimum is one full month's salary per year with fractions pro-rated. The higher amount applies per the employment contract and applicable system.":"Ancien système : 15 jours pour les années 1 à 3, 20 jours pour les années 3 à 5, 30 jours au-delà de 5 ans (calculés sur le salaire journalier = base ÷ 26). Nouveau système (article 61) : minimum d'un mois complet de salaire par an, fractions au prorata. Le montant le plus élevé s'applique selon le contrat de travail et le régime applicable.",
"Am I entitled to gratuity if I worked less than one year?":"Ai-je droit à l'indemnité si j'ai travaillé moins d'un an ?",
"Under the updated Omani Labor Law (Article 61), fractions of a year are calculated proportionally. An employee who completed 6 months is entitled to 0.5 months' salary.":"Selon le Code du travail omanais mis à jour (article 61), les fractions d'année sont calculées au prorata. Un salarié ayant effectué 6 mois a droit à 0,5 mois de salaire.",
"Is an expatriate entitled to end of service gratuity?":"Un expatrié a-t-il droit à l'indemnité de fin de service ?",
"Yes. Oman's Labor Law applies to both Omani nationals and expatriates. Expatriate employees are entitled to end of service gratuity under the stated provisions, and also have an SPF savings program funded by the employer.":"Oui. Le Code du travail omanais s'applique aux Omanais comme aux expatriés. Les salariés expatriés ont droit à l'indemnité de fin de service selon les dispositions indiquées, et bénéficient aussi d'un programme d'épargne SPF financé par l'employeur.",
"Are allowances included in the gratuity calculation?":"Les indemnités (allocations) sont-elles incluses dans le calcul ?",
"Under labor law, gratuity is calculated on basic salary only. Some companies include allowances in the individual contract and use them in the calculation — check your contract to confirm.":"Selon le Code du travail, l'indemnité est calculée sur le seul salaire de base. Certaines entreprises incluent des allocations dans le contrat individuel et les utilisent dans le calcul — vérifiez votre contrat.",
"What is the difference in end of service between Omani nationals and expatriates?":"Quelle est la différence de fin de service entre Omanais et expatriés ?",
"For Omanis: end of service is managed through the SPF savings program with employer contributions of 11.5% monthly. For expatriates: calculated under Article 61 (minimum one month's salary per year of service).":"Pour les Omanais : la fin de service est gérée par le programme d'épargne du SPF, avec des cotisations patronales de 11,5 % par mois. Pour les expatriés : calcul selon l'article 61 (au minimum un mois de salaire par année de service).",
"When must end of service gratuity be paid?":"Quand l'indemnité de fin de service doit-elle être versée ?",
"Under Article 91 of Oman's Labor Law, the employer must pay the employee's wages and all entitlements upon termination of employment. If the employee leaves voluntarily, entitlements must be paid within 7 days of the leaving date. In case of delay, the employee can file a complaint with the Ministry of Labour.":"Selon l'article 91 du Code du travail omanais, l'employeur doit verser au salarié son salaire et tous ses droits à la fin du contrat. Si le salarié part volontairement, ses droits doivent être réglés dans les 7 jours suivant son départ. En cas de retard, le salarié peut déposer une plainte auprès du ministère du Travail.",
"Is gratuity paid in case of resignation?":"L'indemnité est-elle versée en cas de démission ?",
"Entitlements differ based on the reason for termination, the applicable legal system, and the employment contract. Specific circumstances may affect the entitlement. Check your contract and consult a specialist lawyer to confirm.":"Les droits diffèrent selon le motif de la fin du contrat, le régime juridique applicable et le contrat de travail. Des circonstances particulières peuvent influer sur le droit à l'indemnité. Vérifiez votre contrat et consultez un avocat spécialisé.",
"What is the minimum service period to claim gratuity?":"Quelle est la durée de service minimale pour réclamer l'indemnité ?",
"End of service gratuity is calculated per the provisions applicable to the employee, their contract, and the prevailing legal system. Do not use the 3-year rule as a general rule; entitlements may differ based on the termination reason and applicable system.":"L'indemnité de fin de service est calculée selon les dispositions applicables au salarié, à son contrat et au régime juridique en vigueur. N'appliquez pas la règle des 3 ans de façon générale ; les droits peuvent varier selon le motif de départ et le régime applicable.",
"Am I entitled to full gratuity if I resign?":"Ai-je droit à l'indemnité complète si je démissionne ?",
"Under the updated Article 61, gratuity is calculated proportionally for each year of service whether termination is employee- or employer-initiated. In case of disciplinary dismissal under Article 40, gratuity may be forfeited in whole or in part. Consult a specialist lawyer for your specific situation.":"Selon l'article 61 mis à jour, l'indemnité est calculée au prorata de chaque année de service, que la fin du contrat soit à l'initiative du salarié ou de l'employeur. En cas de licenciement disciplinaire au titre de l'article 40, l'indemnité peut être perdue en tout ou en partie. Consultez un avocat spécialisé pour votre situation.",
"How is gratuity calculated for a partial year?":"Comment l'indemnité est-elle calculée pour une année incomplète ?",
