"What is BMI (Body Mass Index)?":"Qu'est-ce que l'IMC (indice de masse corporelle) ?",
"Body Mass Index (BMI) is a simple measurement used to estimate body fat based on weight and height. Devised by the statistician Adolphe Quetelet in the 19th century and adopted by the World Health Organization (WHO) for its weight classification, it is the most widely used tool globally for screening healthy weight.":"L'indice de masse corporelle (IMC) est une mesure simple utilisée pour estimer la masse grasse à partir du poids et de la taille. Conçu par le statisticien Adolphe Quetelet au XIXe siècle et adopté par l'Organisation mondiale de la santé (OMS) pour sa classification du poids, c'est l'outil le plus utilisé au monde pour dépister un poids sain.",
"BMI is calculated by dividing weight in kilograms by the square of height in meters. The result is classified into four categories: underweight, normal weight, overweight, and obese.":"L'IMC se calcule en divisant le poids en kilogrammes par le carré de la taille en mètres. Le résultat est classé en quatre catégories : insuffisance pondérale, poids normal, surpoids et obésité.",
"Note that BMI does not differentiate between fat and muscle, so it may not accurately reflect the situation of athletes, children, or the elderly. Use it as a general indicator, not a medical diagnosis.":"L'IMC ne fait pas la différence entre la graisse et le muscle ; il peut donc mal refléter la situation des sportifs, des enfants ou des personnes âgées. Utilisez-le comme un indicateur général, pas comme un diagnostic médical.",
"How is BMI calculated?":"Comment l'IMC est-il calculé ?",
"The mathematical formula for calculating BMI is:":"La formule mathématique de l'IMC est :",
"BMI = Weight (kg) ÷ Height² (m)":"IMC = Poids (kg) ÷ Taille² (m)",
"Example: A person weighing 75 kg and 175 cm tall (1.75 m):":"Exemple : une personne de 75 kg mesurant 175 cm (1,75 m) :",
"BMI = 75 ÷ (1.75 × 1.75) = 75 ÷ 3.0625 ≈ 24.5":"IMC = 75 ÷ (1,75 × 1,75) = 75 ÷ 3,0625 ≈ 24,5",
"The result 24.5 falls in the normal range (18.5 – 24.9). If using pounds and inches: BMI = (weight in lbs ÷ height in inches²) × 703":"Le résultat 24,5 se situe dans la plage normale (18,5 – 24,9). En livres et en pouces : IMC = (poids en lb ÷ taille en pouces²) × 703",
"Frequently Asked Questions about BMI":"Questions fréquentes sur l'IMC",
"Is BMI accurate for everyone?":"L'IMC est-il fiable pour tout le monde ?",
"BMI is a useful general indicator for most adults, but may be less accurate for athletes (muscle weighs more than fat), pregnant women, children, and older adults. For a more accurate assessment, consult a doctor and consider additional measurements like waist circumference or body fat percentage.":"L'IMC est un indicateur général utile pour la plupart des adultes, mais il peut être moins fiable pour les sportifs (le muscle pèse plus que la graisse), les femmes enceintes, les enfants et les personnes âgées. Pour une évaluation plus précise, consultez un médecin et ajoutez d'autres mesures comme le tour de taille ou le pourcentage de masse grasse.",
"What is the ideal BMI for adults?":"Quel est l'IMC idéal chez l'adulte ?",
"According to WHO, a BMI between 18.5 and 24.9 is considered ideal for adults. Children and adolescents use separate growth charts that account for age and sex. Some research suggests the optimal range may vary by ethnicity and body composition.":"Selon l'OMS, un IMC entre 18,5 et 24,9 est considéré comme idéal chez l'adulte. Les enfants et les adolescents utilisent des courbes de croissance spécifiques qui tiennent compte de l'âge et du sexe. Certaines études suggèrent que la plage optimale peut varier selon l'origine ethnique et la composition corporelle.",
"How do I calculate BMI in pounds and inches?":"Comment calculer l'IMC en livres et en pouces ?",
"If your weight is in pounds and height in inches, use: BMI = (weight in lbs ÷ height in inches²) × 703. Quick conversion: 1 kg = 2.205 lbs, 1 inch = 2.54 cm. This calculator uses metric units (kg and cm) only.":"Si votre poids est en livres et votre taille en pouces, utilisez : IMC = (poids en lb ÷ taille en pouces²) × 703. Conversion rapide : 1 kg = 2,205 lb, 1 pouce = 2,54 cm. Ce calculateur utilise uniquement les unités métriques (kg et cm).",
"Does BMI differ between men and women?":"L'IMC est-il différent entre hommes et femmes ?",
"The BMI formula is the same for both sexes, but body composition differs. Women typically have a higher fat percentage than men at the same BMI. Some doctors recommend supplementing BMI with waist circumference or waist-to-hip ratio for a more accurate assessment.":"La formule de l'IMC est la même pour les deux sexes, mais la composition corporelle diffère. À IMC égal, les femmes ont généralement un pourcentage de graisse plus élevé que les hommes. Certains médecins recommandent de compléter l'IMC par le tour de taille ou le rapport taille/hanches pour une évaluation plus précise.",
"What are the health risks of high or low BMI?":"Quels sont les risques pour la santé d'un IMC élevé ou faible ?",
"A high BMI (≥30) is linked to increased risk of type 2 diabetes, heart disease, high blood pressure, and some cancers. A low BMI (&lt;18.5) is associated with weakened immunity, osteoporosis, and malnutrition. In both cases, consult a doctor.":"Un IMC élevé (≥ 30) est associé à un risque accru de diabète de type 2, de maladies cardiaques, d'hypertension et de certains cancers. Un IMC faible (&lt; 18,5) est associé à une immunité affaiblie, à l'ostéoporose et à la malnutrition. Dans les deux cas, consultez un médecin.",
"How is BMI calculated — with a worked example?":"Comment calculer l'IMC — avec un exemple détaillé ?",
"BMI formula: weight (kg) ÷ height² (m). Example: a person weighing 75 kg and 175 cm tall: 75 ÷ (1.75 × 1.75) = 75 ÷ 3.0625 ≈ 24.5. This falls in the Normal range (18.5–24.9) per WHO standards.":"Formule de l'IMC : poids (kg) ÷ taille² (m). Exemple : une personne de 75 kg mesurant 175 cm : 75 ÷ (1,75 × 1,75) = 75 ÷ 3,0625 ≈ 24,5. Cela correspond à la plage normale (18,5–24,9) selon les normes de l'OMS.",
"What is the ideal weight for my height?":"Quel est le poids idéal pour ma taille ?",
"Ideal weight = normal BMI range (18.5–24.9) × height² in metres. Example for 170 cm (1.70 m): lower = 18.5 × (1.70²) ≈ 53.5 kg, upper = 24.9 × (1.70²) ≈ 71.9 kg. Any weight between 53.5 and 71.9 kg is ideal for this height.":"Poids idéal = plage d'IMC normale (18,5–24,9) × taille² en mètres. Exemple pour 170 cm (1,70 m) : bas = 18,5 × (1,70²) ≈ 53,5 kg, haut = 24,9 × (1,70²) ≈ 71,9 kg. Tout poids entre 53,5 et 71,9 kg est idéal pour cette taille.",
"Is BMI suitable for children?":"L'IMC convient-il aux enfants ?",
"No. Children and adolescents under 18 use specialised growth charts (BMI-for-age) that account for sex and age. Adult BMI values (18.5–24.9 normal) do not apply to children. Consult a paediatrician for an accurate assessment.":"Non. Les enfants et adolescents de moins de 18 ans utilisent des courbes de croissance spécifiques (IMC pour l'âge) qui tiennent compte du sexe et de l'âge. Les valeurs adultes (18,5–24,9 normal) ne s'appliquent pas aux enfants. Consultez un pédiatre pour une évaluation précise.",
