"❓ Frequently Asked Questions":"❓ Questions fréquentes",
"What is the difference between Hijri and Gregorian calendars?":"Quelle est la différence entre les calendriers hégirien et grégorien ?",
"The Hijri calendar is lunar (based on moon cycles) with 354-355 days per year. The Gregorian calendar is solar with 365-366 days. This is why the Hijri year advances about 11 days each Gregorian year.":"Le calendrier hégirien est lunaire (fondé sur les cycles de la lune) et compte 354–355 jours par an. Le calendrier grégorien est solaire et compte 365–366 jours. C'est pourquoi l'année hégirienne avance d'environ 11 jours chaque année grégorienne.",
"When did the Hijri calendar begin?":"Quand le calendrier hégirien a-t-il commencé ?",
"The Hijri calendar began from the Prophet Muhammad's ﷺ migration (Hijra) from Mecca to Medina, corresponding to July 16, 622 CE.":"Le calendrier hégirien commence avec l'émigration (Hégire) du Prophète Mohammed ﷺ de La Mecque à Médine, correspondant au 16 juillet 622 de l'ère commune.",
"Why might the Hijri date differ by a day?":"Pourquoi la date hégirienne peut-elle différer d'un jour ?",
"Official determination in many countries depends on naked-eye moon sighting, which can cause a one-day difference between countries. This tool uses a tabular Hijri calendar algorithm, which may differ by 1–2 days from the observed calendar.":"Dans de nombreux pays, la détermination officielle dépend de l'observation de la lune à l'œil nu, ce qui peut créer un jour d'écart entre pays. Cet outil utilise un algorithme de calendrier hégirien tabulaire, qui peut différer de 1 à 2 jours du calendrier observé.",
"How do I find today's Hijri date?":"Comment connaître la date hégirienne du jour ?",
"The tool displays the current Hijri date automatically in the \"Today's Hijri Date\" panel as soon as you open the page. No input required.":"L'outil affiche automatiquement la date hégirienne actuelle dans le panneau « Date hégirienne du jour » dès l'ouverture de la page. Aucune saisie n'est nécessaire.",
"What are the Hijri months in order?":"Quels sont les mois hégiriens dans l'ordre ?",
"Muharram, Safar, Rabi al-Awwal, Rabi al-Thani, Jumada al-Awwal, Jumada al-Thani, Rajab, Sha'ban, Ramadan, Shawwal, Dhu al-Qi'dah, Dhu al-Hijjah — 12 lunar months in each Hijri year.":"Mouharram, Safar, Rabi al-Awwal, Rabi al-Thani, Joumada al-Oula, Joumada al-Thania, Rajab, Chaabane, Ramadan, Chawwal, Dhou al-Qi'da, Dhou al-Hijja — 12 mois lunaires par année hégirienne.",
"How do I accurately convert a Gregorian date to Hijri?":"Comment convertir précisément une date grégorienne en date hégirienne ?",
"Use the first tab \"Gregorian → Hijri\" and enter the Gregorian date. The tool uses a tabular Hijri calendar algorithm. Note that the official date in some countries may differ by 1–2 days due to local moon sighting.":"Utilisez le premier onglet « Grégorien → Hégirien » et saisissez la date grégorienne. L'outil utilise un algorithme de calendrier hégirien tabulaire. Notez que la date officielle dans certains pays peut différer de 1 à 2 jours selon l'observation locale de la lune.",
"What are the sacred (Haram) Hijri months?":"Quels sont les mois sacrés (Haram) du calendrier hégirien ?",
"The four sacred months are: Dhu al-Qi'dah, Dhu al-Hijjah, Muharram (three consecutive), and Rajab (separate). They were called sacred because fighting was prohibited in them, a prohibition confirmed by Islam.":"Les quatre mois sacrés sont : Dhou al-Qi'da, Dhou al-Hijja, Mouharram (trois mois consécutifs) et Rajab (isolé). On les appelle sacrés car le combat y était interdit, une interdiction confirmée par l'islam.",
"Does the tool support dates before 1900 CE?":"L'outil prend-il en charge les dates antérieures à 1900 ?",
"Yes, the Hijri year field supports the range 1300-1600 AH (approximately 1882-2174 CE). For dates outside this range, a specialized source is recommended for precise conversion.":"Oui, le champ de l'année hégirienne couvre la période 1300–1600 AH (environ 1882–2174 de l'ère commune). Pour des dates hors de cette plage, il est conseillé de consulter une source spécialisée pour une conversion précise.",

"Hijri Calendar — How the Islamic Calendar Works":"Calendrier hégirien — comment fonctionne le calendrier islamique",
"The Hijri calendar is a":"Le calendrier hégirien est un",
"lunar calendar":"calendrier lunaire",
"with 12 months of 29 or 30 days each, totalling 354-355 days per year — about 11 days shorter than the Gregorian year. This means Islamic dates shift earlier through the Gregorian calendar by approximately 11 days each year. The year 1 Hijri corresponds to the Prophet Muhammad's migration (Hijra) from Mecca to Medina in 622 CE.":"de 12 mois de 29 ou 30 jours, soit 354–355 jours par an — environ 11 jours de moins que l'année grégorienne. Les dates islamiques avancent donc d'environ 11 jours chaque année dans le calendrier grégorien. L'an 1 de l'Hégire correspond à l'émigration du Prophète Mohammed de La Mecque à Médine en 622.",
"The 12 Hijri months":"Les 12 mois hégiriens",
"Muharram, Safar, Rabi' al-Awwal, Rabi' al-Thani, Jumada al-Awwal, Jumada al-Thani, Rajab, Sha'ban, Ramadan, Shawwal, Dhu al-Qi'dah, Dhu al-Hijjah. Ramadan (fasting) and Dhu al-Hijjah (Hajj season) are the two most significant religious months.":"Mouharram, Safar, Rabi' al-Awwal, Rabi' al-Thani, Joumada al-Oula, Joumada al-Thania, Rajab, Chaabane, Ramadan, Chawwal, Dhou al-Qi'da, Dhou al-Hijja. Ramadan (le jeûne) et Dhou al-Hijja (la saison du Hajj) sont les deux mois religieux les plus importants.",
"Tabular vs. observed Hijri dates":"Dates hégiriennes tabulaires ou observées",
"Some countries determine the start of Hijri months by physical moon sighting (Oman, Saudi Arabia, UAE), which can vary by one day from calculated dates. This converter uses a tabular Hijri calendar algorithm — a standard mathematical approximation accurate to within 1–2 days of the observed calendar.":"Certains pays fixent le début des mois hégiriens par l'observation physique de la lune (Oman, Arabie saoudite, Émirats arabes unis), ce qui peut entraîner un jour d'écart avec les dates calculées. Ce convertisseur utilise un algorithme de calendrier hégirien tabulaire — une approximation mathématique standard précise à 1–2 jours près du calendrier observé.",
