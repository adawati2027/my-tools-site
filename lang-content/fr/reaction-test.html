"What is a good reaction time?":"Qu'est-ce qu'un bon temps de réaction ?",
"The average human visual reaction time is around 200-250 milliseconds. Below 200ms is considered fast (top 10%). Elite athletes and gamers typically score 150-180ms. Reaction time naturally increases (slows) with age.":"Le temps de réaction visuel moyen d'un humain est d'environ 200 à 250 millisecondes. Moins de 200 ms est considéré comme rapide (top 10 %). Les athlètes et joueurs de haut niveau obtiennent généralement 150 à 180 ms. Le temps de réaction augmente naturellement (ralentit) avec l'âge.",
"Can I improve my reaction time with practice?":"Peut-on améliorer son temps de réaction en s'entraînant ?",
"Regular practice can shave 10-20ms from your baseline by reducing anticipation errors. True neural reaction time has a biological floor of around 100-120ms — no amount of practice can go below that limit.":"Un entraînement régulier peut faire gagner 10 à 20 ms sur votre temps de base en réduisant les erreurs d'anticipation. Le vrai temps de réaction neuronal a une limite biologique d'environ 100 à 120 ms — aucun entraînement ne permet de descendre en dessous.",
"How the Reaction Test works":"Comment fonctionne le test de réaction",
"Wait for the screen to change colour, then tap or click as fast as you can. The test measures the time between the change and your response in milliseconds. Clicking too early counts as a false start.":"Attendez que l'écran change de couleur, puis touchez ou cliquez le plus vite possible. Le test mesure en millisecondes le temps entre le changement et votre réaction. Cliquer trop tôt compte comme un faux départ.",
"How to get a fair result":"Comment obtenir un résultat fiable",
"Take several attempts and look at your average rather than a single best try. Use the same device each time, sit comfortably and keep your finger resting on the button or screen.":"Faites plusieurs essais et regardez votre moyenne plutôt qu'un seul meilleur essai. Utilisez toujours le même appareil, installez-vous confortablement et gardez le doigt posé sur le bouton ou l'écran.",
"What affects reaction time":"Ce qui influence le temps de réaction",
"Sleep, tiredness, caffeine, age and distractions all change reaction time. Measuring it on different days is a simple way to see how alert you are.":"Le sommeil, la fatigue, la caféine, l'âge et les distractions modifient tous le temps de réaction. Le mesurer à différents jours est un moyen simple de savoir à quel point vous êtes alerte."}-->
