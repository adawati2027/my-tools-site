"❓ Frequently Asked Questions":"❓ Questions fréquentes",
"How does the memory card matching game work?":"Comment fonctionne le jeu de mémoire (paires de cartes) ?",
"Cards are placed face-down. You flip two at a time — if they match, they stay face-up; if not, they flip back. The goal is to match all pairs in as few flips as possible. Tests short-term memory and concentration.":"Les cartes sont posées face cachée. Vous en retournez deux à la fois : si elles sont identiques, elles restent visibles ; sinon, elles se retournent. Le but est de trouver toutes les paires en un minimum de coups. Le jeu entraîne la mémoire à court terme et la concentration.",
"What difficulty levels does the memory game have?":"Quels niveaux de difficulté propose le jeu de mémoire ?",
"There are 6 levels from Easy (fewer cards) to Legendary (many cards with a strict time limit). Higher levels present more cards and less time, making it progressively more challenging for experienced players.":"Il y a 6 niveaux, de Facile (peu de cartes) à Légendaire (beaucoup de cartes avec une limite de temps stricte). Plus le niveau est élevé, plus il y a de cartes et moins de temps, ce qui rend le défi de plus en plus difficile pour les joueurs expérimentés.",
"How to play the Memory Game":"Comment jouer au jeu de mémoire",
"Turn over two cards at a time and try to find matching pairs. Matching cards stay face-up; the rest flip back. Finish the board in as few moves and as little time as possible.":"Retournez deux cartes à la fois et essayez de trouver les paires. Les cartes identiques restent visibles, les autres se retournent. Terminez le plateau en un minimum de coups et de temps.",
"Tips for remembering more cards":"Astuces pour retenir plus de cartes",
"Work systematically from one corner instead of clicking randomly. Say what you see in your head (\"star, top left\"), and when you flip one new card, check whether you have already seen its partner before flipping a second unknown card.":"Procédez méthodiquement depuis un coin au lieu de cliquer au hasard. Nommez mentalement ce que vous voyez (« étoile, en haut à gauche ») et, quand vous retournez une nouvelle carte, vérifiez si vous avez déjà vu sa paire avant de retourner une seconde carte inconnue.",
"Why it is good practice":"Pourquoi c'est un bon entraînement",
"Matching games exercise short-term and visual memory and concentration. They are a gentle brain workout for children and adults alike.":"Les jeux de paires font travailler la mémoire à court terme, la mémoire visuelle et la concentration. C'est un exercice cérébral doux pour les enfants comme pour les adultes."}-->
