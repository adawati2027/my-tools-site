"❓ Frequently Asked Questions":"❓ Preguntas frecuentes",
"Is the QR code suitable for printing?":"¿El código QR sirve para imprimir?",
"Yes — the generated image is 220×220 pixels, suitable for digital displays and small print. For large poster printing, SVG tools are recommended for better quality.":"Sí: la imagen generada mide 220×220 píxeles, adecuada para pantallas e impresiones pequeñas. Para carteles grandes se recomiendan herramientas SVG para obtener mejor calidad.",
"Do I need internet to scan a QR code?":"¿Hace falta Internet para escanear un código QR?",
"Scanning the code with your camera does not need internet. But if the code contains a web link, you will need a connection to open it.":"Escanear el código con la cámara no requiere Internet. Pero si el código contiene un enlace web, necesitarás conexión para abrirlo.",
"How much information can one QR code hold?":"¿Cuánta información cabe en un código QR?",
"The maximum is approximately 4,296 alphanumeric characters. Less text means a clearer code that is easier to scan — short links are recommended.":"El máximo es de unos 4296 caracteres alfanuméricos. Cuanto menos texto, más claro y fácil de escanear será el código; se recomiendan enlaces cortos.",
"Can a QR code expire?":"¿Puede caducar un código QR?",
"A static QR code never expires. But if it links to a web URL that expires or changes, the link will stop working. The code itself remains valid forever.":"Un código QR estático nunca caduca. Pero si enlaza a una URL que caduca o cambia, el enlace dejará de funcionar. El código en sí sigue siendo válido para siempre.",
"How do I link a QR code to a business card?":"¿Cómo vinculo un código QR a una tarjeta de visita?",
"Create a QR code with your LinkedIn page link, website or WhatsApp number in wa.me/+9685XXXXXXX format, then save and print it on your business card.":"Crea un código QR con el enlace a tu LinkedIn, tu web o tu número de WhatsApp en formato wa.me/+9685XXXXXXX, guárdalo e imprímelo en tu tarjeta de visita.",
"What is the difference between a QR code and a barcode?":"¿Qué diferencia hay entre un código QR y un código de barras?",
"A barcode is one-dimensional and holds only ~20 digits. A QR code is two-dimensional and holds thousands of characters. QR codes scan faster and work even when partially damaged.":"Un código de barras es unidimensional y solo almacena unos 20 dígitos. Un código QR es bidimensional y almacena miles de caracteres. Los QR se escanean más rápido y funcionan aunque estén parcialmente dañados.",
"Can I add a logo inside a QR code?":"¿Puedo añadir un logotipo dentro de un código QR?",
"This tool generates codes without a logo. To add a logo, try QR Code Monkey or Canva — but a logo occupies part of the code and may reduce scan reliability.":"Esta herramienta genera códigos sin logotipo. Para añadir uno, prueba QR Code Monkey o Canva, aunque el logotipo ocupa parte del código y puede reducir la fiabilidad del escaneo.",
"What is the best size for printing a QR code?":"¿Cuál es el mejor tamaño para imprimir un código QR?",
"The minimum for clear printing is 2×2 cm. For posters and stickers, 3–5 cm is recommended to ensure easy scanning with all types of cameras.":"El mínimo para una impresión nítida es de 2×2 cm. Para carteles y pegatinas se recomiendan 3-5 cm, para que se escanee fácilmente con cualquier tipo de cámara.",

"QR code size and scanning distance":"Tamaño del código QR y distancia de escaneo",
"For print use, a QR code should be at least 2 cm × 2 cm (roughly 0.8 × 0.8 inches). Scanning distance is approximately 10× the code size — a 3 cm code can be scanned from 30 cm away. Shorter URLs produce simpler codes that scan faster and more reliably.":"Para imprimir, un código QR debe medir al menos 2 × 2 cm. La distancia de escaneo es de unas 10 veces el tamaño del código: un código de 3 cm se puede escanear a 30 cm. Las URL más cortas generan códigos más sencillos que se escanean más rápido y de forma más fiable."}-->
