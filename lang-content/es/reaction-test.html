"❓ Frequently Asked Questions":"❓ Preguntas frecuentes",
"What is a good reaction time?":"¿Qué es un buen tiempo de reacción?",
"The average human visual reaction time is around 200-250 milliseconds. Below 200ms is considered fast (top 10%). Elite athletes and gamers typically score 150-180ms. Reaction time naturally increases (slows) with age.":"El tiempo medio de reacción visual en humanos es de unos 200-250 milisegundos. Por debajo de 200 ms se considera rápido (el 10 % superior). Los deportistas de élite y los jugadores suelen marcar 150-180 ms. El tiempo de reacción aumenta (se vuelve más lento) de forma natural con la edad.",
"Can I improve my reaction time with practice?":"¿Puedo mejorar mi tiempo de reacción practicando?",
"Regular practice can shave 10-20ms from your baseline by reducing anticipation errors. True neural reaction time has a biological floor of around 100-120ms — no amount of practice can go below that limit.":"La práctica regular puede reducir 10-20 ms tu marca base al disminuir los errores de anticipación. El tiempo de reacción neuronal real tiene un límite biológico de unos 100-120 ms: ninguna práctica permite bajar de ahí.",
"How the Reaction Test works":"Cómo funciona la prueba de reacción",
"Wait for the screen to change colour, then tap or click as fast as you can. The test measures the time between the change and your response in milliseconds. Clicking too early counts as a false start.":"Espera a que la pantalla cambie de color y toca o haz clic lo más rápido que puedas. La prueba mide en milisegundos el tiempo entre el cambio y tu respuesta. Pulsar antes de tiempo cuenta como salida en falso.",
"How to get a fair result":"Cómo obtener un resultado fiable",
"Take several attempts and look at your average rather than a single best try. Use the same device each time, sit comfortably and keep your finger resting on the button or screen.":"Haz varios intentos y fíjate en tu media, no en un único mejor intento. Usa siempre el mismo dispositivo, siéntate cómodo y mantén el dedo apoyado en el botón o la pantalla.",
"What affects reaction time":"Qué influye en el tiempo de reacción",
"Sleep, tiredness, caffeine, age and distractions all change reaction time. Measuring it on different days is a simple way to see how alert you are.":"El sueño, el cansancio, la cafeína, la edad y las distracciones cambian el tiempo de reacción. Medirlo en días distintos es una forma sencilla de ver lo despierto que estás."}-->
