"❓ FAQs about VAT":"❓ Preguntas frecuentes sobre el IVA",
"What is VAT (Value Added Tax)?":"¿Qué es el IVA (impuesto sobre el valor añadido)?",
"VAT is an indirect tax applied to most goods and services. It is paid by the end consumer and collected by businesses on behalf of the government.":"El IVA es un impuesto indirecto que se aplica a la mayoría de los bienes y servicios. Lo paga el consumidor final y lo recaudan las empresas en nombre del Estado.",
"How do I calculate 5% VAT on an amount?":"¿Cómo calculo un IVA del 5 % sobre un importe?",
"Multiply the amount by 0.05. Example: 100 × 0.05 = 5 tax. Total = 105.":"Multiplica el importe por 0,05. Ejemplo: 100 × 0,05 = 5 de impuesto. Total = 105.",
"How do I extract VAT from a VAT-inclusive amount?":"¿Cómo extraigo el IVA de un importe con IVA incluido?",
"Divide the inclusive amount by (1 + tax rate). Example: 105 ÷ 1.05 = 100 (before tax). Tax = 5.":"Divide el importe con IVA entre (1 + tipo). Ejemplo: 105 ÷ 1,05 = 100 (sin impuestos). Impuesto = 5.",
"Which goods are VAT-exempt in Oman?":"¿Qué bienes están exentos de IVA en Omán?",
"Some qualifying supplies may be zero-rated or exempt subject to Tax Authority conditions — for example, certain basic foodstuffs, qualifying healthcare/education services, residential rental, and certain financial services. Most goods and services remain subject to the standard 5% rate.":"Algunas entregas pueden tener tipo cero o estar exentas según las condiciones de la Autoridad Tributaria; por ejemplo, ciertos alimentos básicos, servicios sanitarios/educativos que cumplan requisitos, el alquiler residencial y ciertos servicios financieros. La mayoría de los bienes y servicios siguen sujetos al tipo general del 5 %.",
"Why is Saudi Arabia's VAT rate 15% instead of 5%?":"¿Por qué el IVA de Arabia Saudí es del 15 % y no del 5 %?",
"Saudi Arabia raised its VAT from 5% to 15% in July 2020 due to fiscal pressures from COVID-19 and lower oil prices. Oman and UAE have maintained the 5% rate.":"Arabia Saudí subió el IVA del 5 % al 15 % en julio de 2020 por las presiones fiscales derivadas de la COVID-19 y la caída del precio del petróleo. Omán y los EAU han mantenido el 5 %.",
"When must a business register for VAT in Oman?":"¿Cuándo debe registrarse una empresa a efectos de IVA en Omán?",
"Businesses must register when annual turnover exceeds OMR 38,500. Voluntary registration from OMR 19,250. Competent authority: Tax Authority taa.gov.om.":"El registro es obligatorio cuando la facturación anual supera los 38 500 OMR, y voluntario a partir de 19 250 OMR. Autoridad competente: Autoridad Tributaria taa.gov.om.",
"When was VAT introduced in Oman?":"¿Cuándo se introdujo el IVA en Omán?",
"Oman implemented VAT at 5% in April 2021, making it the fourth GCC country to introduce VAT, after the UAE and Saudi Arabia (2018) and Bahrain (2019).":"Omán implantó el IVA al 5 % en abril de 2021 y se convirtió en el cuarto país del CCG en introducirlo, después de los EAU y Arabia Saudí (2018) y Baréin (2019).",
"Are exports zero-rated for VAT in Oman?":"¿Las exportaciones tienen tipo cero de IVA en Omán?",
"Exports from Oman are zero-rated (0% VAT). Exporters do not charge VAT to foreign buyers but can reclaim any input VAT paid locally.":"Las exportaciones desde Omán tienen tipo cero (0 % de IVA). Los exportadores no cobran IVA a los compradores extranjeros, pero pueden recuperar el IVA soportado en el país.",
"How to calculate VAT on a restaurant bill in Oman?":"¿Cómo calculo el IVA de la cuenta de un restaurante en Omán?",
"Prepared food and restaurant meals are subject to 5% VAT in Oman. Example: bill OMR 20 → VAT = 20 × 0.05 = OMR 1 → total = OMR 21. Enter the amount in the calculator above and select Oman 5% for the instant result.":"La comida preparada y las comidas en restaurantes están sujetas a un IVA del 5 % en Omán. Ejemplo: cuenta de 20 OMR → IVA = 20 × 0,05 = 1 OMR → total = 21 OMR. Introduce el importe en la calculadora de arriba y elige Omán 5 % para obtener el resultado al instante.",
"Does VAT apply to salaries and wages in Oman?":"¿Se aplica el IVA a los salarios en Omán?",
"No. Salaries and wages are not subject to VAT in Oman. Employment income is outside the scope of VAT. For salary calculations including SPF deduction, use the":"No. Los salarios no están sujetos al IVA en Omán; las rentas del trabajo quedan fuera de su ámbito. Para calcular el salario con la deducción del SPF, usa la",

"How do I add 5% VAT to a price in Oman?":"¿Cómo añado un 5 % de IVA a un precio en Omán?",

"VAT in Gulf Countries — Rates and Zero-Rated Categories":"El IVA en los países del Golfo — tipos y categorías con tipo cero",
"Value Added Tax (VAT) was introduced across GCC countries at different times. The UAE and Saudi Arabia introduced 5% VAT in January 2018; Saudi Arabia raised its rate to 15% in July 2020. Oman introduced 5% VAT in April 2021. Bahrain introduced 5% in January 2019 (raised to 10% in 2022).":"El impuesto sobre el valor añadido (IVA) se introdujo en los países del CCG en distintas fechas. Los EAU y Arabia Saudí introdujeron un IVA del 5 % en enero de 2018; Arabia Saudí lo subió al 15 % en julio de 2020. Omán introdujo el IVA del 5 % en abril de 2021. Baréin lo introdujo al 5 % en enero de 2019 (y lo subió al 10 % en 2022).",

"Common zero-rated and exempt categories":"Categorías habituales con tipo cero o exentas",
"Certain qualifying food items, healthcare/education services, residential rent, and international exports may be zero-rated (0% VAT) or exempt in GCC countries, subject to specific conditions — these are not blanket category exemptions. Most goods and services remain subject to the standard rate. Always consult the local tax authority for definitive guidance on your specific goods or services.":"Ciertos alimentos, servicios sanitarios/educativos, alquileres residenciales y exportaciones internacionales que cumplan requisitos pueden tener tipo cero (0 % de IVA) o estar exentos en los países del CCG, según condiciones concretas; no son exenciones generales por categoría. La mayoría de los bienes y servicios siguen sujetos al tipo general. Consulta siempre a la autoridad tributaria local para obtener una respuesta definitiva sobre tus bienes o servicios."}-->
