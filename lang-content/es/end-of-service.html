"What is the difference between the new and old system?":"¿Qué diferencia hay entre el sistema nuevo y el anterior?",
"Old system: 15 days for years 1–3, 20 days for years 3–5, 30 days after 5 years (calculated from daily rate = basic÷26). New system (Article 61): minimum is one full month's salary per year with fractions pro-rated. The higher amount applies per the employment contract and applicable system.":"Sistema anterior: 15 días por año en los años 1–3, 20 días en los años 3–5 y 30 días a partir de los 5 años (sobre el salario diario = base ÷ 26). Sistema nuevo (artículo 61): un mínimo de un mes completo de salario por año, con fracciones proporcionales. Se aplica la cantidad mayor según el contrato y el sistema aplicable.",
"Am I entitled to gratuity if I worked less than one year?":"¿Tengo derecho a indemnización si trabajé menos de un año?",
"Under the updated Omani Labor Law (Article 61), fractions of a year are calculated proportionally. An employee who completed 6 months is entitled to 0.5 months' salary.":"Según la Ley del Trabajo de Omán actualizada (artículo 61), las fracciones de año se calculan de forma proporcional. Un empleado que ha completado 6 meses tiene derecho a 0,5 meses de salario.",
"Is an expatriate entitled to end of service gratuity?":"¿Tiene derecho un expatriado a la indemnización por fin de servicio?",
"Yes. Oman's Labor Law applies to both Omani nationals and expatriates. Expatriate employees are entitled to end of service gratuity under the stated provisions, and also have an SPF savings program funded by the employer.":"Sí. La Ley del Trabajo de Omán se aplica tanto a omaníes como a expatriados. Los empleados expatriados tienen derecho a la indemnización según las disposiciones indicadas y, además, cuentan con un programa de ahorro del SPF financiado por el empleador.",
"Are allowances included in the gratuity calculation?":"¿Se incluyen los subsidios en el cálculo de la indemnización?",
"Under labor law, gratuity is calculated on basic salary only. Some companies include allowances in the individual contract and use them in the calculation — check your contract to confirm.":"Según la Ley del Trabajo, la indemnización se calcula solo sobre el salario base. Algunas empresas incluyen subsidios en el contrato individual y los usan en el cálculo: revisa tu contrato para confirmarlo.",
"What is the difference in end of service between Omani nationals and expatriates?":"¿Qué diferencia hay en el fin de servicio entre omaníes y expatriados?",
"For Omanis: end of service is managed through the SPF savings program with employer contributions of 11.5% monthly. For expatriates: calculated under Article 61 (minimum one month's salary per year of service).":"Para los omaníes, el fin de servicio se gestiona mediante el programa de ahorro del SPF, con aportaciones del empleador del 11,5 % mensual. Para los expatriados, se calcula según el artículo 61 (al menos un mes de salario por año de servicio).",
"When must end of service gratuity be paid?":"¿Cuándo debe pagarse la indemnización por fin de servicio?",
"Under Article 91 of Oman's Labor Law, the employer must pay the employee's wages and all entitlements upon termination of employment. If the employee leaves voluntarily, entitlements must be paid within 7 days of the leaving date. In case of delay, the employee can file a complaint with the Ministry of Labour.":"Según el artículo 91 de la Ley del Trabajo de Omán, el empleador debe pagar al trabajador su salario y todos sus derechos al finalizar la relación laboral. Si el trabajador se va voluntariamente, los derechos deben pagarse en los 7 días siguientes a la fecha de salida. En caso de retraso, el trabajador puede presentar una queja ante el Ministerio de Trabajo.",
"Is gratuity paid in case of resignation?":"¿Se paga la indemnización en caso de dimisión?",
"Entitlements differ based on the reason for termination, the applicable legal system, and the employment contract. Specific circumstances may affect the entitlement. Check your contract and consult a specialist lawyer to confirm.":"Los derechos varían según el motivo del fin de la relación laboral, el sistema jurídico aplicable y el contrato de trabajo. Ciertas circunstancias pueden afectar al derecho. Revisa tu contrato y consulta a un abogado especializado.",
"What is the minimum service period to claim gratuity?":"¿Cuál es el periodo mínimo de servicio para reclamar la indemnización?",
"End of service gratuity is calculated per the provisions applicable to the employee, their contract, and the prevailing legal system. Do not use the 3-year rule as a general rule; entitlements may differ based on the termination reason and applicable system.":"La indemnización se calcula según las disposiciones aplicables al trabajador, su contrato y el sistema jurídico vigente. No apliques la regla de los 3 años como norma general; los derechos pueden variar según el motivo de la salida y el sistema aplicable.",
"Am I entitled to full gratuity if I resign?":"¿Tengo derecho a la indemnización completa si dimito?",
"Under the updated Article 61, gratuity is calculated proportionally for each year of service whether termination is employee- or employer-initiated. In case of disciplinary dismissal under Article 40, gratuity may be forfeited in whole or in part. Consult a specialist lawyer for your specific situation.":"Según el artículo 61 actualizado, la indemnización se calcula de forma proporcional por cada año de servicio, tanto si la relación termina a iniciativa del trabajador como del empleador. En caso de despido disciplinario según el artículo 40, la indemnización puede perderse total o parcialmente. Consulta a un abogado especializado sobre tu caso.",
