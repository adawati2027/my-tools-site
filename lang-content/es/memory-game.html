"❓ Frequently Asked Questions":"❓ Preguntas frecuentes",
"How does the memory card matching game work?":"¿Cómo funciona el juego de memoria de parejas?",
"Cards are placed face-down. You flip two at a time — if they match, they stay face-up; if not, they flip back. The goal is to match all pairs in as few flips as possible. Tests short-term memory and concentration.":"Las cartas se colocan boca abajo. Das la vuelta a dos cada vez: si coinciden, se quedan boca arriba; si no, vuelven a girarse. El objetivo es encontrar todas las parejas con el menor número de intentos. Pone a prueba la memoria a corto plazo y la concentración.",
"What difficulty levels does the memory game have?":"¿Qué niveles de dificultad tiene el juego de memoria?",
"There are 6 levels from Easy (fewer cards) to Legendary (many cards with a strict time limit). Higher levels present more cards and less time, making it progressively more challenging for experienced players.":"Hay 6 niveles, desde Fácil (pocas cartas) hasta Legendario (muchas cartas con un límite de tiempo estricto). Los niveles más altos tienen más cartas y menos tiempo, por lo que el reto aumenta progresivamente para los jugadores con experiencia.",
"How to play the Memory Game":"Cómo jugar al juego de memoria",
"Turn over two cards at a time and try to find matching pairs. Matching cards stay face-up; the rest flip back. Finish the board in as few moves and as little time as possible.":"Da la vuelta a dos cartas cada vez e intenta encontrar las parejas. Las que coinciden quedan boca arriba; las demás vuelven a girarse. Termina el tablero con el menor número de movimientos y en el menor tiempo posible.",
"Tips for remembering more cards":"Consejos para recordar más cartas",
"Work systematically from one corner instead of clicking randomly. Say what you see in your head (\"star, top left\"), and when you flip one new card, check whether you have already seen its partner before flipping a second unknown card.":"Avanza de forma ordenada desde una esquina en lugar de pulsar al azar. Di mentalmente lo que ves («estrella, arriba a la izquierda») y, al girar una carta nueva, comprueba si ya has visto su pareja antes de girar otra desconocida.",
"Why it is good practice":"Por qué es un buen ejercicio",
"Matching games exercise short-term and visual memory and concentration. They are a gentle brain workout for children and adults alike.":"Los juegos de parejas ejercitan la memoria a corto plazo, la memoria visual y la concentración. Son un ejercicio mental suave tanto para niños como para adultos."}-->
