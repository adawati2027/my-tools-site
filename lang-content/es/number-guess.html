"How do I play the number guessing game?":"¿Cómo se juega a adivinar el número?",
"The game picks a secret number within a range. You enter a guess and the game tells you whether the secret number is higher or lower. Keep guessing until you find it in as few tries as possible. Higher difficulty levels use larger number ranges.":"El juego elige un número secreto dentro de un rango. Escribes un intento y el juego te dice si el número secreto es mayor o menor. Sigue intentándolo hasta encontrarlo con el menor número de intentos posible. Los niveles más difíciles usan rangos más amplios.",
"What are the difficulty levels in the number guessing game?":"¿Qué niveles de dificultad tiene el juego de adivinar el número?",
"There are 6 levels: Easy (1–10), Medium (1–50), Hard (1–100), Expert (1–500), Master (1–1000), and Legendary (1–5000). Each level requires more strategic guessing to narrow down the answer.":"Hay 6 niveles: Fácil (1–10), Medio (1–50), Difícil (1–100), Experto (1–500), Maestro (1–1000) y Legendario (1–5000). Cada nivel exige una estrategia más afinada para acotar la respuesta.",
"How to play Number Guess":"Cómo jugar a adivinar el número",
"The game picks a secret number in a range. After each guess it tells you whether the secret number is higher or lower, until you find it.":"El juego elige un número secreto dentro de un rango. Tras cada intento te dice si el número secreto es mayor o menor, hasta que lo encuentres.",
"The fastest strategy":"La estrategia más rápida",
"Always guess the middle of the remaining range. In 1–100 that means starting with 50, then 25 or 75, and so on. Halving the range each time finds any number from 1 to 100 in at most 7 guesses.":"Di siempre el número central del rango que queda. Entre 1 y 100, empieza por 50, luego 25 o 75, y así sucesivamente. Partiendo el rango por la mitad cada vez, encuentras cualquier número del 1 al 100 en 7 intentos como máximo.",
"Why it is good practice":"Por qué es un buen ejercicio",
"The game teaches logical thinking and the idea behind binary search — the same method computers use to find items quickly in sorted lists.":"El juego enseña razonamiento lógico y la idea de la búsqueda binaria, el mismo método que usan los ordenadores para encontrar rápidamente elementos en listas ordenadas."}-->
