"What is BMI (Body Mass Index)?":"¿Qué es el IMC (índice de masa corporal)?",
"Body Mass Index (BMI) is a simple measurement used to estimate body fat based on weight and height. Devised by the statistician Adolphe Quetelet in the 19th century and adopted by the World Health Organization (WHO) for its weight classification, it is the most widely used tool globally for screening healthy weight.":"El índice de masa corporal (IMC) es una medida sencilla que sirve para estimar la grasa corporal a partir del peso y la altura. Lo ideó el estadístico Adolphe Quetelet en el siglo XIX y la Organización Mundial de la Salud (OMS) lo adoptó para su clasificación del peso; es la herramienta más usada del mundo para evaluar si el peso es saludable.",
"BMI is calculated by dividing weight in kilograms by the square of height in meters. The result is classified into four categories: underweight, normal weight, overweight, and obese.":"El IMC se calcula dividiendo el peso en kilogramos entre el cuadrado de la altura en metros. El resultado se clasifica en cuatro categorías: bajo peso, peso normal, sobrepeso y obesidad.",
"Note that BMI does not differentiate between fat and muscle, so it may not accurately reflect the situation of athletes, children, or the elderly. Use it as a general indicator, not a medical diagnosis.":"Ten en cuenta que el IMC no distingue entre grasa y músculo, por lo que puede no reflejar bien la situación de deportistas, niños o personas mayores. Úsalo como indicador general, no como diagnóstico médico.",
"How is BMI calculated?":"¿Cómo se calcula el IMC?",
"The mathematical formula for calculating BMI is:":"La fórmula matemática del IMC es:",
"BMI = Weight (kg) ÷ Height² (m)":"IMC = Peso (kg) ÷ Altura² (m)",
"Example: A person weighing 75 kg and 175 cm tall (1.75 m):":"Ejemplo: una persona de 75 kg y 175 cm de altura (1,75 m):",
"BMI = 75 ÷ (1.75 × 1.75) = 75 ÷ 3.0625 ≈ 24.5":"IMC = 75 ÷ (1,75 × 1,75) = 75 ÷ 3,0625 ≈ 24,5",
"The result 24.5 falls in the normal range (18.5 – 24.9). If using pounds and inches: BMI = (weight in lbs ÷ height in inches²) × 703":"El resultado, 24,5, está en el rango normal (18,5 – 24,9). Con libras y pulgadas: IMC = (peso en lb ÷ altura en pulgadas²) × 703",
"Frequently Asked Questions about BMI":"Preguntas frecuentes sobre el IMC",
"Is BMI accurate for everyone?":"¿Es preciso el IMC para todo el mundo?",
"BMI is a useful general indicator for most adults, but may be less accurate for athletes (muscle weighs more than fat), pregnant women, children, and older adults. For a more accurate assessment, consult a doctor and consider additional measurements like waist circumference or body fat percentage.":"El IMC es un indicador general útil para la mayoría de los adultos, pero puede ser menos preciso en deportistas (el músculo pesa más que la grasa), embarazadas, niños y personas mayores. Para una valoración más exacta, consulta a un médico y considera otras medidas como el perímetro de cintura o el porcentaje de grasa corporal.",
"What is the ideal BMI for adults?":"¿Cuál es el IMC ideal en adultos?",
"According to WHO, a BMI between 18.5 and 24.9 is considered ideal for adults. Children and adolescents use separate growth charts that account for age and sex. Some research suggests the optimal range may vary by ethnicity and body composition.":"Según la OMS, un IMC entre 18,5 y 24,9 se considera ideal en adultos. Los niños y adolescentes usan tablas de crecimiento propias que tienen en cuenta la edad y el sexo. Algunas investigaciones sugieren que el rango óptimo puede variar según la etnia y la composición corporal.",
"How do I calculate BMI in pounds and inches?":"¿Cómo calculo el IMC en libras y pulgadas?",
"If your weight is in pounds and height in inches, use: BMI = (weight in lbs ÷ height in inches²) × 703. Quick conversion: 1 kg = 2.205 lbs, 1 inch = 2.54 cm. This calculator uses metric units (kg and cm) only.":"Si tu peso está en libras y tu altura en pulgadas, usa: IMC = (peso en lb ÷ altura en pulgadas²) × 703. Conversión rápida: 1 kg = 2,205 lb, 1 pulgada = 2,54 cm. Esta calculadora solo usa unidades métricas (kg y cm).",
"Does BMI differ between men and women?":"¿El IMC es distinto en hombres y mujeres?",
"The BMI formula is the same for both sexes, but body composition differs. Women typically have a higher fat percentage than men at the same BMI. Some doctors recommend supplementing BMI with waist circumference or waist-to-hip ratio for a more accurate assessment.":"La fórmula del IMC es la misma para ambos sexos, pero la composición corporal es diferente. Con el mismo IMC, las mujeres suelen tener un porcentaje de grasa mayor que los hombres. Algunos médicos recomiendan complementar el IMC con el perímetro de cintura o el índice cintura-cadera para una valoración más precisa.",
"What are the health risks of high or low BMI?":"¿Qué riesgos para la salud tiene un IMC alto o bajo?",
"A high BMI (≥30) is linked to increased risk of type 2 diabetes, heart disease, high blood pressure, and some cancers. A low BMI (&lt;18.5) is associated with weakened immunity, osteoporosis, and malnutrition. In both cases, consult a doctor.":"Un IMC alto (≥30) se asocia a mayor riesgo de diabetes tipo 2, enfermedades cardíacas, hipertensión y algunos tipos de cáncer. Un IMC bajo (&lt;18,5) se asocia a defensas debilitadas, osteoporosis y desnutrición. En ambos casos, consulta a un médico.",
"How is BMI calculated — with a worked example?":"¿Cómo se calcula el IMC? Ejemplo práctico",
"BMI formula: weight (kg) ÷ height² (m). Example: a person weighing 75 kg and 175 cm tall: 75 ÷ (1.75 × 1.75) = 75 ÷ 3.0625 ≈ 24.5. This falls in the Normal range (18.5–24.9) per WHO standards.":"Fórmula del IMC: peso (kg) ÷ altura² (m). Ejemplo: una persona de 75 kg y 175 cm: 75 ÷ (1,75 × 1,75) = 75 ÷ 3,0625 ≈ 24,5. Está en el rango normal (18,5–24,9) según los criterios de la OMS.",
"What is the ideal weight for my height?":"¿Cuál es el peso ideal para mi altura?",
"Ideal weight = normal BMI range (18.5–24.9) × height² in metres. Example for 170 cm (1.70 m): lower = 18.5 × (1.70²) ≈ 53.5 kg, upper = 24.9 × (1.70²) ≈ 71.9 kg. Any weight between 53.5 and 71.9 kg is ideal for this height.":"Peso ideal = rango de IMC normal (18,5–24,9) × altura² en metros. Ejemplo para 170 cm (1,70 m): mínimo = 18,5 × (1,70²) ≈ 53,5 kg, máximo = 24,9 × (1,70²) ≈ 71,9 kg. Cualquier peso entre 53,5 y 71,9 kg es ideal para esa altura.",
"Is BMI suitable for children?":"¿Sirve el IMC para niños?",
"No. Children and adolescents under 18 use specialised growth charts (BMI-for-age) that account for sex and age. Adult BMI values (18.5–24.9 normal) do not apply to children. Consult a paediatrician for an accurate assessment.":"No. Los niños y adolescentes menores de 18 años usan tablas de crecimiento específicas (IMC para la edad) que tienen en cuenta el sexo y la edad. Los valores de IMC de adultos (18,5–24,9 normal) no se aplican a los niños. Consulta a un pediatra para una valoración precisa.",
