"❓ Frequently Asked Questions":"❓ Preguntas frecuentes",
"What is the difference between Hijri and Gregorian calendars?":"¿Qué diferencia hay entre el calendario hégira y el gregoriano?",
"The Hijri calendar is lunar (based on moon cycles) with 354-355 days per year. The Gregorian calendar is solar with 365-366 days. This is why the Hijri year advances about 11 days each Gregorian year.":"El calendario hégira es lunar (basado en los ciclos de la luna) y tiene 354-355 días al año. El gregoriano es solar y tiene 365-366 días. Por eso el año hégira avanza unos 11 días cada año gregoriano.",
"When did the Hijri calendar begin?":"¿Cuándo empezó el calendario hégira?",
"The Hijri calendar began from the Prophet Muhammad's ﷺ migration (Hijra) from Mecca to Medina, corresponding to July 16, 622 CE.":"El calendario hégira comienza con la emigración (Hégira) del Profeta Mahoma ﷺ de La Meca a Medina, que corresponde al 16 de julio del 622 d. C.",
"Why might the Hijri date differ by a day?":"¿Por qué la fecha hégira puede variar un día?",
"Official determination in many countries depends on naked-eye moon sighting, which can cause a one-day difference between countries. This tool uses a tabular Hijri calendar algorithm, which may differ by 1–2 days from the observed calendar.":"En muchos países la fecha oficial depende del avistamiento de la luna a simple vista, lo que puede provocar un día de diferencia entre países. Esta herramienta usa un algoritmo de calendario hégira tabular, que puede diferir 1-2 días del calendario observado.",
"How do I find today's Hijri date?":"¿Cómo sé la fecha hégira de hoy?",
"The tool displays the current Hijri date automatically in the \"Today's Hijri Date\" panel as soon as you open the page. No input required.":"La herramienta muestra automáticamente la fecha hégira actual en el panel «Fecha hégira de hoy» nada más abrir la página. No hace falta introducir nada.",
"What are the Hijri months in order?":"¿Cuáles son los meses de la hégira en orden?",
"Muharram, Safar, Rabi al-Awwal, Rabi al-Thani, Jumada al-Awwal, Jumada al-Thani, Rajab, Sha'ban, Ramadan, Shawwal, Dhu al-Qi'dah, Dhu al-Hijjah — 12 lunar months in each Hijri year.":"Muharram, Safar, Rabi al-Awwal, Rabi al-Thani, Yumada al-Awwal, Yumada al-Thani, Rayab, Shaabán, Ramadán, Shawwal, Dhu al-Qa'da y Dhu al-Hiyya: 12 meses lunares en cada año hégira.",
"How do I accurately convert a Gregorian date to Hijri?":"¿Cómo convierto con precisión una fecha gregoriana a hégira?",
"Use the first tab \"Gregorian → Hijri\" and enter the Gregorian date. The tool uses a tabular Hijri calendar algorithm. Note that the official date in some countries may differ by 1–2 days due to local moon sighting.":"Usa la primera pestaña «Gregoriano → Hégira» e introduce la fecha gregoriana. La herramienta usa un algoritmo de calendario hégira tabular. Ten en cuenta que la fecha oficial en algunos países puede diferir 1-2 días por el avistamiento local de la luna.",
"What are the sacred (Haram) Hijri months?":"¿Cuáles son los meses sagrados (Haram) de la hégira?",
"The four sacred months are: Dhu al-Qi'dah, Dhu al-Hijjah, Muharram (three consecutive), and Rajab (separate). They were called sacred because fighting was prohibited in them, a prohibition confirmed by Islam.":"Los cuatro meses sagrados son Dhu al-Qa'da, Dhu al-Hiyya, Muharram (tres seguidos) y Rayab (aparte). Se llamaron sagrados porque en ellos estaba prohibido combatir, una prohibición que confirmó el islam.",
"Does the tool support dates before 1900 CE?":"¿Admite la herramienta fechas anteriores a 1900?",
"Yes, the Hijri year field supports the range 1300-1600 AH (approximately 1882-2174 CE). For dates outside this range, a specialized source is recommended for precise conversion.":"Sí, el campo del año hégira abarca el rango 1300-1600 H (aproximadamente 1882-2174 d. C.). Para fechas fuera de ese rango, se recomienda una fuente especializada para una conversión precisa.",

"Hijri Calendar — How the Islamic Calendar Works":"Calendario hégira — cómo funciona el calendario islámico",
"The Hijri calendar is a":"El calendario hégira es un",
"lunar calendar":"calendario lunar",
"with 12 months of 29 or 30 days each, totalling 354-355 days per year — about 11 days shorter than the Gregorian year. This means Islamic dates shift earlier through the Gregorian calendar by approximately 11 days each year. The year 1 Hijri corresponds to the Prophet Muhammad's migration (Hijra) from Mecca to Medina in 622 CE.":"de 12 meses de 29 o 30 días cada uno, que suman 354-355 días al año, unos 11 días menos que el año gregoriano. Por eso las fechas islámicas se adelantan unos 11 días cada año en el calendario gregoriano. El año 1 de la Hégira corresponde a la emigración del Profeta Mahoma de La Meca a Medina en el 622 d. C.",
"The 12 Hijri months":"Los 12 meses de la hégira",
"Muharram, Safar, Rabi' al-Awwal, Rabi' al-Thani, Jumada al-Awwal, Jumada al-Thani, Rajab, Sha'ban, Ramadan, Shawwal, Dhu al-Qi'dah, Dhu al-Hijjah. Ramadan (fasting) and Dhu al-Hijjah (Hajj season) are the two most significant religious months.":"Muharram, Safar, Rabi' al-Awwal, Rabi' al-Thani, Yumada al-Awwal, Yumada al-Thani, Rayab, Shaabán, Ramadán, Shawwal, Dhu al-Qa'da, Dhu al-Hiyya. Ramadán (el ayuno) y Dhu al-Hiyya (la temporada del Hach) son los dos meses religiosos más importantes.",
"Tabular vs. observed Hijri dates":"Fechas hégira tabulares frente a observadas",
"Some countries determine the start of Hijri months by physical moon sighting (Oman, Saudi Arabia, UAE), which can vary by one day from calculated dates. This converter uses a tabular Hijri calendar algorithm — a standard mathematical approximation accurate to within 1–2 days of the observed calendar.":"Algunos países fijan el inicio de los meses hégira mediante el avistamiento físico de la luna (Omán, Arabia Saudí, Emiratos Árabes Unidos), lo que puede variar un día respecto a las fechas calculadas. Este conversor usa un algoritmo de calendario hégira tabular, una aproximación matemática estándar con un margen de 1-2 días respecto al calendario observado.",
