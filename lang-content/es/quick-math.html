"How does the Quick Math challenge work?":"¿Cómo funciona el reto de cálculo rápido?",
"You are given arithmetic questions — addition, subtraction, multiplication, division — and must answer before the timer runs out. 100 levels progress from simple sums to complex calculations. Each correct answer earns points and advances your level.":"Recibes operaciones —sumas, restas, multiplicaciones y divisiones— y debes responder antes de que se acabe el tiempo. Los 100 niveles van de sumas sencillas a cálculos complejos. Cada respuesta correcta suma puntos y te hace avanzar de nivel.",
"Does practicing mental arithmetic actually improve math skills?":"¿Practicar cálculo mental mejora realmente las habilidades matemáticas?",
"Yes. Timed mental math practice improves calculation speed and recall of number facts. The pressure of a timer forces your brain to access arithmetic knowledge faster, a technique used in educational programs worldwide.":"Sí. Practicar cálculo mental con tiempo mejora la velocidad de cálculo y el recuerdo de los resultados numéricos. La presión del cronómetro obliga al cerebro a acceder más rápido a sus conocimientos aritméticos, una técnica usada en programas educativos de todo el mundo.",
