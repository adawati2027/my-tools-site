"What is the difference between basic and gross salary?":"¿Qué diferencia hay entre salario base y salario bruto?",
"Basic salary is the fixed amount specified in the employment contract. Gross = Basic + all allowances (housing, transport, etc.).":"El salario base es la cantidad fija indicada en el contrato de trabajo. Bruto = base + todos los subsidios (vivienda, transporte, etc.).",
"Is SPF deducted from allowances?":"¿Se descuenta el SPF de los subsidios?",
"SPF is calculated on the contributory wage per SPF rules (cap OMR 3,000 for the basic branch) — this calculator uses basic salary as a simplified input; actual amounts may differ.":"El SPF se calcula sobre el salario cotizable según las normas del SPF (tope de 3000 OMR en la rama básica); esta calculadora usa el salario base como dato simplificado y las cantidades reales pueden variar.",
"What is the minimum wage in Oman?":"¿Cuál es el salario mínimo en Omán?",
"The minimum wage for Omani nationals is OMR 325 per month (per the latest decree). Check the Ministry of Labour for official updates.":"El salario mínimo para los ciudadanos omaníes es de 325 OMR al mes (según el último decreto). Consulta al Ministerio de Trabajo para conocer las actualizaciones oficiales.",
"How do I estimate my SPF deduction?":"¿Cómo estimo mi deducción SPF?",
"This calculator uses basic salary for a simplified 8% estimate. The official calculation depends on the contributory wage per SPF rules. Estimate: deduction ≈ Basic × 8% (cap OMR 3,000 for basic branch).":"Esta calculadora usa el salario base para una estimación simplificada del 8 %. El cálculo oficial depende del salario cotizable según las normas del SPF. Estimación: deducción ≈ base × 8 % (tope de 3000 OMR en la rama básica).",
"Does SPF deduction apply to expatriates?":"¿Se aplica la deducción SPF a los expatriados?",
"No, the 8% deduction does not apply to expatriate employees. Expatriates have a separate savings system funded by the employer. Expat net salary = gross with no deductions.":"No, la deducción del 8 % no se aplica a los empleados expatriados. Estos tienen un sistema de ahorro aparte financiado por el empleador. Neto del expatriado = bruto sin deducciones.",
"What does the SPF social protection system cover?":"¿Qué cubre el sistema de protección social SPF?",
"SPF covers several insurance branches including: old age, disability and death; employment security; work injuries and occupational diseases; sick and emergency leave; and maternity leave. For updated details visit spf.gov.om.":"El SPF cubre varias ramas de seguro, entre ellas: vejez, invalidez y fallecimiento; seguridad en el empleo; accidentes laborales y enfermedades profesionales; bajas por enfermedad y emergencia; y baja por maternidad. Para datos actualizados visita spf.gov.om.",
"Is there income tax on salaries in Oman?":"¿Hay impuesto sobre la renta en los salarios de Omán?",
"As of 2026, no personal income tax applies to salaries in Oman. However, the Personal Income Tax (PIT) law was issued in 2025 and will begin applying from 2028 under specific conditions. Currently, the only deduction for Omani employees is SPF at 8%.":"En 2026 no se aplica ningún impuesto sobre la renta personal a los salarios en Omán. Sin embargo, la ley del impuesto sobre la renta de las personas físicas (PIT) se promulgó en 2025 y empezará a aplicarse a partir de 2028 en determinadas condiciones. Actualmente, la única deducción para los empleados omaníes es el SPF del 8 %.",
"What is the difference between PASI and SPF in Oman?":"¿Qué diferencia hay entre PASI y SPF en Omán?",
"PASI (Public Authority for Social Insurance) was the old name of the supervising body. It was merged into the new Social Protection Fund (SPF) which now consolidates all social protection branches in Oman.":"PASI (Autoridad Pública de Seguros Sociales) era el antiguo nombre del organismo supervisor. Se integró en el nuevo Fondo de Protección Social (SPF), que ahora reúne todas las ramas de protección social de Omán.",
"What is the employer SPF contribution rate in Oman?":"¿Cuál es la aportación SPF del empleador en Omán?",
"For Omani employees, the employer contributes a combined 14.5% of the contributory wage across active SPF branches (11% for old age/disability/death, with the remaining ~3.5% spread across work injuries, employment security, and maternity/sick leave branches). The employee contributes 8% (7.5% old age/disability/death + 0.5% employment security). Combined total = 22.5% of contributory wage. Rates can change — verify current figures at spf.gov.om.":"Para los empleados omaníes, el empleador aporta en total el 14,5 % del salario cotizable entre las ramas activas del SPF (11 % para vejez/invalidez/fallecimiento y el ~3,5 % restante repartido entre accidentes laborales, seguridad en el empleo y bajas por maternidad/enfermedad). El empleado aporta el 8 % (7,5 % vejez/invalidez/fallecimiento + 0,5 % seguridad en el empleo). Total combinado = 22,5 % del salario cotizable. Los porcentajes pueden cambiar: comprueba las cifras actuales en spf.gov.om.",
"How is overtime calculated in Oman?":"¿Cómo se calculan las horas extra en Omán?",
"Under the Oman Labour Law, overtime on regular weekdays is paid at 125% of the normal hourly rate. Work on weekly rest days or public holidays is paid at 150%. The overtime base is calculated from basic salary only.":"Según la Ley del Trabajo de Omán, las horas extra en días laborables se pagan al 125 % de la tarifa horaria normal. El trabajo en días de descanso semanal o festivos se paga al 150 %. La base de las horas extra se calcula solo sobre el salario base.",
