"Is the stopwatch accurate?":"¿Es preciso el cronómetro?",
"Yes — the stopwatch uses":"Sí: el cronómetro usa",
"with updates every 10 milliseconds, providing centisecond accuracy suitable for everyday and sports use.":"con actualizaciones cada 10 milisegundos, lo que ofrece una precisión de centésimas de segundo adecuada para el uso diario y deportivo.",
"Can I record lap times?":"¿Puedo registrar tiempos por vuelta?",
"Yes — in stopwatch mode, press \"Lap\" while running to record the current lap time while the main clock keeps going. Multiple consecutive laps can be recorded.":"Sí: en modo cronómetro, pulsa «Vuelta» mientras corre para registrar el tiempo de la vuelta actual mientras el reloj principal sigue. Puedes registrar varias vueltas seguidas.",
"How does the countdown timer work?":"¿Cómo funciona el temporizador de cuenta atrás?",
"Set the number of minutes and seconds then press \"Start\". The timer counts down to zero and plays an alert sound when it finishes.":"Ajusta los minutos y segundos y pulsa «Iniciar». El temporizador cuenta hacia atrás hasta cero y emite un sonido de aviso al terminar.",
"Does it work offline?":"¿Funciona sin conexión?",
"Yes — the stopwatch and timer run entirely in the browser and need no internet connection.":"Sí: el cronómetro y el temporizador funcionan por completo en el navegador y no necesitan conexión a Internet.",

"Stopwatch & Timer — Productivity Techniques":"Cronómetro y temporizador — técnicas de productividad",
"A stopwatch measures elapsed time forward; a countdown timer counts down to zero. Both are essential for timed study sessions, interval training, cooking, and professional presentations. This tool runs entirely in your browser with no setup required.":"Un cronómetro mide el tiempo transcurrido; un temporizador cuenta hacia atrás hasta cero. Ambos son esenciales para sesiones de estudio cronometradas, entrenamiento por intervalos, cocina y presentaciones profesionales. Esta herramienta funciona por completo en tu navegador, sin configuración.",
"The Pomodoro Technique":"La técnica Pomodoro",
"Set the timer to 25 minutes and work on a single task without interruption. When it rings, take a 5-minute break. After 4 cycles, take a longer 15-30 minute break. This rhythm reduces mental fatigue and improves sustained focus — popular among students and remote workers worldwide.":"Pon el temporizador en 25 minutos y trabaja en una sola tarea sin interrupciones. Cuando suene, descansa 5 minutos. Tras 4 ciclos, haz un descanso más largo de 15 a 30 minutos. Este ritmo reduce la fatiga mental y mejora la concentración sostenida; es muy popular entre estudiantes y teletrabajadores de todo el mundo.",
"Using lap times for interval training":"Usar tiempos por vuelta en entrenamiento por intervalos",
