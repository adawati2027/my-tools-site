"How does the loan calculator work?":"¿Cómo funciona la calculadora de préstamos?",
"This calculator uses the equal installment (amortization) formula used by most banks. The monthly payment stays fixed throughout the loan term, but the split between principal and interest changes each month.":"Esta calculadora usa la fórmula de cuotas iguales (amortización) que aplican la mayoría de los bancos. La cuota mensual se mantiene fija durante todo el préstamo, pero el reparto entre capital e intereses cambia cada mes.",
"Early on, most of each payment goes to interest. Over time, the principal portion grows and interest shrinks. The full amortization schedule shows this month by month.":"Al principio, la mayor parte de cada cuota va a intereses. Con el tiempo, la parte de capital crece y la de intereses disminuye. El cuadro de amortización completo lo muestra mes a mes.",
"Formula: Payment = Principal × (r × (1+r)ⁿ) / ((1+r)ⁿ − 1) where r = monthly rate, n = number of months. At 0% interest, the amount is divided equally over all months.":"Fórmula: Cuota = Capital × (r × (1+r)ⁿ) / ((1+r)ⁿ − 1), donde r = tipo mensual y n = número de meses. Con un interés del 0 %, el importe se reparte a partes iguales entre todos los meses.",

"Frequently Asked Questions about Loans":"Preguntas frecuentes sobre préstamos",
"What is the difference between simple and compound interest?":"¿Qué diferencia hay entre interés simple y compuesto?",
"Simple interest is calculated on the original principal only. Compound interest is calculated on the principal plus accumulated interest. Most personal and mortgage loans use amortization, which applies interest to the remaining balance each month.":"El interés simple se calcula solo sobre el capital inicial. El compuesto se calcula sobre el capital más los intereses acumulados. La mayoría de los préstamos personales e hipotecarios son amortizables: el interés se aplica cada mes al saldo pendiente.",
"How can I reduce total interest paid?":"¿Cómo puedo reducir el total de intereses?",
"Three ways: (1) Shorten the loan term — lower total interest despite a higher monthly payment. (2) Make extra principal payments. (3) Get a lower interest rate by comparing bank offers.":"De tres formas: (1) acortar el plazo, con menos intereses totales aunque la cuota sea mayor; (2) hacer amortizaciones anticipadas de capital; (3) conseguir un tipo más bajo comparando ofertas de bancos.",
"Does the calculator include insurance and admin fees?":"¿Incluye la calculadora seguros y comisiones?",
"No, it calculates the base payment only. Banks may add life insurance premiums, administrative fees, and origination charges. Contact your bank for the full payment amount.":"No, calcula solo la cuota base. Los bancos pueden añadir seguros de vida, gastos administrativos y comisiones de apertura. Consulta a tu banco el importe total de la cuota.",
"What is an amortization schedule?":"¿Qué es un cuadro de amortización?",
"An amortization schedule shows month-by-month how each payment is split between principal and interest, and tracks the remaining balance after each payment.":"Un cuadro de amortización muestra mes a mes cómo se reparte cada cuota entre capital e intereses y el saldo pendiente tras cada pago.",
"What is a healthy debt-to-income ratio?":"¿Qué ratio de endeudamiento es saludable?",
"Acceptable debt-to-income ratios vary by bank and individual circumstances — there is no universal rule. Consult your lender to find out the limit that applies to your situation.":"El ratio de endeudamiento aceptable varía según el banco y las circunstancias de cada persona: no hay una regla universal. Consulta a tu entidad el límite que se aplica en tu caso.",
"Does early repayment save interest?":"¿Ahorra intereses la amortización anticipada?",
"Yes. Every extra payment on the principal reduces the remaining balance and therefore interest in future months. Extra payments early in the loan term save significantly more than later. Check your contract for any early repayment penalty.":"Sí. Cada pago extra de capital reduce el saldo pendiente y, por tanto, los intereses de los meses siguientes. Los pagos extra al principio del préstamo ahorran mucho más que los posteriores. Revisa en tu contrato si hay penalización por amortización anticipada.",
"What is the difference between Islamic finance and a conventional loan?":"¿Qué diferencia hay entre la financiación islámica y un préstamo convencional?",
"In Islamic finance (Murabaha/Ijara), the bank buys the asset and sells it at a pre-agreed profit — technically no interest. In a conventional loan, interest accrues on the remaining balance monthly. This calculator works for both if you enter the equivalent annual rate.":"En la financiación islámica (murabaha/iyara), el banco compra el bien y lo vende con un margen acordado de antemano, técnicamente sin intereses. En un préstamo convencional, los intereses se generan cada mes sobre el saldo pendiente. Esta calculadora sirve para ambos si introduces el tipo anual equivalente.",

"The calculator uses the standard amortization formula:":"La calculadora usa la fórmula de amortización estándar:",
"Payment = P × [r(1+r)ⁿ] ÷ [(1+r)ⁿ − 1]":"Cuota = P × [r(1+r)ⁿ] ÷ [(1+r)ⁿ − 1]",
", where P is the principal, r is the monthly interest rate (annual rate ÷ 12), and n is the total number of monthly payments. Results are estimates — actual bank payments may include fees, insurance, or early-settlement charges.":", donde P es el capital, r el tipo de interés mensual (tipo anual ÷ 12) y n el número total de cuotas mensuales. Los resultados son estimaciones: las cuotas reales del banco pueden incluir comisiones, seguros o penalizaciones por cancelación anticipada.",
"Total interest vs. monthly payment":"Total de intereses frente a cuota mensual",
"A lower monthly payment is not always better. A 5-year loan costs less total interest than a 10-year loan at the same rate, even though the monthly payment is higher. Use the repayment schedule to compare the total interest paid over the full loan term.":"Una cuota más baja no siempre es mejor. Un préstamo a 5 años cuesta menos intereses en total que uno a 10 años al mismo tipo, aunque la cuota mensual sea más alta. Usa el cuadro de amortización para comparar el total de intereses durante todo el préstamo.",
