<script>
// Values in baisa (1 OMR = 1000 baisa)
const COINS = [
  {v:5,  label:'5 Bz',  color:'#a3a3a3', size:40, type:'coin'},
  {v:10, label:'10 Bz', color:'#94a3b8', size:44, type:'coin'},
  {v:25, label:'25 Bz', color:'#78716c', size:48, type:'coin'},
  {v:50, label:'50 Bz', color:'#b45309', size:52, type:'coin'},
  {v:100,label:'100 Bz',color:'#d97706', size:56, type:'coin'},
];
const NOTES = [
  {v:100,  label:'100 Bz', color:'#7c3aed', type:'note'},
  {v:200,  label:'200 Bz', color:'#2563eb', type:'note'},
  {v:500,  label:'500 Bz', color:'#047857', type:'note'},
  {v:1000, label:'1 OMR',  color:'#b91c1c', type:'note'},
  {v:5000, label:'5 OMR',  color:'#c2410c', type:'note'},
  {v:10000,label:'10 OMR', color:'#1e40af', type:'note'},
  {v:20000,label:'20 OMR', color:'#065f46', type:'note'},
];

const MT = {
  en:{subtitle:'Omani Rials & Baisa — Ages 7–12',tabCoins:'🪙 Coins',tabNotes:'💵 Notes',tabMixed:'🎲 Mixed',
      howMuch:'How much money is shown?',totalEq:'Total = ?',score:'Score',q:'Q',of:'of',
      correct:v=>`✅ Correct! ${v}`,wrong:v=>`❌ Answer: ${v}`,correctSpoken:'Correct!',playAgain:'Play Again',
      master:'🏆 Money Master!',great:'👍 Great counting!',keep:'💪 Keep practicing!',
      guideTitle:'💡 Oman Money Guide',mathGame:'➕ Math Game',allKidsTools:'🧒 All Kids Tools',currencyConverter:'💱 Currency Converter',
      backToKids:'← Back to Kids',kids:'🧒 Kids',home:'Home'},
  ar:{subtitle:'الريال العماني والبيسة — للأطفال من 7 إلى 12 سنة',tabCoins:'🪙 عملات معدنية',tabNotes:'💵 أوراق نقدية',tabMixed:'🎲 مختلط',
      howMuch:'كم المبلغ الظاهر؟',totalEq:'المجموع = ؟',score:'النتيجة',q:'سؤال',of:'من',
      correct:v=>`✅ إجابة صحيحة! ${v}`,wrong:v=>`❌ الإجابة: ${v}`,correctSpoken:'إجابة صحيحة!',playAgain:'العب مجدداً',
      master:'🏆 سيد النقود!',great:'👍 عد رائع!',keep:'💪 استمر في التمرين!',
      guideTitle:'💡 دليل العملة العمانية',mathGame:'➕ لعبة الرياضيات',allKidsTools:'🧒 كل أدوات الأطفال',currencyConverter:'💱 محول العملات',
      backToKids:'← رجوع للأطفال',kids:'🧒 الأطفال',home:'الرئيسية'},
  fr:{subtitle:'Rials et Baisas omanais — 7 à 12 ans',tabCoins:'🪙 Pièces',tabNotes:'💵 Billets',tabMixed:'🎲 Mixte',
      howMuch:'Combien d\'argent est affiché ?',totalEq:'Total = ?',score:'Score',q:'Q',of:'sur',
      correct:v=>`✅ Correct ! ${v}`,wrong:v=>`❌ Réponse : ${v}`,correctSpoken:'Correct !',playAgain:'Rejouer',
      master:'🏆 Maître de l\'argent !',great:'👍 Bien compté !',keep:'💪 Continue à t\'entraîner !',
      guideTitle:'💡 Guide de la monnaie omanaise',mathGame:'➕ Jeu de calcul',allKidsTools:'🧒 Tous les jeux enfants',currencyConverter:'💱 Convertisseur de devises',
      backToKids:'← Retour aux jeux enfants',kids:'🧒 Enfants',home:'Accueil'},
  es:{subtitle:'Riales y Baisas omaníes — 7 a 12 años',tabCoins:'🪙 Monedas',tabNotes:'💵 Billetes',tabMixed:'🎲 Mixto',
      howMuch:'¿Cuánto dinero se muestra?',totalEq:'Total = ?',score:'Puntaje',q:'P',of:'de',
      correct:v=>`✅ ¡Correcto! ${v}`,wrong:v=>`❌ Respuesta: ${v}`,correctSpoken:'¡Correcto!',playAgain:'Jugar de nuevo',
      master:'🏆 ¡Maestro del dinero!',great:'👍 ¡Bien contado!',keep:'💪 ¡Sigue practicando!',
      guideTitle:'💡 Guía de la moneda de Omán',mathGame:'➕ Juego de matemáticas',allKidsTools:'🧒 Todos los juegos infantiles',currencyConverter:'💱 Convertidor de divisas',
      backToKids:'← Volver a juegos infantiles',kids:'🧒 Niños',home:'Inicio'},
  de:{subtitle:'Omanische Rial und Baisa — 7 bis 12 Jahre',tabCoins:'🪙 Münzen',tabNotes:'💵 Scheine',tabMixed:'🎲 Gemischt',
      howMuch:'Wie viel Geld wird angezeigt?',totalEq:'Summe = ?',score:'Punkte',q:'F',of:'von',
      correct:v=>`✅ Richtig! ${v}`,wrong:v=>`❌ Antwort: ${v}`,correctSpoken:'Richtig!',playAgain:'Nochmal spielen',
      master:'🏆 Geldmeister!',great:'👍 Gut gezählt!',keep:'💪 Übe weiter!',
      guideTitle:'💡 Oman-Geld-Leitfaden',mathGame:'➕ Rechenspiel',allKidsTools:'🧒 Alle Kinderspiele',currencyConverter:'💱 Währungsrechner',
      backToKids:'← Zurück zu Kinderspielen',kids:'🧒 Kinder',home:'Startseite'},
  ru:{subtitle:'Оманский риал и байса — от 7 до 12 лет',tabCoins:'🪙 Монеты',tabNotes:'💵 Купюры',tabMixed:'🎲 Смешанно',
      howMuch:'Сколько денег показано?',totalEq:'Итого = ?',score:'Счёт',q:'Вопрос',of:'из',
      correct:v=>`✅ Правильно! ${v}`,wrong:v=>`❌ Ответ: ${v}`,correctSpoken:'Правильно!',playAgain:'Играть снова',
      master:'🏆 Мастер денег!',great:'👍 Отлично посчитано!',keep:'💪 Продолжай тренироваться!',
      guideTitle:'💡 Гид по деньгам Омана',mathGame:'➕ Игра с числами',allKidsTools:'🧒 Все детские игры',currencyConverter:'💱 Конвертер валют',
      backToKids:'← Назад к детским играм',kids:'🧒 Детям',home:'Главная'},
};
const _PAGE_LANG = (document.documentElement.lang && MT[document.documentElement.lang]) ? document.documentElement.lang : 'en';
let currentLang=_PAGE_LANG;
function mt(k){return (MT[currentLang]||MT.en)[k];}

const SPEECH_LANG_CODES = {ar:'ar-SA',en:'en-US',fr:'fr-FR',es:'es-ES',de:'de-DE',ru:'ru-RU'};
const TOTAL=10;
let mode='coins', score=0, qIdx=0, answered=false, questions=[];

function setMode(m){
  mode=m;
  ['coins','notes','mixed'].forEach(x=>{
    document.getElementById('tab'+x.charAt(0).toUpperCase()+x.slice(1)).classList.toggle('active',x===m);
  });
  startGame();
}

function randInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}

function formatVal(v){
  if(v<1000) return v+'Bz';
  return (v/1000).toFixed(v%1000===0?0:3).replace(/\.?0+$/,'')+ ' OMR';
}

function makeQ(){
  let pool;
  if(mode==='coins') pool=COINS;
  else if(mode==='notes') pool=NOTES;
  else pool=[...COINS,...NOTES];

  const count=randInt(2,4);
  const picked=Array.from({length:count},()=>pool[randInt(0,pool.length-1)]);
  const total=picked.reduce((s,x)=>s+x.v,0);
  return {items:picked, total};
}

function makeChoices(correct){
  const s=new Set([correct]);
  const deltas=[50,100,250,500,1000,-50,-100,-250,-500];
  let itr=0;
  while(s.size<4&&itr<50){
    itr++;
    const d=deltas[randInt(0,deltas.length-1)];
    const v=correct+d;
    if(v>0&&!s.has(v)) s.add(v);
  }
  while(s.size<4) s.add(correct+randInt(100,500));
  return [...s].sort(()=>Math.random()-.5);
}

function startGame(){
  score=0; qIdx=0; answered=false;
  questions=Array.from({length:TOTAL},makeQ);
  renderQ();
}

function renderQ(){
  if(qIdx>=TOTAL){
    const pct=Math.round(score/TOTAL*100);
    document.getElementById('gameArea').innerHTML=`
      <div style="text-align:center;padding:24px;background:linear-gradient(135deg,#fef9c3,#fde68a);border-radius:16px;">
        <div style="font-size:60px;">💰</div>
        <div style="font-size:22px;font-weight:900;color:#92400e;margin:10px 0;">${pct>=80?mt('master'):pct>=50?mt('great'):mt('keep')}</div>
        <div style="font-size:15px;color:var(--text-muted);">${mt('score')}: ${score} / ${TOTAL} (${pct}%)</div>
        <button class="btn btn-primary" style="margin-top:16px;" onclick="startGame()">${mt('playAgain')}</button>
      </div>`;
    return;
  }
  const q=questions[qIdx];
  document.getElementById('mScore').textContent=`${mt('score')}: ${score} / ${TOTAL} | ${mt('q')} ${qIdx+1} ${mt('of')} ${TOTAL}`;

  const display=q.items.map(item=>{
    if(item.type==='coin'){
      return `<div class="coin" style="width:${item.size}px;height:${item.size}px;background:${item.color};">${item.label}</div>`;
    } else {
      return `<div class="note" style="background:${item.color};">${item.label}</div>`;
    }
  }).join('');
  document.getElementById('mDisplay').innerHTML=display;
  document.getElementById('mQ').textContent=mt('totalEq');

  const choices=makeChoices(q.total);
  document.getElementById('mChoices').innerHTML=choices.map(c=>
    `<button class="money-choice" onclick="answerQ(this,${c},${q.total})">${formatVal(c)}</button>`
  ).join('');
  document.getElementById('mFeedback').textContent='';
  answered=false;
}

function answerQ(btn,chosen,correct){
  if(answered) return;
  answered=true;
  if(chosen===correct){
    btn.classList.add('correct');score++;
    document.getElementById('mFeedback').textContent=mt('correct')(formatVal(correct));
    if(window.speechSynthesis){const u=new SpeechSynthesisUtterance(mt('correctSpoken'));u.lang=SPEECH_LANG_CODES[currentLang]||'en-US';speechSynthesis.speak(u);}
  } else {
    btn.classList.add('wrong');
    document.querySelectorAll('.money-choice').forEach(b=>{if(b.textContent===formatVal(correct))b.classList.add('correct');});
    document.getElementById('mFeedback').textContent=mt('wrong')(formatVal(correct));
  }
  setTimeout(()=>{qIdx++;renderQ();},1100);
}

function buildRef(){
  const items=[...COINS,...NOTES];
  document.getElementById('mRef').innerHTML=items.map(item=>`
    <div class="money-ref-item">
      <div style="background:${item.color};border-radius:${item.type==='coin'?'50%':'6px'};width:${item.type==='coin'?'40px':'70px'};height:40px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;margin-bottom:4px;">${item.label}</div>
      <div>${item.label}</div>
      <div style="font-size:11px;color:var(--text-muted);">${formatVal(item.v)}</div>
    </div>
  `).join('');
}

function updateStaticText(){
  document.documentElement.dir=currentLang==='ar'?'rtl':'ltr';
  const set=(id,val)=>{const el=document.getElementById(id);if(el)el.textContent=val;};
  set('moneySubtitle',mt('subtitle'));
  set('tabCoins',mt('tabCoins'));
  set('tabNotes',mt('tabNotes'));
  set('tabMixed',mt('tabMixed'));
  set('howMuch',mt('howMuch'));
  set('guideTitle',mt('guideTitle'));
  set('linkMath',mt('mathGame'));
  set('linkAllKids',mt('allKidsTools'));
  set('linkCurrency',mt('currencyConverter'));
  set('backToKids',mt('backToKids'));
  set('navKids',mt('kids'));
  set('navHome',mt('home'));
  buildRef();
}

document.addEventListener('DOMContentLoaded',()=>{
  const origSet=window.setLang;
  window.setLang=function(lang){
    origSet&&origSet(lang);
    currentLang=lang;
    updateStaticText();
    renderQ();
  };
  window.onLangChange=function(lang){currentLang=lang;updateStaticText();renderQ();};
  updateStaticText();
  startGame();
});
</script>
